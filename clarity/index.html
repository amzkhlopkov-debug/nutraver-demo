<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nutraver Clarity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nutraver: cloud VPS and dedicated servers in Equinix data centers in Frankfurt, Amsterdam and Stockholm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --bg-2:#EDF1F8; --surface:#FFFFFF; --surface-2:#F8FAFD; --surface-3:#F1F4FA;
  --fg:#0A1428; --fg-2:#4B5878; --fg-3:#8090AD;
  --line:#E4E9F2; --line-2:#D5DCEA;
  --brand:#1D5BFF; --brand-hover:#1449E6; --brand-press:#0F3CC4; --brand-ink:#1446D6;
  --brand-50:#F0F4FF; --brand-100:#E2EAFF; --brand-200:#C5D5FF; --brand-300:#95B3FF;
  --on-brand:#FFFFFF;
  --ok:#0B9B6A; --ok-bg:#E4F6EE; --warn:#B26A00; --warn-bg:#FFF3DB; --bad:#D92D45; --bad-bg:#FDECEF;
  --sh-1:0 1px 2px rgba(15,30,70,.05);
  --sh-2:0 1px 2px rgba(15,30,70,.04),0 6px 16px -4px rgba(15,30,70,.08);
  --sh-3:0 2px 6px rgba(15,30,70,.04),0 18px 40px -12px rgba(15,30,70,.16);
  --sh-4:0 4px 10px rgba(15,30,70,.05),0 40px 80px -24px rgba(20,50,120,.30);
  --ring:0 0 0 4px rgba(29,91,255,.18);
  --glass:rgba(255,255,255,.76);
  --glow:rgba(29,91,255,.16);
  --dot:#CDD6E8; --dot-hot:#9DB5F5;
  --term:#0C1326; --term-fg:#D5DFF4; --term-dim:#7D8BAE;
  --overlay:rgba(10,20,40,.38);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --gut:16px;
  --f-head:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070D1E; --bg-2:#0B1328; --surface:#0E1730; --surface-2:#121D3A; --surface-3:#172345;
  --fg:#EAF0FF; --fg-2:#A4B1CF; --fg-3:#6D7DA2;
  --line:#1B2746; --line-2:#26355B;
  --brand:#3B74FF; --brand-hover:#5586FF; --brand-press:#2A60EC; --brand-ink:#8EB0FF;
  --brand-50:rgba(59,116,255,.10); --brand-100:rgba(59,116,255,.17); --brand-200:rgba(59,116,255,.32); --brand-300:rgba(59,116,255,.55);
  --ok:#2FD08F; --ok-bg:rgba(47,208,143,.12); --warn:#FFB547; --warn-bg:rgba(255,181,71,.12); --bad:#FF5C70; --bad-bg:rgba(255,92,112,.13);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 8px 22px -6px rgba(0,0,0,.45);
  --sh-3:0 2px 6px rgba(0,0,0,.3),0 22px 44px -12px rgba(0,0,0,.6);
  --sh-4:0 4px 10px rgba(0,0,0,.3),0 40px 80px -20px rgba(0,0,0,.7);
  --ring:0 0 0 4px rgba(59,116,255,.32);
  --glass:rgba(8,14,32,.72);
  --glow:rgba(59,116,255,.22);
  --dot:#1F2C50; --dot-hot:#3D5CB0;
  --term:#050A17; --term-fg:#D5DFF4; --term-dim:#6F7FA3;
  --overlay:rgba(2,6,18,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070D1E; --bg-2:#0B1328; --surface:#0E1730; --surface-2:#121D3A; --surface-3:#172345;
  --fg:#EAF0FF; --fg-2:#A4B1CF; --fg-3:#6D7DA2;
  --line:#1B2746; --line-2:#26355B;
  --brand:#3B74FF; --brand-hover:#5586FF; --brand-press:#2A60EC; --brand-ink:#8EB0FF;
  --brand-50:rgba(59,116,255,.10); --brand-100:rgba(59,116,255,.17); --brand-200:rgba(59,116,255,.32); --brand-300:rgba(59,116,255,.55);
  --ok:#2FD08F; --ok-bg:rgba(47,208,143,.12); --warn:#FFB547; --warn-bg:rgba(255,181,71,.12); --bad:#FF5C70; --bad-bg:rgba(255,92,112,.13);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 8px 22px -6px rgba(0,0,0,.45);
  --sh-3:0 2px 6px rgba(0,0,0,.3),0 22px 44px -12px rgba(0,0,0,.6);
  --sh-4:0 4px 10px rgba(0,0,0,.3),0 40px 80px -20px rgba(0,0,0,.7);
  --ring:0 0 0 4px rgba(59,116,255,.32);
  --glass:rgba(8,14,32,.72);
  --glow:rgba(59,116,255,.22);
  --dot:#1F2C50; --dot-hot:#3D5CB0;
  --term:#050A17; --term-fg:#D5DFF4; --term-dim:#6F7FA3;
  --overlay:rgba(2,6,18,.62);
  color-scheme:dark;
}
@media (min-width:720px){:root{--gut:32px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";overflow-x:hidden;transition:background-color .3s var(--ease)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;color:var(--fg);letter-spacing:-.025em;line-height:1.1;font-weight:800}
p{margin:0}
a{color:var(--brand-ink);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
img{max-width:100%}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.ic-lg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap;transition:transform .18s var(--ease),background-color .18s,box-shadow .2s var(--ease),border-color .18s,color .18s;user-select:none;position:relative}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 1px 2px rgba(20,60,200,.2),0 6px 16px -6px rgba(29,91,255,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.btn-primary:hover{background:var(--brand-hover);box-shadow:0 1px 2px rgba(20,60,200,.2),0 12px 26px -8px rgba(29,91,255,.6),inset 0 1px 0 rgba(255,255,255,.14);transform:translateY(-1px)}
.btn-primary:active{background:var(--brand-press);transform:scale(.97)}
.btn-secondary{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1)}
.btn-secondary:hover{box-shadow:inset 0 0 0 1px var(--brand-300),var(--sh-2);transform:translateY(-1px)}
.btn-tint{background:var(--brand-50);color:var(--brand-ink)}
.btn-tint:hover{background:var(--brand-100)}
.btn-ghost{color:var(--fg-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-danger-soft{background:var(--bad-bg);color:var(--bad)}
.btn-white{background:#fff;color:#0A1428;box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
.btn-white:hover{transform:translateY(-1px)}
.btn-lg{--h:52px;padding:0 26px;font-size:16px}
.btn-sm{--h:36px;padding:0 14px;font-size:14px}
.btn-xs{--h:30px;padding:0 12px;font-size:13px}
.btn-block{width:100%}
.btn[disabled],.btn.is-disabled{opacity:.5;pointer-events:none}
.btn .arr{transition:transform .2s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--fg-2);transition:background-color .15s,color .15s,transform .15s}
.icon-btn:hover{background:var(--surface-3);color:var(--fg)}
.icon-btn:active{transform:scale(.94)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- small atoms ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--surface-3);color:var(--fg-2);font-size:13px;font-weight:500}
.chip-brand{background:var(--brand-50);color:var(--brand-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.no-dot::before{display:none}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--brand-50);color:var(--brand-ink)}
.b-mute{background:var(--surface-3);color:var(--fg-2)}
.b-ok.live::before{box-shadow:0 0 0 0 currentColor;animation:livedot 2s infinite}
@keyframes livedot{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--brand-ink);background:var(--brand-50);padding:6px 12px 6px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--brand-100)}
.eyebrow .pip{width:18px;height:18px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff}
.flag{display:inline-block;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(10,20,40,.08);clip-path:circle(50%);flex-shrink:0;vertical-align:middle}
.flag svg{display:block;width:100%;height:100%}
.pm{display:inline-block;flex-shrink:0;vertical-align:middle;border-radius:6px}
.pm svg{display:block;width:100%;height:100%}
.pm-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1)}
:root[data-theme="dark"] .card{box-shadow:inset 0 0 0 1px var(--line)}
.kbd{font-family:var(--f-mono);font-size:12px;padding:2px 6px;border-radius:6px;background:var(--surface-3)}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--fg)}
.field .hint{font-size:12.5px;color:var(--fg-3)}
.field .err{font-size:12.5px;color:var(--bad);display:none}
.field.has-err .err{display:block}
.field.has-err .input{box-shadow:inset 0 0 0 1.5px var(--bad)}
.input{width:100%;height:46px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);padding:0 14px;font-size:15px;transition:box-shadow .15s;outline:none;color:var(--fg)}
.input::placeholder{color:var(--fg-3)}
.input:hover{box-shadow:inset 0 0 0 1px var(--fg-3)}
.input:focus{box-shadow:inset 0 0 0 1.5px var(--brand),var(--ring)}
textarea.input{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.5}
select.input{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .input{padding-right:48px}
.input-wrap .adorn{position:absolute;right:6px}
.input-wrap .lead-ic{position:absolute;left:14px;color:var(--fg-3);pointer-events:none}
.input-wrap .input.has-lead{padding-left:42px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg-2);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand);margin:2px 0 0;flex-shrink:0}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* switch */
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line-2);transition:background-color .25s var(--ease);flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* segmented with sliding thumb */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,2));border-radius:999px;background:var(--surface);box-shadow:var(--sh-2),inset 0 0 0 1px var(--line);transform:translateX(calc(100% * var(--i,0)));transition:transform .38s var(--ease)}
.seg button{position:relative;z-index:1;height:38px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--fg-2);transition:color .2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg-sm button{height:30px;padding:0 12px;font-size:13px}

/* tabs (panel) */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);font-weight:600;font-size:14px;white-space:nowrap;border-radius:10px 10px 0 0;transition:color .15s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--brand-ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand);animation:tabin .3s var(--ease)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}

/* table */
.tbl-box{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:left;font-weight:600;color:var(--fg-3);font-size:12.5px;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color .15s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}

/* modal + toast */
#modal-root{position:relative;z-index:200}
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s var(--ease);z-index:200}
.modal{width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:24px;box-shadow:var(--sh-4),inset 0 0 0 1px var(--line);padding:28px;animation:pop .35s var(--ease)}
.modal h3{font-size:22px;margin-bottom:8px}
.modal .m-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand);margin-bottom:16px}
.modal .m-ic.danger{background:var(--bad-bg);color:var(--bad)}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
@media (max-width:560px){.overlay{place-items:end center;padding:0}.modal{border-radius:24px 24px 0 0;width:100%;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:sheet .4s var(--ease)}.modal .m-actions .btn{flex:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes sheet{from{transform:translateY(100%)}}
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:#0E1730;color:#fff;padding:12px 18px 12px 14px;border-radius:14px;box-shadow:var(--sh-3);font-size:14px;font-weight:500;animation:toastin .4s var(--ease);pointer-events:auto}
:root[data-theme="dark"] .toast{background:#1E2B52}
.toast .t-ic{width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.toast.out{animation:toastout .3s var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
@media (max-width:900px){.in-panel #toasts{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-in{display:flex;align-items:center;height:68px;gap:24px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--fg)}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(29,91,255,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a,.nav button{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;color:var(--fg-2);font-weight:500;font-size:15px;transition:color .15s,background-color .15s}
.nav a:hover,.nav button:hover{color:var(--fg);background:var(--surface-3)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line)}
.lang button{height:30px;min-width:38px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-3);transition:all .2s}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--sh-1),inset 0 0 0 1px var(--line)}
.burger{display:none}
.mnav{position:fixed;inset:68px 0 auto 0;z-index:49;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-3);padding:12px max(16px,env(safe-area-inset-left,0px)) 20px;display:none;animation:dropin .3s var(--ease)}
.mnav.open{display:block}
.mnav a,.mnav button.mlink{display:flex;width:100%;height:50px;align-items:center;font-weight:600;font-size:17px;color:var(--fg);border-bottom:1px solid var(--line)}
.mnav .row{margin-top:16px}
.mnav .row .btn{flex:1}
@keyframes dropin{from{opacity:0;transform:translateY(-8px)}}
@media (max-width:980px){.nav,.hdr .hide-m{display:none}.burger{display:inline-grid}}

/* ---------- hero ---------- */
.hero{position:relative;padding:56px 0 64px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% -10% auto 30%;height:900px;background:radial-gradient(closest-side,var(--glow),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;mask-image:radial-gradient(60% 60% at 75% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(60% 60% at 75% 40%,#000 20%,transparent 75%);opacity:.7;pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.12fr 1fr;gap:40px;align-items:center;min-height:620px}
.hero h1{font-size:clamp(38px,4.6vw,62px);letter-spacing:-.045em;line-height:1.02;margin:22px 0 22px}
.hero h1 .accent{color:var(--brand);display:block}
.hero .lead{font-size:clamp(17px,1.5vw,20px);color:var(--fg-2);max-width:540px;line-height:1.55}
.hero-cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero-meta{display:flex;align-items:center;gap:16px;margin-top:32px;flex-wrap:wrap;color:var(--fg-3);font-size:14px}
.hero-meta .sep{width:1px;height:20px;background:var(--line-2)}
.enter{animation:enter .9s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}.d5{animation-delay:.42s}.d6{animation-delay:.56s}.d7{animation-delay:.7s}
@keyframes enter{from{opacity:0;transform:translateY(18px)}}

.stage{position:relative;height:600px;perspective:1800px}
.stack{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(-13deg) rotateX(7deg) rotateZ(1.5deg);transition:transform .8s var(--ease)}
.stage:hover .stack{transform:rotateY(-8deg) rotateX(4deg) rotateZ(.5deg)}
.layer{position:absolute;transform-style:preserve-3d}
.layer-deploy{left:12%;top:9%;width:min(350px,64%);transform:translateZ(0)}
.layer-ready{right:-4%;top:-2%;width:min(240px,46%);transform:translateZ(70px)}
.layer-pay{left:-5%;bottom:-6%;width:min(262px,50%);transform:translateZ(50px)}
.layer-ping{right:-2%;bottom:-1%;width:min(200px,40%);transform:translateZ(90px)}
.float{animation:float 7s ease-in-out infinite}
.layer-ready .float{animation-delay:-2s;animation-duration:6.4s}
.layer-pay .float{animation-delay:-4s;animation-duration:7.6s}
.layer-ping .float{animation-delay:-1s;animation-duration:5.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ui{background:var(--surface);border-radius:22px;box-shadow:var(--sh-4),inset 0 0 0 1px var(--line);padding:18px;animation:uiin 1s var(--ease) both}
.layer-deploy .ui{animation-delay:.25s}.layer-ready .ui{animation-delay:.55s}.layer-pay .ui{animation-delay:.75s}.layer-ping .ui{animation-delay:.95s}
@keyframes uiin{from{opacity:0;transform:translateY(30px) scale(.96)}}
.ui-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ui-t{font-family:var(--f-head);font-weight:800;font-size:16px;letter-spacing:-.02em}
.ui-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px;font-size:14px}
.ui-row.sel{background:var(--brand-50);box-shadow:inset 0 0 0 1.5px var(--brand)}
.ui-row .k{color:var(--fg-3);font-size:12px;display:block;line-height:1.2}
.ui-row .v{font-weight:600;display:block}
.ui-row .ri{margin-left:auto;color:var(--brand)}
.ui-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand);flex-shrink:0}
.ui-price{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 2px 12px}
.ui-price b{font-family:var(--f-head);font-size:30px;letter-spacing:-.03em;line-height:1}
.ui-price span{color:var(--fg-3);font-size:13px}
.ui .btn{height:44px}
.ready-ic{width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.ready-ic svg{stroke-width:2.4}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.kv .k{color:var(--fg-3)}
.kv .v{font-weight:600}
.ping-big{font-family:var(--f-head);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.spark{display:block;width:100%;height:46px;margin-top:6px}

/* marquee */
.marq{position:relative;padding:28px 0 20px}
.marq-label{text-align:center;color:var(--fg-3);font-size:13.5px;font-weight:500;margin-bottom:18px}
.marq-vp{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq-track{display:flex;gap:16px;width:max-content;animation:marq 38s linear infinite}
.marq-vp:hover .marq-track{animation-play-state:paused}
.marq-item{height:64px;padding:0 22px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);display:flex;align-items:center;justify-content:center}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:96px 0}
.sec-tight{padding:64px 0}
.sec-h{max-width:720px;margin-bottom:48px}
.sec-h.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-h h2{font-size:clamp(32px,4vw,52px);letter-spacing:-.04em;margin:16px 0 16px}
.sec-h p{font-size:18px;color:var(--fg-2)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand-ink);display:inline-flex;align-items:center;gap:8px}
.kicker::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--brand)}
@media (max-width:720px){.sec{padding:64px 0}.sec-h{margin-bottom:32px}.sec-h p{font-size:16px}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:24px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);display:flex;flex-direction:column;gap:6px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.stat:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--line),var(--sh-3)}
.stat .s-ic{width:40px;height:40px;border-radius:12px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.stat b{font-family:var(--f-head);font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1.05}
.stat span{color:var(--fg-2);font-size:14.5px}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.stat{padding:18px}.stat b{font-size:28px}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{position:relative;overflow:hidden;border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);padding:28px;display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tile:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--brand-200),var(--sh-3)}
.tile h3{font-size:22px;letter-spacing:-.03em;margin:16px 0 8px}
.tile p{color:var(--fg-2);font-size:15px;max-width:440px}
.t-ic{width:44px;height:44px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--brand-100)}
.t-7{grid-column:span 7}.t-5{grid-column:span 5}.t-4{grid-column:span 4}.t-6{grid-column:span 6}
.tile-viz{margin-top:auto;padding-top:24px}
.tile-hero{background:linear-gradient(160deg,var(--brand-50),var(--surface) 55%)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--fg-2)}
.bar-l b{color:var(--fg);font-weight:700}
.bar{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--brand);transform-origin:left;animation:grow 1.6s var(--ease) both .3s}
.bar i.dim{background:var(--fg-3);opacity:.45}
@keyframes grow{from{transform:scaleX(0)}}
.shield-viz{display:flex;align-items:center;gap:16px}
.shield-viz svg.big{width:100%;height:96px}
.snap-list{display:flex;flex-direction:column;gap:8px}
.snap{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}
.snap .dotc{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.snap .tm{margin-left:auto;color:var(--fg-3);font-size:12.5px}
.pw-viz{display:flex;flex-direction:column;gap:8px}
.ip-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;max-width:100%;overflow:hidden}
.ip-chip .tag{font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand-50);border-radius:6px;padding:2px 6px;font-family:var(--f-body)}
.toggles{display:flex;flex-direction:column;gap:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500}
.resize-viz{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.resize-viz .rz{padding:10px 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}
.resize-viz .rz b{display:block;font-family:var(--f-head);font-size:16px}
.resize-viz .rz.on{background:var(--brand-50);box-shadow:inset 0 0 0 1.5px var(--brand)}
@media (max-width:980px){.t-7,.t-5{grid-column:span 12}.t-4{grid-column:span 6}.t-6{grid-column:span 12}}
@media (max-width:640px){.t-4{grid-column:span 12}.tile{padding:22px}}

/* pricing */
.price-ctrl{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:40px}
.period{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:14px;color:var(--fg-2);cursor:pointer;padding:6px 6px 6px 0}
.period .on{color:var(--fg)}
.save{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.pgrid{display:grid;gap:16px;align-items:stretch;transition:opacity .25s}
.pgrid.vps{grid-template-columns:repeat(5,1fr)}
.pgrid.ded{grid-template-columns:repeat(4,1fr)}
.pgrid.swap{opacity:0}
.pcard{position:relative;display:flex;flex-direction:column;padding:24px 22px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);transition:transform .3s var(--ease),box-shadow .3s var(--ease);animation:enter .6s var(--ease) both}
.pcard:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--brand-200),var(--sh-3)}
.pcard.pop{box-shadow:inset 0 0 0 2px var(--brand),0 24px 48px -16px rgba(29,91,255,.4);transform:translateY(-8px)}
.pcard.pop:hover{transform:translateY(-12px)}
.pcard .pop-b{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 14px -4px rgba(29,91,255,.6)}
.pcard h3{font-size:20px;letter-spacing:-.02em}
.pcard .cpu-n{font-size:13px;color:var(--fg-2);margin-top:4px;min-height:20px}
.pprice{margin:18px 0 4px;display:flex;align-items:baseline;gap:4px}
.pprice b{font-family:var(--f-head);font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1}
.pprice span{color:var(--fg-3);font-size:14px}
.pold{font-size:13px;color:var(--fg-3);min-height:20px}
.pold s{margin-right:6px}
.specs{list-style:none;padding:0;margin:18px 0 22px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.specs li{display:flex;align-items:center;gap:10px;color:var(--fg-2)}
.specs li b{color:var(--fg);font-weight:600}
.specs .ic{color:var(--brand);width:18px;height:18px}
.pcard .btn{margin-top:auto}
.incl{margin-top:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 24px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.incl-l{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--fg-2)}
.incl-l span{display:inline-flex;align-items:center;gap:6px}
.incl-l .ic{color:var(--ok);width:16px;height:16px}
@media (max-width:1180px){.pgrid.vps{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.pgrid.ded{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.pgrid.vps,.pgrid.ded{grid-template-columns:1fr}.pcard.pop{transform:none}.pcard.pop:hover{transform:translateY(-4px)}}

/* locations */
.loc-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:stretch}
.map-card{position:relative;border-radius:var(--r-xl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);overflow:hidden;display:flex;align-items:center}
.map-card>div{width:100%}
.map-card::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 45% 55%,var(--brand-50),transparent 70%)}
.map-svg{position:relative;display:block;width:100%;height:auto}
.map-svg .land{fill:var(--dot)}
.map-svg .hot{fill:var(--dot-hot)}
.map-svg .arc{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;opacity:.9;stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
.map-svg .arc-glow{fill:none;stroke:var(--brand);stroke-width:8;opacity:.08;stroke-linecap:round}
@keyframes dash{to{stroke-dashoffset:-28}}
.map-svg .pt{fill:var(--brand)}
.map-svg .pt-ring{fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
.map-svg .pt-ring.r2{animation-delay:1.2s}
.map-svg .pt-halo{fill:var(--surface);stroke:var(--brand);stroke-width:2}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.packet{offset-rotate:0deg;animation:travel 3.2s linear infinite;fill:var(--brand)}
@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
.map-tag{position:absolute;transform:translate(-50%,calc(-100% - 18px));display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-3),inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;white-space:nowrap;transition:transform .3s var(--ease),box-shadow .3s}
.map-tag .ms{color:var(--ok);font-weight:600;font-size:12px}
.map-tag.hl{box-shadow:var(--sh-3),inset 0 0 0 2px var(--brand)}
.map-tag.tag-below{transform:translate(-50%,18px)}
.map-tag.tag-left{transform:translate(calc(-100% - 16px),-50%)}
.map-legend{position:absolute;left:20px;bottom:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.lcards{display:flex;flex-direction:column;gap:12px}
.lcard{display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1);transition:transform .3s var(--ease),box-shadow .3s var(--ease);cursor:default;flex:1}
.lcard:hover,.lcard.hl{transform:translateX(-4px);box-shadow:inset 0 0 0 1.5px var(--brand),var(--sh-3)}
.lcard h3{font-size:18px;letter-spacing:-.02em}
.lcard .ctry{color:var(--fg-3);font-size:13px;font-weight:500;margin-left:6px;font-family:var(--f-body);letter-spacing:0}
.lcard .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lcard .ping{margin-left:auto;text-align:right;flex-shrink:0}
.lcard .ping b{font-family:var(--f-head);font-size:22px;letter-spacing:-.03em;display:block;line-height:1.1}
.lcard .ping span{font-size:12px;color:var(--fg-3)}
@media (max-width:980px){.loc-grid{grid-template-columns:1fr}.map-card{min-height:0}.lcard:hover,.lcard.hl{transform:translateY(-2px)}}
@media (max-width:560px){.map-tag{font-size:11.5px;padding:4px 9px 4px 4px;gap:5px}.map-tag .ms{display:none}.lcard{padding:16px;gap:12px}.lcard .ping b{font-size:18px}}

/* equinix */
.eqx{position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,var(--brand-50),var(--surface) 60%);box-shadow:inset 0 0 0 1px var(--brand-100),var(--sh-2);padding:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.eqx h2{font-size:clamp(30px,3.6vw,46px);letter-spacing:-.04em;margin:16px 0 16px}
.eqx .lead{color:var(--fg-2);font-size:17px;margin-bottom:28px}
.eq-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.eq-list li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--fg-2)}
.eq-list li b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}
.eq-list .t-ic{width:38px;height:38px;border-radius:12px;background:var(--surface)}
.uptime{position:relative;text-align:center;padding:40px 24px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-3),inset 0 0 0 1px var(--line)}
.uptime .big{font-family:var(--f-head);font-weight:800;font-size:clamp(64px,8vw,104px);letter-spacing:-.06em;line-height:1;color:var(--brand)}
.uptime .cap{font-size:16px;color:var(--fg-2);margin-top:10px}
.upbars{display:flex;gap:3px;justify-content:center;margin-top:28px;height:34px;align-items:flex-end}
.upbars i{width:6px;height:100%;border-radius:3px;background:var(--ok);opacity:.85;animation:grow-y .8s var(--ease) both}
.upbars i.w{background:var(--warn);height:70%}
@keyframes grow-y{from{transform:scaleY(.1)}}
.upleg{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-3);margin-top:8px}
.ix-row{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
@media (max-width:980px){.eqx{grid-template-columns:1fr;padding:32px 24px;gap:32px}.eq-list{grid-template-columns:1fr}}
@media (max-width:420px){.eqx{padding:28px 18px;border-radius:24px}}

/* panel preview */
.pv{display:grid;grid-template-columns:1fr 1.5fr;gap:48px;align-items:center}
.pv-list{list-style:none;padding:0;margin:24px 0 32px;display:flex;flex-direction:column;gap:14px}
.pv-list li{display:flex;gap:12px;align-items:center;font-size:15.5px;color:var(--fg-2)}
.pv-list .ck{width:24px;height:24px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center}
.pv-list .ck svg{stroke-width:2.6}
.pv-frame{position:relative;border-radius:24px;background:var(--surface);box-shadow:var(--sh-4),inset 0 0 0 1px var(--line);overflow:hidden;display:grid;grid-template-columns:64px 1fr;min-height:400px;transition:transform .5s var(--ease)}
.pv-frame:hover{transform:translateY(-6px)}
.pv-side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.pv-side .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg-3)}
.pv-side .si.on{background:var(--brand-50);color:var(--brand)}
.pv-main{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pv-top{display:flex;justify-content:space-between;align-items:center}
.pv-top h4{font-size:18px}
.pv-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pv-c{padding:14px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface)}
.pv-c .k{font-size:12px;color:var(--fg-3)}
.pv-c b{font-family:var(--f-head);font-size:20px;letter-spacing:-.03em;display:block;margin-top:2px}
.pv-srv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}
.pv-srv .nm{font-weight:600}
.pv-srv .sub{color:var(--fg-3);font-size:12px}
@media (max-width:980px){.pv{grid-template-columns:1fr}}
@media (max-width:560px){.pv-frame{grid-template-columns:1fr}.pv-side{display:none}.pv-cards{grid-template-columns:1fr 1fr}.pv-cards .pv-c:last-child{display:none}.pv-srv .hide-s{display:none}}

/* steps */

faq_q1:'Which payment methods do you accept?',faq_a1:'Visa and Mastercard cards, Apple Pay, Google Pay, and crypto: USDT on TRON (TRC-20) or Ethereum (ERC-20), Bitcoin, Ethereum and Litecoin. You can also keep a balance in your account and pay from it.',
faq_q2:'Can I get a refund?',faq_a2:'Yes. VPS plans come with a 14-day money-back guarantee — if it’s not for you, write to support and we refund the full amount to your balance or original payment method. Dedicated servers are built to order and are not refundable after setup.',
faq_q3:'Do I need to verify my identity (KYC)?',faq_a3:'No documents are needed to order a VPS — an email address is enough. For dedicated servers and large orders we may ask for basic contact or company details to prevent abuse.',

faq_q5:'Can I upgrade my plan later?',faq_a5:'Yes. You can move to a larger VPS plan from the panel in a couple of clicks. You keep your IP addresses and data, and we only charge the difference for the rest of the billing period.',
faq_q6:'Are my servers protected from DDoS attacks?',faq_a6:'Network-level DDoS filtering is included on every server at no cost. For websites and APIs you can add L7 protection for €5/mo.',

/* ---------- toast / modal ---------- */
function toast(msg,kind){
  const box=$('#toasts');const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  el.innerHTML=`<span class="t-ic" style="${kind==='info'?'background:var(--brand)':kind==='bad'?'background:var(--bad)':''}">${ic(kind==='info'?'info':kind==='bad'?'x':'check','ic-sm')}</span><span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},2800);
}
let modalReturn=null;
function modal(html,opts={}){
  modalReturn=document.activeElement;
  $('#modal-root').innerHTML=`<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" ${opts.wide?'style="width:min(560px,100%)"':''}>${html}</div></div>`;
  const f=$('#modal-root [autofocus]')||$('#modal-root .modal button, #modal-root .modal input');
  if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(){$('#modal-root').innerHTML='';if(modalReturn&&modalReturn.focus&&document.contains(modalReturn))modalReturn.focus();modalReturn=null}
let confirmCb=null;
function confirmDlg({title,text,ok,danger,icon,onOk}){
  confirmCb=onOk;
  modal(`<div class="m-ic ${danger?'danger':''}">${ic(icon||(danger?'alert':'info'),'ic-lg')}</div><h3 id="m-title">${esc(title)}</h3><p class="muted">${esc(text)}</p>
  <div class="m-actions"><button class="btn btn-secondary" data-act="modal-close">${t('cancel')}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="confirm-ok" autofocus>${esc(ok)}</button></div>`);
}

/* ---------- copy ---------- */
function copyText(text,srcEl){
  const sel=()=>{if(!srcEl)return;try{const r=document.createRange();r.selectNodeContents(srcEl);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t('copy_manual'),'info')}catch(e){}};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(sel)}
    else sel();
  }catch(e){sel()}
}

/* ---------- charts ---------- */
let gidN=0;
function smoothPath(pts){
  if(pts.length<2)return '';
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function areaChart(sets,{w=600,h=160,max=100,grid=true,pad=6}={}){

/* ---------- pseudo QR ---------- */
function drawQR(cv,text){
  if(!cv)return;const n=29,dpr=Math.max(2,window.devicePixelRatio||1),size=172;
  cv.width=size*dpr;cv.height=size*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  c.fillStyle='#fff';c.fillRect(0,0,size,size);
  const m=size/n;let seed=0;for(const ch of text)seed=(seed*31+ch.charCodeAt(0))>>>0;
  const r=()=>{seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296};
  const finder=(x,y)=>(x>=0&&x<7&&y>=0&&y<7);
  const inF=(x,y)=>finder(x,y)||finder(x-(n-7),y)||finder(x,y-(n-7));
  c.fillStyle='#0A1428';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(inF(x,y))continue;
    if(x>=11&&x<=17&&y>=11&&y<=17)continue;
    if((y===6||x===6)?((x+y)%2===0):r()>.52){c.beginPath();c.roundRect?c.roundRect(x*m+.4,y*m+.4,m-.8,m-.8,1.4):c.rect(x*m,y*m,m,m);c.fill()}
  }
  const drawF=(fx,fy)=>{c.fillStyle='#0A1428';c.beginPath();(c.roundRect?c.roundRect(fx*m,fy*m,7*m,7*m,m*1.6):c.rect(fx*m,fy*m,7*m,7*m));c.fill();c.fillStyle='#fff';c.beginPath();(c.roundRect?c.roundRect((fx+1)*m,(fy+1)*m,5*m,5*m,m*1.1):c.rect((fx+1)*m,(fy+1)*m,5*m,5*m));c.fill();c.fillStyle='#1D5BFF';c.beginPath();(c.roundRect?c.roundRect((fx+2)*m,(fy+2)*m,3*m,3*m,m*.8):c.rect((fx+2)*m,(fy+2)*m,3*m,3*m));c.fill()};
  drawF(0,0);drawF(n-7,0);drawF(0,n-7);
}

function summaryLines(){

  let h=line(t('product'),o.type==='ded'?t('dedicated'):'Cloud VPS')+line(t('plan'),`${c.p.name} · ${eur(c.p.price,{cents:1})}`)+line(t('location'),`<span class="row" style="gap:6px;justify-content:flex-end">${flag(l.flag,16)}${t('loc_'+l.id)}</span>`)+line(t('image'),imgName(o.image));
  if(c.win)h+=line(t('win_lic'),'+'+eur(c.win,{cents:1}));

function finishPayment(method){
  const co=S.checkout;if(!co)return;
  const inv={id:'INV-2026-0'+(188+S.invoices.length),date:Date.now(),amount:co.amount,status:'paid',pm:method};
  if(co.kind==='order'){
    const o=S.order,c=calc(o);
    const n=S.servers.length+1;
    const name=(o.hostname||'').trim()||`${o.loc}-${o.type==='ded'?'srv':'web'}-0${n}`;
    const s=mkServer({name:name.slice(0,40),type:o.type,plan:o.plan,loc:o.loc,os:o.image,status:'provisioning',ip4:`${{fra:185,ams:45,sto:94}[o.loc]}.${Math.floor(rnd(100,250))}.${Math.floor(rnd(10,250))}.${Math.floor(rnd(2,250))}`,ip6:`2a0e:5c8${LOCS.findIndex(l=>l.id===o.loc)}:${Math.floor(rnd(1,99))}:${Math.floor(rnd(10,99))}::1`,
      pass:o.auth==='pass'?o.password:genPass(),backups:o.addons.backup,renew:Date.now()+c.months*30*DAY,cpu:series(40,8,4),ram:series(40,18,3),traffic:0,rdns:''});
    S.servers.push(s);inv.kind='new';inv.srv=s.name;
    S.invoices.unshift(inv);
    S.job={srv:s.id,start:Date.now(),dur:7200};S.cur=s.id;
    if(method==='balance')S.balance=round2(S.balance-co.amount);
    S.checkout=null;S.order=defaultOrder();
    go('provisioning');
  }else if(co.kind==='topup'){
    S.balance=round2(S.balance+co.amount);inv.kind='topup';S.invoices.unshift(inv);S.checkout=null;
    toast(t('topup_done',{x:eur(inv.amount,{cents:1})}));go('billing');
  }else{
    const i=S.invoices.find(x=>x.id===co.invId);if(i){i.status='paid';i.pm=method}
    if(method==='balance')S.balance=round2(S.balance-co.amount);
    S.checkout=null;toast(t('inv_paid'));go('billing');
  }
}

function termRun(cmd){
  const s=curSrv(),T=S.term;cmd=cmd.trim();
  T.lines.push(`<span class="pr">root@${esc(s.name)}:~#</span> ${esc(cmd)}`);
  if(cmd){T.hist.push(cmd);T.hi=T.hist.length}
  const p=planOf(s.type,s.plan);
  const up=Math.max(1,Math.round((Date.now()-s.created)/DAY));
  const out={
    help:t('con_help'),
    ls:'<span class="pr">app</span>  <span class="pr">backups</span>  deploy.sh  docker-compose.yml  <span class="pr">logs</span>  README.md',
    'ls -la':'drwx------  6 root root 4096 .\ndrwxr-xr-x 19 root root 4096 ..\n-rw-r--r--  1 root root 3106 .bashrc\ndrwx------  2 root root 4096 .ssh\ndrwxr-xr-x  4 root root 4096 app\n-rwxr-xr-x  1 root root  812 deploy.sh',
    uptime:` ${ftime(Date.now())} up ${up} day${up>1?'s':''},  1 user,  load average: 0.${Math.floor(rnd(10,60))}, 0.${Math.floor(rnd(10,50))}, 0.${Math.floor(rnd(10,40))}`,
    'df -h':`Filesystem      Size  Used Avail Use% Mounted on\n/dev/vda1       ${s.type==='ded'?Math.round(p.ds*1000):p.disk}G   ${s.type==='ded'?Math.round(p.ds*180):Math.round(p.disk*.31)}G  ${s.type==='ded'?Math.round(p.ds*820):Math.round(p.disk*.69)}G  ${s.type==='ded'?18:31}% /\ntmpfs           ${Math.round(p.ram/2)}G     0  ${Math.round(p.ram/2)}G   0% /dev/shm`,
    'free -h':`               total        used        free      shared  buff/cache   available\nMem:            ${p.ram}Gi       ${num(p.ram*.42,1)}Gi       ${num(p.ram*.38,1)}Gi       12Mi       ${num(p.ram*.2,1)}Gi       ${num(p.ram*.55,1)}Gi`,
    whoami:'root',hostname:esc(s.name),
    date:new Date().toUTCString(),
    'uname -a':`Linux ${esc(s.name)} 6.8.0-45-generic x86_64 GNU/Linux`,
    pwd:'/root',
  };
  if(cmd==='clear'){T.lines=[]}
  else if(cmd==='')T.lines.push('');
  else if(out[cmd]!=null)T.lines.push(out[cmd]);
  else T.lines.push(`<span class="dim">${esc(cmd.split(' ')[0])}: ${t('con_nf')}</span>`);
  const b=$('#termB');if(b){b.innerHTML=T.lines.join('\n');b.scrollTop=b.scrollHeight}
}

/* ================= router / render ================= */
const ROUTES=['home','pricing','login','signup','panel','order','checkout','provisioning','server','billing','support','account'];
const PANEL=['panel','order','checkout','provisioning','server','billing','support','account'];
const app=$('#app');
let timers=[];
const every=(fn,ms)=>timers.push(setInterval(fn,ms));
function go(h){S.menu=false;S.mnav=false;if(location.hash.slice(1)===h)route(true);else location.hash=h}
function route(top){
  let r=location.hash.slice(1);
  if(!ROUTES.includes(r))r='home';
  if(PANEL.includes(r)&&!S.user)S.user=demoUser();
  if(r==='checkout'&&!S.checkout)newCheckout('order',calc(S.order).total);
  if(r==='provisioning'&&!S.job){location.replace('#panel');return}
  S.route=r;S.menu=false;S.mnav=false;S.msumOpen=false;
  if(r==='login'||r==='signup'){if(S.user&&!S.after){}}
  render();
  if(r==='pricing'){const el=$('#pricing');if(el)setTimeout(()=>scrollToEl(el,RM()?'auto':'smooth'),40)}
  else if(S.pendingScroll){const el=$('#'+S.pendingScroll);S.pendingScroll=null;if(el)setTimeout(()=>scrollToEl(el,'smooth'),40)}
  else if(top)window.scrollTo(0,0);
}
function scrollToEl(el,b){const y=el.getBoundingClientRect().top+scrollY-76;window.scrollTo({top:y,behavior:b||'smooth'})}
function render(){
  timers.forEach(clearInterval);timers=[];
  const r=S.route;let html;
  switch(r){
    case 'login':html=viewAuth('login');break;
    case 'signup':html=viewAuth('signup');break;
    case 'panel':html=viewDashboard();break;
    case 'order':html=viewOrder();break;
    case 'checkout':html=viewCheckout();break;
    case 'provisioning':html=viewProvisioning();break;
    case 'server':html=viewServer();break;
    case 'billing':html=viewBilling();break;
    case 'support':html=viewSupport();break;
    case 'account':html=viewAccount();break;
    default:html=viewHome();
  }
  app.classList.toggle('noanim',!!S.noAnim);
  app.innerHTML=html;
  document.body.classList.toggle('in-panel',PANEL.includes(r));
  document.documentElement.lang=S.lang;
  const nk={panel:'nav_dashboard',order:'order_h',checkout:'co_h',provisioning:'prov_h',server:'tab_overview',billing:'nav_billing',support:'nav_support',account:'nav_account',login:'li_h',signup:'su_h'}[r];
  document.title=r==='server'&&curSrv()?`${curSrv().name} · Nutraver`:nk?`${t(nk)} · Nutraver`:t('doc_title');
  mount();
}
function rerender(){const y=scrollY;S.noAnim=true;render();S.noAnim=false;window.scrollTo(0,y)}

/* ---------- mount hooks ---------- */
let io=null;
function animateCount(el){
  const v=+el.dataset.count,d=+el.dataset.dec,suf=el.dataset.suf||'';
  if(RM())return;
  const t0=performance.now(),dur=1600;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(2,-10*k);el.textContent=num(k>=1?v:v*e,d)+suf;if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function mount(){
  onScroll();
  const cs=$$('[data-count]');
  if(cs.length&&!S.noAnim&&'IntersectionObserver' in window){
    if(io)io.disconnect();
    io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){animateCount(en.target);io.unobserve(en.target)}}),{threshold:.4});
    cs.forEach(c=>io.observe(c));
  }
  const r=S.route;
  if(r==='checkout'&&S.checkout&&S.checkout.method==='crypto'){
    const c=COINS.find(x=>x.id===S.checkout.coin);drawQR($('#qr'),c.addr+S.checkout.amount);
    const tick=()=>{const co=S.checkout;if(!co)return;let left=Math.max(0,co.deadline-Date.now());if(left<=0){co.deadline=Date.now()+30*60e3;left=30*60e3;toast(t('rate_refresh'),'info')}const m=Math.floor(left/60e3),s=Math.floor(left%60e3/1e3);const el=$('#ctimer');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
    tick();every(tick,1000);
  }
  if(r==='provisioning'&&S.job&&Date.now()-S.job.start<S.job.dur){provTick();every(provTick,120)}
  if(r==='server'){
    const tb=$('#termB');if(tb)tb.scrollTop=tb.scrollHeight;
    every(liveTick,2000);
  }
  if(r==='support'){const th=$('#thread');if(th)th.scrollTop=th.scrollHeight}
}
function provTick(){
  const j=S.job;if(!j)return;
  const el=Date.now()-j.start,pct=Math.min(100,el/j.dur*100),per=j.dur/PSTEPS.length,idx=Math.min(PSTEPS.length,Math.floor(el/per));
  const bar=$('#pvBar');if(!bar)return;
  bar.style.width=pct.toFixed(1)+'%';$('#pvPct').textContent=Math.floor(pct)+'%';
  const left=Math.max(0,Math.ceil((j.dur-el)/1000));$('#pvEta').textContent=t('prov_left',{s:left});
  $$('#pvList .pitem').forEach((it,i)=>{
    const st=i<idx?'done':i===idx?'on':'';
    if(it.dataset.st===st)return;it.dataset.st=st;it.className='pitem '+st;
    it.querySelector('.b').innerHTML=st==='done'?ic('check','ic-sm'):st==='on'?'<span class="spin" style="width:14px;height:14px"></span>':(i+1);
    if(st==='done')it.querySelector('.tm').textContent=num(per*(i+1)/1000,1)+' '+t('u_s');
  });
  if(el>=j.dur){
    timers.forEach(clearInterval);timers=[];
    const s=S.servers.find(x=>x.id===j.srv);if(s)s.status='running';
    setTimeout(()=>{if(S.route==='provisioning')rerender();toast(t('ready_toast'))},500);
  }
}
function liveTick(){
  const s=curSrv();if(!s)return;
  const run=s.status==='running';
  const push=(a,b,amp,mn,mx)=>{const last=a[a.length-1];a.push(run?+Math.max(mn,Math.min(mx,last+rnd(-amp,amp)+(b-last)*.2)).toFixed(1):0);a.shift()};
  push(s.cpu,s.type==='ded'?38:22,8,2,98);push(s.ram,s.type==='ded'?64:46,2,5,95);push(s.nin,38,14,1,95);push(s.nout,22,10,1,90);
  if(S.srvTab!=='overview')return;
  const upd=(id,val,data,color)=>{const v=$('#'+id+'-v'),c=$('#'+id+'-c');if(v)v.textContent=val;if(c)c.innerHTML=areaChart([{data,color}],{h:80,grid:false})};
  const last=a=>a[a.length-1];
  upd('m-cpu',num(last(s.cpu),1)+'%',s.cpu,'var(--brand)');
  upd('m-ram',num(last(s.ram),1)+'%',s.ram,'#7C5CFF');
  upd('m-net',num(last(s.nin),0)+' '+t('u_mbit'),s.nin,'var(--ok)');
}
function onScroll(){const h=$('#hdr');if(h)h.classList.toggle('scrolled',scrollY>8)}
window.addEventListener('scroll',onScroll,{passive:true});

/* ---------- card helpers ---------- */
function luhn(n){let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0}
function setErr(id,on){const f=$('#'+id);if(f)f.classList.toggle('has-err',!!on)}
function validateCard(withName){
  const n=($('#c-num')||{}).value.replace(/\D/g,'');const ex=($('#c-exp')||{}).value||'';const cvc=($('#c-cvc')||{}).value||'';
  const okN=n.length>=13&&n.length<=19&&luhn(n)&&!!cardBrand(n);
  const m=ex.match(/^(\d{2})\/(\d{2})$/);let okE=false;
  if(m){const mm=+m[1],yy=2000+ +m[2];const d=new Date();okE=mm>=1&&mm<=12&&(yy>d.getFullYear()||(yy===d.getFullYear()&&mm>=d.getMonth()+1))}
  const okC=/^\d{3,4}$/.test(cvc);
  const nameEl=$('#c-name');const okName=!withName||!nameEl||nameEl.value.trim().length>1;
  setErr('f-num',!okN);setErr('f-exp',!okE);setErr('f-cvc',!okC);setErr('f-name',!okName);
  return okN&&okE&&okC&&okName?{brand:cardBrand(n),last4:n.slice(-4),exp:ex}:null;
}
function updBrand(){
  const el=$('#c-num'),b=$('#c-brand');if(!el||!b)return;
  const br=cardBrand(el.value);
  b.innerHTML=br?pm(br,22):`${pm('visa',20)}${pm('mc',20)}`;
  b.style.opacity=br?1:.55;
}

function slideSeg(el,then){
  const seg=el.closest('.seg');
  if(seg){const bs=$$('button',seg);const i=bs.indexOf(el);seg.style.setProperty('--i',i);bs.forEach(b=>b.setAttribute('aria-pressed',b===el))}
  setTimeout(then,RM()?0:240);
}
function orderStep(n){
  S.order.step=Math.max(0,Math.min(5,n));S.reanim=true;rerender();S.reanim=false;
  const w=$('.wz-steps');if(w&&w.getBoundingClientRect().top<70)scrollToEl(w,'smooth');
  const cur=$('.wz-step[aria-current="step"]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
}
function needAuth(next){if(S.user){go(next)}else{S.after=next;go('signup')}}

/* ---------- server power ---------- */
function setStatus(s,st,after,ms,msg){
  s.status=st;if(S.route==='server')rerender();
  setTimeout(()=>{s.status=after;if(S.route==='server'&&S.cur===s.id)rerender();if(msg)toast(msg)},ms);
}

  msum(){S.msumOpen=!S.msumOpen;const m=$('#msum');m.classList.toggle('open',S.msumOpen);const b=$('.tt',m);b.setAttribute('aria-expanded',S.msumOpen);b.querySelector('span').innerHTML=`${t('summary')} ${ic(S.msumOpen?'chevD':'chevU','ic-sm')}`},
  /* order */
  'o-type'(el){const v=el.dataset.v;if(S.order.type!==v){S.order.type=v;S.order.plan=v==='ded'?'dryzenx':'pro'}orderStep(1)},
  'o-plan'(el){S.order.plan=el.dataset.v;rerender()},
  'o-loc'(el){S.order.loc=el.dataset.v;rerender()},
  'o-img'(el){S.order.image=el.dataset.v;rerender()},
  'o-ik'(el){const v=el.dataset.v;slideSeg(el,()=>{if(S.order.imageKind!==v){S.order.imageKind=v;S.order.image=v==='app'?'docker':'ubuntu'}rerender()})},
  'o-auth'(el){const v=el.dataset.v;slideSeg(el,()=>{S.order.auth=v;rerender()})},
  'o-key'(el){S.order.keyId=el.dataset.v;rerender();if(el.dataset.v==='new'){const k=$('#o-key');if(k)k.focus()}},
  'o-gen'(){S.order.password=genPass();rerender();toast(t('pass_gen'),'info')},
  'o-addon'(el,e){
    e.stopPropagation();const k=el.dataset.v;S.order.addons[k]=!S.order.addons[k];
    const row=el.closest('.addon');row.classList.toggle('on',S.order.addons[k]);$('.switch',row).setAttribute('aria-checked',S.order.addons[k]);updSummary();
  },
  'o-period'(el){S.order.period=el.dataset.v;rerender()},
  'o-step'(el){orderStep(+el.dataset.v)},
  'o-back'(){orderStep(S.order.step-1)},
  'o-next'(){if(!checkStep())return;orderStep(S.order.step+1)},
  'to-checkout'(){
    if(S.order.auth==='key'&&S.order.keyId==='new'&&!/^(ssh-|ecdsa-)/.test(S.order.keyPaste.trim())){S.order.step=4;toast(t('err_key'),'bad');if(S.route==='order'){orderStep(4)}else go('order');return}
    newCheckout('order',calc(S.order).total);go('checkout');
  },
  /* checkout */
  'co-method'(el){S.checkout.method=el.dataset.v;rerender()},
  'co-card'(el){S.checkout.card=el.dataset.v;rerender()},
  'co-coin'(el){S.checkout.coin=el.dataset.v;S.checkout.cstage=0;rerender()},
  'test-card'(){const n=$('#c-num');n.value='4242 4242 4242 4242';$('#c-exp').value='12/28';$('#c-cvc').value='123';const nm=$('#c-name');if(nm)nm.value=S.user.name;updBrand();['f-num','f-exp','f-cvc','f-name'].forEach(i=>setErr(i,false))},
  'pay-saved'(){const c=S.cards.find(x=>x.id===S.checkout.card);S.checkout.brand=c.brand;S.checkout.newCard=null;tdsModal()},
  'tds-ok'(el){el.innerHTML='<span class="spin"></span>';el.disabled=true;setTimeout(()=>{closeModal();const co=S.checkout;if(!co)return;if(co.newCard&&co.saveCard){S.cards.forEach(c=>c.def=false);S.cards.push(Object.assign({id:uid(),def:true},co.newCard))}finishPayment(co.brand||'visa')},1300)},
  express(el){
    const v=el.dataset.v;S.checkout.xp=v;
    modal(`<div style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:16px">${pm(v,44)}</div><h3 id="m-title">${t('xp_h')}</h3><p class="muted">${t('xp_p',{x:eur(S.checkout.amount,{cents:1})})}</p>
      <div class="cred" style="justify-content:center;border:0"><span class="faint">Nutraver Ltd.</span></div>
      <div class="m-actions" style="justify-content:center"><button class="btn btn-secondary" data-act="modal-close">${t('cancel')}</button><button class="btn btn-primary" data-act="xp-ok" autofocus>${ic('finger','ic-sm')}${t('xp_ok')}</button></div></div>`);
  },
  'xp-ok'(el){el.innerHTML='<span class="spin"></span>';el.disabled=true;setTimeout(()=>{closeModal();finishPayment(S.checkout.xp)},1100)},
  'sim-pay'(){
    const co=S.checkout;co.cstage=1;rerender();
    setTimeout(()=>{if(S.checkout!==co)return;co.cstage=2;if(S.route==='checkout')rerender();
      setTimeout(()=>{if(S.checkout!==co)return;finishPayment(co.coin.startsWith('usdt')?'usdt':co.coin)},1400)},2600);
  },
  'pay-balance'(){finishPayment('balance')},
  /* misc */
  'pw-reveal'(el){const v=$('#'+el.dataset.for);const sh=v.dataset.shown==='1';v.textContent=sh?'••••••••••••••••':v.dataset.pw;v.dataset.shown=sh?'0':'1';el.innerHTML=ic(sh?'eye':'eyeOff','ic-sm');el.setAttribute('aria-label',sh?t('reveal'):t('hide'))},
  copy(el){const src=el.dataset.src?$('#'+el.dataset.src):(el.closest('.cred')?$('.v',el.closest('.cred')):null);copyText(el.dataset.text,src)},
  /* server */
  'srv-tab'(el){S.srvTab=el.dataset.v;rerender();if(S.srvTab==='console'){const i=$('#term-in');if(i)i.focus({preventScroll:true})}},
  pwr(el){
    const s=curSrv(),v=el.dataset.v;
    const map={stop:['pwr_stop_h','pwr_stop_p','stop','power',true],reboot:['pwr_reboot_h','pwr_reboot_p','reboot','refresh',false],start:['pwr_start_h','pwr_start_p','start','play',false]}[v];
    confirmDlg({title:t(map[0],{n:s.name}),text:t(map[1]),ok:t(map[2]),danger:map[4],icon:map[3],onOk:()=>{
      if(v==='stop')setStatus(s,'stopping','stopped',2400,t('t_stopped',{n:s.name}));
      if(v==='start')setStatus(s,'starting','running',2400,t('t_started',{n:s.name}));
      if(v==='reboot')setStatus(s,'rebooting','running',3600,t('t_rebooted',{n:s.name}));
    }});
  },
  'term-cmd'(el){termRun(el.dataset.v);const i=$('#term-in');if(i)i.focus({preventScroll:true})},
  'g-range'(el){const v=el.dataset.v;slideSeg(el,()=>{S.graphRange=v;rerender()})},
  'add-ip'(){const s=curSrv();confirmDlg({title:t('add_ip_h'),text:t('add_ip_p',{x:eur(2)}),ok:t('add_ip'),icon:'globe',onOk:()=>{s.extraIp=s.extraIp||[];s.extraIp.push(s.ip4.split('.').slice(0,3).join('.')+'.'+Math.floor(rnd(2,250)));rerender();toast(t('ip_added'))}})},
  'srv-backups'(el){const s=curSrv();s.backups=!s.backups;el.setAttribute('aria-checked',s.backups);toast(s.backups?t('bk_on'):t('bk_off'),'info')},
  'snap-restore'(el){const s=curSrv(),n=s.snaps.find(x=>x.id===el.dataset.id);confirmDlg({title:t('restore_h',{n:n.name}),text:t('restore_p'),ok:t('restore'),danger:true,icon:'undo',onOk:()=>setStatus(s,'rebooting','running',4000,t('restored',{n:n.name}))})},
  'snap-del'(el){const s=curSrv(),n=s.snaps.find(x=>x.id===el.dataset.id);confirmDlg({title:t('snap_del_h',{n:n.name}),text:t('snap_del_p'),ok:t('delete'),danger:true,icon:'trash',onOk:()=>{s.snaps=s.snaps.filter(x=>x!==n);rerender();toast(t('deleted'))}})},
  're-os'(el){S.reos=el.dataset.v;rerender()},
  reinstall(){const s=curSrv(),os=S.reos||s.os;confirmDlg({title:t('reinstall_h2',{n:s.name}),text:t('reinstall_p',{os:imgName(os)}),ok:t('reinstall_go'),danger:true,icon:'alert',onOk:()=>{s.os=os;s.pass=genPass();S.term=null;setStatus(s,'reinstalling','running',5200,t('reinstalled',{os:imgName(os)}))}})},
  'fw-del'(el){const s=curSrv();s.fw=s.fw.filter(r=>r.id!==el.dataset.id);rerender();toast(t('rule_del'))},
  'srv-del'(){const s=curSrv();confirmDlg({title:t('del_h',{n:s.name}),text:t('del_confirm'),ok:t('del_srv'),danger:true,icon:'trash',onOk:()=>{S.servers=S.servers.filter(x=>x!==s);S.cur=S.servers[0]?S.servers[0].id:null;go('panel');toast(t('srv_deleted',{n:s.name}))}})},
  resize(){toast(t('toast_resize'),'info')},
  /* billing */
  'inv-pay'(el){const i=S.invoices.find(x=>x.id===el.dataset.id);newCheckout('invoice',i.amount,{invId:i.id});go('checkout')},
  'inv-pdf'(el){toast(t('pdf_ready',{id:el.dataset.id}))},
  'add-card'(){addCardModal()},
  'card-def'(el){S.cards.forEach(c=>c.def=c.id===el.dataset.id);rerender();toast(t('saved'))},
  'card-del'(el){const c=S.cards.find(x=>x.id===el.dataset.id);confirmDlg({title:t('card_del_h',{n:c.last4}),text:t('card_del_p'),ok:t('delete'),danger:true,icon:'trash',onOk:()=>{S.cards=S.cards.filter(x=>x!==c);if(S.cards.length&&!S.cards.some(x=>x.def))S.cards[0].def=true;rerender();toast(t('deleted'))}})},
  /* support */
  'tk-compose'(){S.sup.compose=true;rerender();const i=$('#tk-subj');if(i)i.focus()},
  'tk-cancel'(){S.sup.compose=false;rerender()},
  'tk-sel'(el){S.sup.sel=el.dataset.id;S.sup.compose=false;rerender()},
  'tk-close'(){const tk=S.tickets.find(x=>x.id===S.sup.sel);tk.status='closed';rerender();toast(t('tk_closed_t'))},
  'tk-reopen'(){const tk=S.tickets.find(x=>x.id===S.sup.sel);tk.status='open';rerender()},
  /* account */
  tfa(){if(S.twofa){confirmDlg({title:t('tfa_off_h'),text:t('tfa_off_p'),ok:t('disable'),danger:true,icon:'phone',onOk:()=>{S.twofa=false;rerender();toast(t('tfa_disabled'),'info')}})}else tfaModal()},
  'tfa-ok'(){const v=$('#tfa-code').value.trim();if(!/^\d{6}$/.test(v)){setErr('f-tfa',true);return}S.twofa=true;closeModal();rerender();toast(t('tfa_enabled'))},
  'pass-change'(){toast(t('reset_sent'),'info')},
  'key-del'(el){const k=S.keys.find(x=>x.id===el.dataset.id);confirmDlg({title:t('key_del_h',{n:k.name}),text:t('key_del_p'),ok:t('delete'),danger:true,icon:'key',onOk:()=>{S.keys=S.keys.filter(x=>x!==k);if(S.order.keyId===k.id)S.order.keyId=S.keys[0]?S.keys[0].id:'new';rerender();toast(t('deleted'))}})},
  'tok-del'(el){const k=S.tokens.find(x=>x.id===el.dataset.id);confirmDlg({title:t('tok_del_h',{n:k.name}),text:t('tok_del_p'),ok:t('revoke'),danger:true,icon:'code',onOk:()=>{S.tokens=S.tokens.filter(x=>x!==k);S.newToken=null;rerender();toast(t('revoked'))}})},
};
function checkStep(){
  const o=S.order;
  if(o.step===4&&o.auth==='key'&&o.keyId==='new'&&!/^(ssh-|ecdsa-)/.test(o.keyPaste.trim())){toast(t('err_key'),'bad');const k=$('#o-key');if(k)k.focus();return false}
  return true;
}
function pwMeter(){
  const p=$('#a-pass'),m=$('#pwm');if(!p||!m)return;const v=p.value;
  let sc=0;if(v.length>=8)sc++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))sc++;if(/\d/.test(v))sc++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)sc++;
  const col=['var(--bad)','var(--warn)','var(--brand)','var(--ok)'][Math.max(0,sc-1)];
  $$('i',m).forEach((i,k)=>i.style.background=k<sc?col:'');
  const h=$('#pwh');if(h)h.textContent=v?t('pw_'+['weak','weak','fair','good','strong'][sc]):t('pw_hint');
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a&&!a.dataset.act){
    const h=a.getAttribute('href');
    if(h===location.hash||(h==='#home'&&!location.hash)){e.preventDefault();go(h.slice(1))}
    if(S.mnav)A['mnav-close']();
  }
  const el=e.target.closest('[data-act]');
  if(S.menu&&!e.target.closest('.menu')&&!(el&&el.dataset.act==='menu')){S.menu=false;const m=$('.menu');if(m)m.remove();const av=$('.ava[aria-expanded]');if(av)av.setAttribute('aria-expanded','false')}
  if(!el)return;
  const fn=A[el.dataset.act];
  if(fn){if(el.tagName==='BUTTON'&&el.type==='submit'&&el.form)return;fn(el,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  const v=id=>{const x=$('#'+id);return x?x.value.trim():''};
  if(f.id==='authForm'){
    const b=$('#authSubmit');b.innerHTML='<span class="spin"></span>';b.disabled=true;
    const d=demoUser();const nm=v('a-name');
    setTimeout(()=>{S.user={name:nm||d.name,email:v('a-email')||d.email};const n=S.after||'panel';S.after=null;go(n);toast(t('welcome',{n:S.user.name.split(' ')[0]}))},700);
  }
  else if(f.id==='cardForm'){const r=validateCard(true);if(!r){toast(t('err_fix'),'bad');return}S.checkout.brand=r.brand;S.checkout.newCard=r;S.checkout.saveCard=$('#c-save').checked;tdsModal()}
  else if(f.id==='addCardForm'){const r=validateCard(false);if(!r)return;S.cards.push(Object.assign({id:uid()},r));closeModal();rerender();toast(t('card_added'))}
  else if(f.id==='rdnsForm'){const s=curSrv();const val=v('rdns-in');if(val&&!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(val)){toast(t('err_host'),'bad');return}s.rdns=val;toast(t('rdns_saved'))}
  else if(f.id==='snapForm'){
    const s=curSrv();if(s.snaps.length>=5){toast(t('snap_limit'),'bad');return}
    const nm=(v('snap-name')||'snapshot-'+new Date().toISOString().slice(0,10)).replace(/[^\w.-]/g,'-').slice(0,40);
    const sn={id:uid(),name:nm,date:Date.now(),size:(planOf(s.type,s.plan).disk||200)*.08,st:'creating'};s.snaps.unshift(sn);rerender();toast(t('snap_started'),'info');
    setTimeout(()=>{sn.st='ready';if(S.route==='server'&&S.srvTab==='backups')rerender();toast(t('snap_ready',{n:sn.name}))},3200);
  }
  else if(f.id==='fwForm'){
    const s=curSrv(),proto=v('fw-proto');let port=v('fw-port'),src=v('fw-src')||'0.0.0.0/0';
    if(proto==='ICMP')port='—';else if(!/^\d{1,5}(-\d{1,5})?(,\s*\d{1,5})*$/.test(port)){toast(t('err_port'),'bad');$('#fw-port').focus();return}
    if(!/^[\d.:a-fA-F/]+$/.test(src)){toast(t('err_src'),'bad');return}
    s.fw.push({id:uid(),proto,port,src,act:v('fw-act')});rerender();toast(t('rule_added'));
  }
  else if(f.id==='renameForm'){const s=curSrv();const nm=v('srv-name').replace(/[^\w.-]/g,'-');if(!nm){toast(t('err_req'),'bad');return}s.name=nm;rerender();toast(t('renamed'))}
  else if(f.id==='tkForm'){
    const sj=v('tk-subj'),msg=v('tk-msg');setErr('f-tks',!sj);setErr('f-tkm',!msg);if(!sj||!msg)return;
    const tk={id:'T-10'+(43+S.tickets.length),subj:sj,status:'open',srv:v('tk-srv'),updated:Date.now(),msgs:[{me:1,text:msg,time:Date.now()}]};
    S.tickets.unshift(tk);S.sup={sel:tk.id,compose:false};rerender();toast(t('tk_created',{id:tk.id}));
    setTimeout(()=>{tk.msgs.push({me:0,k:'tk_auto',time:Date.now()});tk.status='answered';tk.updated=Date.now();if(S.route==='support')rerender()},2600);
  }
  else if(f.id==='replyForm'){
    const tk=S.tickets.find(x=>x.id===S.sup.sel);const msg=v('tk-reply');if(!msg)return;
    tk.msgs.push({me:1,text:msg,time:Date.now()});tk.status='open';tk.updated=Date.now();rerender();
    setTimeout(()=>{tk.msgs.push({me:0,k:'tk_auto2',time:Date.now()});tk.status='answered';if(S.route==='support'&&S.sup.sel===tk.id)rerender()},2800);
  }
  else if(f.id==='profForm'){
    S.user.name=v('p-name')||S.user.name;S.user.email=v('p-email')||S.user.email;
    S.lang=v('p-lang')==='ru'?'ru':'en';store.set('nv_lang',S.lang);S.theme=v('p-theme');store.set('nv_theme',S.theme);applyTheme();rerender();toast(t('saved'));
  }
  else if(f.id==='keyForm'){
    const nm=v('key-name'),kt=v('key-text');const okK=/^(ssh-(ed25519|rsa)|ecdsa-)/.test(kt);setErr('f-kn',!nm);setErr('f-kt',!okK);if(!nm||!okK)return;
    S.keys.push({id:uid(),name:nm,fp:'SHA256:'+uid().slice(0,4)+'…'+uid().slice(0,4),added:Date.now()});rerender();toast(t('key_added'));
  }
  else if(f.id==='tokForm'){
    const nm=v('tok-name')||'token-'+(S.tokens.length+1);let tk='nvt_';const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<32;i++)tk+=c[Math.floor(Math.random()*c.length)];
    S.tokens.unshift({id:uid(),name:nm,created:Date.now(),used:null});S.newToken=tk;rerender();toast(t('tok_created'));
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='c-num'){const d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');updBrand();setErr('f-num',false)}
  else if(el.id==='c-exp'){let d=el.value.replace(/\D/g,'').slice(0,4);if(d.length>=3)d=d.slice(0,2)+'/'+d.slice(2);else if(d.length===2&&!(e.inputType||'').startsWith('delete'))d+='/';el.value=d;setErr('f-exp',false)}
  else if(el.id==='c-cvc'){el.value=el.value.replace(/\D/g,'').slice(0,4);setErr('f-cvc',false)}
  else if(el.id==='c-name')setErr('f-name',false);
  else if(el.id==='o-host'){const c=el.value.toLowerCase().replace(/[^a-z0-9.-]/g,'-').slice(0,40);if(c!==el.value)el.value=c;S.order.hostname=c}
  else if(el.id==='o-key')S.order.keyPaste=el.value;
  else if(el.id==='a-pass')pwMeter();
  else if(el.id==='tu-amt')el.closest('.field').classList.remove('has-err');
  else if(el.id==='tfa-code'){el.value=el.value.replace(/\D/g,'').slice(0,6);setErr('f-tfa',false)}
  else if(/^otp\d$/.test(el.id)){el.value=el.value.replace(/\D/g,'').slice(-1);const n=$('#otp'+(+el.id.slice(3)+1));if(el.value&&n)n.focus();if(el.id==='otp6'&&el.value){const b=$('#tdsOk');if(b)b.focus()}}
});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(e.key==='Escape'){if($('#modal-root').innerHTML){closeModal();return}if(S.menu){S.menu=false;rerender();return}if(S.mnav){A['mnav-close']();return}}
  if(el.id==='term-in'){
    const T=S.term;
    if(e.key==='Enter'){e.preventDefault();termRun(el.value);el.value=''}
    else if(e.key==='ArrowUp'&&T&&T.hist.length){e.preventDefault();T.hi=Math.max(0,T.hi-1);el.value=T.hist[T.hi]||''}
    else if(e.key==='ArrowDown'&&T){e.preventDefault();T.hi=Math.min(T.hist.length,T.hi+1);el.value=T.hist[T.hi]||''}
  }
  if(/^otp\d$/.test(el.id)&&e.key==='Backspace'&&!el.value){const p=$('#otp'+(+el.id.slice(3)-1));if(p)p.focus()}
  if(e.key==='Enter'&&el.id==='tu-amt'){e.preventDefault();A['tu-go']()}
  if(e.key==='Enter'&&el.id==='tfa-code'){e.preventDefault();A['tfa-ok']()}
});
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('[data-loc]');
  $$('.map-tag.hl,.lcard.hl').forEach(x=>{if(!c||x.dataset.tag!==c.dataset.loc&&x!==c)x.classList.remove('hl')});
  if(c){const tg=$(`.map-tag[data-tag="${c.dataset.loc}"]`);if(tg)tg.classList.add('hl')}
});
window.addEventListener('hashchange',()=>route(true));
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)$$('[data-act="theme"]').forEach(b=>{b.outerHTML=themeBtn()})})}catch(e){}

applyTheme();
route(false);
