<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nutraver Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nutraver: fast VPS and dedicated servers in Equinix data centers in Frankfurt, Amsterdam and Stockholm. Pay by card or crypto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#FFF6F2; --bg-tint:#FFF0F4; --card:#FFFFFF; --card-2:#FBF5F3; --card-3:#F6EEF1;
  --fg:#24112B; --fg-2:#5D4865; --fg-3:#8C7893; --line:#F1E5EB; --line-2:#E5D5DE;
  --g1:#FF7A3D; --g2:#FF3E7F; --g3:#B57BFF; --g4:#FFB347;
  --grad:linear-gradient(115deg,#FF7A3D 0%,#FF3E7F 52%,#B57BFF 100%);
  --grad-warm:linear-gradient(135deg,#FFB347 0%,#FF7A3D 45%,#FF3E7F 100%);
  --grad-pink:linear-gradient(135deg,#FF5E8E 0%,#FF3E7F 40%,#C877FF 100%);
  --grad-lilac:linear-gradient(135deg,#D59BFF 0%,#B57BFF 50%,#FF5E9E 100%);
  --grad-soft:linear-gradient(115deg,#FFE6D9 0%,#FFDCE8 50%,#EEE1FF 100%);
  --ink:#24112B; --ink-2:#33193C; --on-ink:#FFFFFF;
  --ok:#0F9F69; --ok-bg:#E2F6EE; --warn:#C77700; --warn-bg:#FFF1D9; --bad:#DE2F4A; --bad-bg:#FDE5EA; --info:#7B4DDB; --info-bg:#F0E8FF;
  --sh-sm:0 1px 2px rgba(70,20,60,.06),0 3px 10px rgba(70,20,60,.05);
  --sh:0 2px 4px rgba(70,20,60,.04),0 16px 36px -12px rgba(70,20,60,.18);
  --sh-lg:0 40px 80px -30px rgba(110,20,80,.35),0 10px 24px -12px rgba(110,20,80,.18);
  --glow:0 14px 30px -10px rgba(255,62,127,.65);
  --dots:#EEDDE6; --map-land:#FFF0F4;
  --input:#FFFFFF; --overlay:rgba(36,17,43,.42);
  --r:20px; --r-lg:28px; --r-xl:36px;
  --f-display:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-ui:"Golos Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140A18; --bg-soft:#1A0E20; --bg-tint:#21112A; --card:#1E1125; --card-2:#27162F; --card-3:#2F1C38;
  --fg:#FCEFF7; --fg-2:#CDB6D3; --fg-3:#9A84A1; --line:#32203A; --line-2:#44294D;
  --grad-soft:linear-gradient(115deg,rgba(255,122,61,.16) 0%,rgba(255,62,127,.16) 50%,rgba(181,123,255,.18) 100%);
  --ink:#0B050E; --ink-2:#1A0D20;
  --ok:#3FD69A; --ok-bg:rgba(63,214,154,.13); --warn:#FFB84D; --warn-bg:rgba(255,184,77,.13); --bad:#FF6B81; --bad-bg:rgba(255,107,129,.14); --info:#C9A6FF; --info-bg:rgba(181,123,255,.16);
  --sh-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.25);
  --sh:0 2px 4px rgba(0,0,0,.3),0 18px 40px -14px rgba(0,0,0,.6);
  --sh-lg:0 40px 80px -30px rgba(0,0,0,.8),0 0 60px -20px rgba(255,62,127,.25);
  --glow:0 14px 34px -8px rgba(255,62,127,.75);
  --dots:#3B2444; --map-land:#21112A; --input:#170C1C; --overlay:rgba(5,2,8,.66);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#140A18; --bg-soft:#1A0E20; --bg-tint:#21112A; --card:#1E1125; --card-2:#27162F; --card-3:#2F1C38;
  --fg:#FCEFF7; --fg-2:#CDB6D3; --fg-3:#9A84A1; --line:#32203A; --line-2:#44294D;
  --grad-soft:linear-gradient(115deg,rgba(255,122,61,.16) 0%,rgba(255,62,127,.16) 50%,rgba(181,123,255,.18) 100%);
  --ink:#0B050E; --ink-2:#1A0D20;
  --ok:#3FD69A; --ok-bg:rgba(63,214,154,.13); --warn:#FFB84D; --warn-bg:rgba(255,184,77,.13); --bad:#FF6B81; --bad-bg:rgba(255,107,129,.14); --info:#C9A6FF; --info-bg:rgba(181,123,255,.16);
  --sh-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.25);
  --sh:0 2px 4px rgba(0,0,0,.3),0 18px 40px -14px rgba(0,0,0,.6);
  --sh-lg:0 40px 80px -30px rgba(0,0,0,.8),0 0 60px -20px rgba(255,62,127,.25);
  --glow:0 14px 34px -8px rgba(255,62,127,.75);
  --dots:#3B2444; --map-land:#21112A; --input:#170C1C; --overlay:rgba(5,2,8,.66);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
svg{display:block;flex:none}
.i{width:1.15em;height:1.15em}
img{max-width:100%}
::selection{background:#FF3E7F;color:#fff}
:focus-visible{outline:2.5px solid var(--g2);outline-offset:3px;border-radius:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15.5px;white-space:nowrap;text-decoration:none;transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .25s,background-color .2s,color .2s,border-color .2s;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--grad);background-size:140% 100%;background-position:0 0;color:#fff;box-shadow:var(--glow);transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .25s,background-position .5s}
.btn-primary::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);transform:translateX(-120%);transition:none}
.btn-primary:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 20px 40px -12px rgba(255,62,127,.75)}
.btn-primary:hover::after{transform:translateX(120%);transition:transform .8s ease}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--g2),0 8px 20px -10px rgba(255,62,127,.4);transform:translateY(-1px)}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-dark:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn-white{background:#fff;color:#24112B;box-shadow:0 12px 26px -10px rgba(60,0,40,.45)}
.btn-white:hover{transform:translateY(-2px)}
.btn-soft{background:var(--bg-tint);color:var(--fg)}
.btn-soft:hover{background:var(--card-3)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px var(--bad)}
.btn-sm{height:38px;padding:0 15px;font-size:14px}
.btn-sm svg{width:16px;height:16px}
.btn-lg{height:58px;padding:0 30px;font-size:17px}
.btn-block{width:100%}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none;box-shadow:none}
.icon-btn{width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;color:var(--fg);transition:background .2s,transform .2s}
.icon-btn:hover{background:var(--bg-tint)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.link-btn{color:var(--g2);font-weight:600;text-decoration:none}
.link-btn:hover{text-decoration:underline}

/* ---------- icon badges (3D squircles) ---------- */
.ib{--b:var(--grad-warm);position:relative;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--b);color:#fff;flex:none;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -8px 14px rgba(90,0,50,.25),0 12px 22px -10px rgba(255,62,127,.7)}
.ib::before{content:"";position:absolute;left:14%;top:8%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(.5px)}
.ib svg{position:relative;width:24px;height:24px;filter:drop-shadow(0 1.5px 1px rgba(80,0,40,.25))}
.ib.b2{--b:var(--grad-pink)} .ib.b3{--b:var(--grad-lilac)} .ib.b4{--b:linear-gradient(135deg,#FFC86B,#FF8A3D 60%,#FF5E5E)} .ib.b5{--b:linear-gradient(135deg,#FF8FB5,#FF3E7F 60%,#E0337A)} .ib.b6{--b:linear-gradient(135deg,#9EA8FF,#B57BFF 55%,#E46CFF)}
.ib.sm{width:40px;height:40px;border-radius:13px}
.ib.sm svg{width:19px;height:19px}
.ib.lg{width:64px;height:64px;border-radius:21px}
.ib.lg svg{width:30px;height:30px}

/* ---------- 3D shapes ---------- */
.shape{position:absolute;pointer-events:none;z-index:0}
.sph{border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#FFD9C7 7%,#FF8A55 32%,#FF3E7F 72%,#C02A6A 100%);box-shadow:inset -10px -16px 30px rgba(120,10,60,.35),0 30px 50px -22px rgba(255,62,127,.55)}
.sph.lil{background:radial-gradient(circle at 32% 28%,#fff 0,#F1E3FF 8%,#C99BFF 35%,#9A6BFF 70%,#6E3FD6 100%);box-shadow:inset -10px -16px 30px rgba(60,10,120,.35),0 30px 50px -22px rgba(150,90,255,.55)}
.sph.pnk{background:radial-gradient(circle at 32% 28%,#fff 0,#FFD6E5 8%,#FF7FAA 35%,#FF3E7F 70%,#B5205D 100%)}
.sph.amb{background:radial-gradient(circle at 32% 28%,#fff 0,#FFF0C9 8%,#FFC35C 35%,#FF8A3D 72%,#D35A20 100%);box-shadow:inset -10px -16px 30px rgba(140,50,0,.3),0 30px 50px -22px rgba(255,140,60,.55)}
.pil{border-radius:999px;background:linear-gradient(160deg,#FFB08A 0%,#FF5E8E 45%,#C46BFF 100%);box-shadow:inset 0 6px 8px rgba(255,255,255,.45),inset 0 -12px 18px rgba(100,0,70,.3),0 26px 40px -20px rgba(255,62,127,.6)}
.cub{border-radius:28%;background:linear-gradient(145deg,#FFE0A8 0%,#FFA552 40%,#FF5E5E 100%);box-shadow:inset 6px 6px 10px rgba(255,255,255,.5),inset -10px -14px 20px rgba(140,30,20,.28),0 26px 40px -20px rgba(255,110,60,.6)}
.cub.lil{background:linear-gradient(145deg,#F3E3FF 0%,#C99BFF 40%,#8E5CF0 100%);box-shadow:inset 6px 6px 10px rgba(255,255,255,.5),inset -10px -14px 20px rgba(60,20,120,.3),0 26px 40px -20px rgba(150,90,255,.6)}
.rng{border-radius:50%;background:conic-gradient(from 200deg,#FF7A3D,#FF3E7F,#B57BFF,#FFB347,#FF7A3D);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47.5%);mask:radial-gradient(circle,transparent 46%,#000 47.5%);filter:drop-shadow(0 14px 18px rgba(255,62,127,.35))}
.fl1{animation:fl1 9s ease-in-out infinite}
.fl2{animation:fl2 11s ease-in-out infinite}
.fl3{animation:fl3 13s ease-in-out infinite}
.spin{animation:spin 26s linear infinite}
@keyframes fl1{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(8px,-22px,0) rotate(8deg)}}
@keyframes fl2{0%,100%{transform:translate3d(0,0,0) rotate(-12deg)}50%{transform:translate3d(-14px,16px,0) rotate(6deg)}}
@keyframes fl3{0%,100%{transform:translate3d(0,0,0) rotate(20deg)}50%{transform:translate3d(10px,14px,0) rotate(-4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.hdr.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 1px 0 var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:76px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--fg)}
.logo-mark{width:34px;height:34px;border-radius:12px;background:var(--grad);position:relative;box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -6px 10px rgba(90,0,50,.25),0 8px 18px -8px rgba(255,62,127,.8);display:grid;place-items:center}
.logo-mark svg{width:20px;height:20px}
.nav{display:flex;gap:4px;margin-left:16px}
.nav button{padding:9px 14px;border-radius:999px;font-weight:500;color:var(--fg-2);transition:color .2s,background .2s}
.nav button:hover{color:var(--fg);background:var(--bg-tint)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--bg-tint);position:relative}
.seg button{position:relative;z-index:1;height:30px;min-width:40px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--fg-3);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .seg-th{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s}
.burger{display:none}
@media (max-width:1020px){.nav,.hide-m{display:none!important}.burger{display:inline-grid}}
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .25s both}
.drawer-p{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:var(--card);padding:20px 20px 28px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh-lg);animation:slidein .35s cubic-bezier(.2,.9,.3,1) both;overflow:auto}
.drawer-p .nav-m{display:flex;flex-direction:column;gap:2px;margin:12px 0}
.drawer-p .nav-m button{text-align:left;padding:14px 12px;border-radius:14px;font-weight:600;font-size:17px}
.drawer-p .nav-m button:hover{background:var(--bg-tint)}
@keyframes slidein{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}

/* ---------- hero ---------- */
.hero{position:relative;padding:34px 0 30px;overflow:hidden}
.hero-bg{position:absolute;inset:-20% -10% auto;height:120%;z-index:-1;pointer-events:none;background:
  radial-gradient(40% 50% at 82% 30%,rgba(255,62,127,.20),transparent 70%),
  radial-gradient(35% 45% at 95% 70%,rgba(181,123,255,.22),transparent 70%),
  radial-gradient(40% 40% at 10% 10%,rgba(255,122,61,.14),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;min-height:620px}
.promo{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);font-weight:600;font-size:14.5px}
.promo b{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--grad);color:#fff;font-size:12.5px;letter-spacing:.02em}
.promo b svg{width:14px;height:14px}
.hero h1{font-size:clamp(44px,6.6vw,88px);line-height:.98;letter-spacing:-.045em;margin:24px 0 22px}
.hero h1 .gtext{padding-right:.04em}
.hero-sub{font-size:clamp(17px,1.6vw,20px);color:var(--fg-2);max-width:540px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-pay{display:flex;align-items:center;gap:14px;margin-top:30px;flex-wrap:wrap}
.hero-pay span{font-size:13.5px;color:var(--fg-3);font-weight:500}
.paychips{display:flex;gap:8px;flex-wrap:wrap}
.paychip{height:34px;padding:0 9px;border-radius:10px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);display:inline-grid;place-items:center}
.paychip svg{height:20px;width:auto}
.play .ent{animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
.play .ent.d1{animation-delay:.08s}.play .ent.d2{animation-delay:.16s}.play .ent.d3{animation-delay:.24s}.play .ent.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}

.stage{position:relative;height:580px;perspective:1200px}
.stage .shape{z-index:1}
.srv-card{position:absolute;z-index:3;left:50%;top:50%;width:min(390px,92%);transform:translate(-50%,-50%) rotateY(var(--ry,-8deg)) rotateX(var(--rx,4deg));transform-style:preserve-3d;background:var(--card);border-radius:30px;padding:22px;box-shadow:var(--sh-lg),inset 0 0 0 1px var(--line);transition:transform .4s cubic-bezier(.2,.9,.3,1)}
.play .srv-card{animation:pop 1s .25s cubic-bezier(.2,.9,.3,1) both}
.srv-top{display:flex;align-items:center;gap:12px}
.srv-top .flag{width:40px;height:40px}
.srv-name{font-weight:700;font-size:16px}
.srv-loc{font-size:13px;color:var(--fg-3)}
.status{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite}
.status.st-stopped{background:var(--card-3);color:var(--fg-3)}
.status.st-stopped::before{animation:none}
.status.st-busy{background:var(--warn-bg);color:var(--warn)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.srv-mid{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:22px 0 18px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .rv small{display:block;font-size:11.5px;color:var(--fg-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.ring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)}
.meters{display:grid;gap:13px}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg-2);margin-bottom:6px;font-weight:500}
.meter-l b{color:var(--fg)}
.bar{height:9px;border-radius:9px;background:var(--card-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width 1.1s cubic-bezier(.3,.8,.3,1)}
.bar.b-l i{background:var(--grad-lilac)}
.srv-ip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--bg-soft);font-size:14px}
.srv-ip .mono{font-weight:600}
.spark{width:100%;height:46px;margin-top:14px}
.bubble{position:absolute;z-index:4;background:var(--card);border-radius:20px;box-shadow:var(--sh);display:grid;place-items:center;padding:12px}
.bubble svg{height:26px;width:auto}
.toastlet{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 16px 10px 10px;box-shadow:var(--sh);font-size:13.5px;font-weight:600;white-space:nowrap}
.toastlet small{display:block;font-weight:500;color:var(--fg-3);font-size:12px}

/* ---------- marquee & trust ---------- */
.marq{position:relative;overflow:hidden;padding:18px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq-track{display:flex;gap:18px;width:max-content;animation:marq 40s linear infinite}
.marq:hover .marq-track{animation-play-state:paused}
.marq-item{height:64px;min-width:120px;padding:0 24px;border-radius:20px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);display:grid;place-items:center}
.marq-item svg{height:30px;width:auto}
@keyframes marq{to{transform:translateX(calc(-50% - 9px))}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.trust-i{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;background:var(--bg-soft)}
.trust-i b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.trust-i span{font-size:13.5px;color:var(--fg-2)}

/* ---------- sections ---------- */
.sec{padding:110px 0;position:relative}
.sec-h{max-width:720px;margin-bottom:48px}
.sec-h.c{margin-left:auto;margin-right:auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);margin-bottom:16px}
.eyebrow::before{content:"";width:18px;height:6px;border-radius:6px;background:var(--grad)}
.sec h2{font-size:clamp(34px,4.6vw,58px);letter-spacing:-.04em}
.sec-h p{font-size:18px;color:var(--fg-2);margin-top:18px}

/* pricing */
.price-ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-bottom:40px}
.sw{position:relative;flex:none;display:inline-flex;padding:6px;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line)}
.sw button{position:relative;z-index:1;height:46px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;color:var(--fg-2);transition:color .3s;display:inline-flex;align-items:center;gap:8px}
.sw button[aria-pressed="true"]{color:#fff}
.sw button svg{width:17px;height:17px}
.sw-th{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;border-radius:999px;background:var(--grad);box-shadow:var(--glow);transition:transform .45s cubic-bezier(.3,1.25,.4,1),width .45s cubic-bezier(.3,1.25,.4,1)}
.sw.sw-sm button{height:38px;padding:0 16px;font-size:14px}
.sw.sw-sm .sw-th{background:var(--fg);box-shadow:none}
.sw.sw-sm button[aria-pressed="true"]{color:var(--bg)}
.sticker{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;background:#FFE14D;color:#3A1A00;font-weight:800;font-size:12.5px;transform:rotate(-6deg);box-shadow:0 6px 12px -6px rgba(180,120,0,.6)}
.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:stretch}
.plans.ded{grid-template-columns:repeat(4,1fr)}
.plan{position:relative;display:flex;flex-direction:column;padding:26px 22px 22px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s}
.play .plan{animation:pop .6s cubic-bezier(.2,.9,.3,1) both}
.play .plan:nth-child(2){animation-delay:.05s}.play .plan:nth-child(3){animation-delay:.1s}.play .plan:nth-child(4){animation-delay:.15s}.play .plan:nth-child(5){animation-delay:.2s}
.plan:hover{transform:translateY(-8px);box-shadow:var(--sh-lg),inset 0 0 0 1px var(--line)}
.plan-name{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.plan-dot{width:14px;height:14px;border-radius:50%;background:var(--pd,var(--grad))}
.plan-sub{font-size:13px;color:var(--fg-3);margin-top:4px;min-height:40px;line-height:1.5}
.price{display:flex;align-items:flex-start;gap:2px;margin:20px 0 4px;font-family:var(--f-display);font-weight:800;letter-spacing:-.05em;line-height:.9}
.price .cur{font-size:22px;margin-top:6px}
.price .int{font-size:56px}
.price .dec{font-size:22px;margin-top:6px}
.price-per{font-size:13px;color:var(--fg-3);min-height:20px}
.price-old{text-decoration:line-through;margin-right:6px}
.plan ul{list-style:none;padding:0;margin:20px 0 22px;display:grid;gap:10px;font-size:14.5px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{width:18px;height:18px;color:var(--g2);margin-top:2px}
.plan .btn{margin-top:auto}
.plan.hot{background:var(--grad);color:#fff;box-shadow:0 30px 60px -24px rgba(255,62,127,.75);transform:translateY(-10px)}
.plan.hot:hover{transform:translateY(-16px)}
.plan.hot .plan-sub,.plan.hot .price-per{color:rgba(255,255,255,.8)}
.plan.hot li svg{color:#fff}
.plan.hot .plan-dot{background:#fff}
.plan.hot::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 40% at 80% 0%,rgba(255,255,255,.35),transparent 70%);pointer-events:none}
.ribbon{position:absolute;top:-14px;right:16px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#FFE14D;color:#3A1A00;font-weight:800;font-size:12.5px;box-shadow:0 10px 18px -8px rgba(160,100,0,.7);transform:rotate(4deg)}
.ribbon svg{width:14px;height:14px}
.price-foot{display:flex;flex-wrap:wrap;gap:14px 26px;justify-content:center;align-items:center;margin-top:36px;color:var(--fg-2);font-size:14.5px}
.price-foot .pf{display:inline-flex;align-items:center;gap:8px}
.price-foot .pf svg{width:18px;height:18px;color:var(--g2)}

/* locations */
.locs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.loc-card{position:relative;padding:26px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--line);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .25s ease-out,box-shadow .3s;overflow:hidden}
.loc-card:hover{--ty:-6px;box-shadow:var(--sh-lg),inset 0 0 0 1px var(--line)}
.loc-card::after{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;mix-blend-mode:soft-light}
.loc-card:hover::after{opacity:1}
.loc-card .flag{width:96px;height:96px;filter:drop-shadow(0 16px 20px rgba(60,20,40,.25))}
.loc-card h3{font-size:30px;margin-top:22px}
.loc-meta{display:grid;gap:10px;margin-top:18px;font-size:14.5px}
.loc-meta div{display:flex;align-items:center;gap:10px;color:var(--fg-2)}
.loc-meta svg{width:18px;height:18px;color:var(--g2)}
.ping{position:absolute;top:26px;right:26px;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13.5px}
.ping svg{width:15px;height:15px}
.loc-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:stretch;margin-top:20px}
.map-card{position:relative;border-radius:var(--r-xl);background:var(--bg-soft);overflow:hidden;min-height:360px}
.map-card svg.map{width:100%;height:100%;display:block}
.map-pt{animation:mp 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mp{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.arc{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.map-note{position:absolute;left:20px;bottom:20px;right:20px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm);font-size:13.5px;font-weight:600}
.chip .flag{width:24px;height:24px}
.lat-card{border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--line);padding:26px}
.lat-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.lat-row:last-child{border-bottom:0}
.lat-row .flag{width:34px;height:34px}

/* equinix */
.eqx{position:relative;margin:0 auto;border-radius:44px;background:var(--grad);color:#fff;overflow:hidden;padding:80px 0;isolation:isolate}
.eqx-out{padding:0 var(--gut-r) 0 var(--gut)}
@media (min-width:760px){.eqx-out{padding:0 24px}}
.eqx::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 60% at 15% 10%,rgba(255,200,120,.55),transparent 70%),radial-gradient(40% 60% at 95% 100%,rgba(120,60,255,.45),transparent 70%)}
.eqx .eyebrow{color:#fff}
.eqx .eyebrow::before{background:#fff}
.eqx h2{max-width:820px}
.eqx-lead{font-size:19px;max-width:720px;margin-top:20px;color:rgba(255,255,255,.9)}
.eqx-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:46px 0 30px}
.eqx-stat{padding:24px;border-radius:26px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.eqx-stat b{display:block;font-family:var(--f-display);font-size:clamp(34px,4vw,50px);font-weight:800;letter-spacing:-.045em;line-height:1}
.eqx-stat span{display:block;margin-top:8px;font-size:14.5px;color:rgba(255,255,255,.88)}
.eqx-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.eqx-pt{display:flex;gap:16px;align-items:flex-start;padding:22px;border-radius:24px;background:rgba(40,0,30,.14)}
.eqx-pt .wi{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.eqx-pt .wi svg{width:22px;height:22px}
.eqx-pt h3{font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.3}
.eqx-pt p{font-size:14.5px;color:rgba(255,255,255,.85);margin-top:4px}
.eqx-pt.wide{grid-column:span 2}

/* features bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.feat{position:relative;padding:28px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);overflow:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s;grid-column:span 2}
.feat:hover{transform:translateY(-6px);box-shadow:var(--sh-lg),inset 0 0 0 1px var(--line)}
.feat h3{font-family:var(--f-ui);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:22px 0 8px;line-height:1.25}
.feat p{color:var(--fg-2);font-size:15px}
.feat.big{grid-column:span 3;background:var(--bg-soft)}
.feat.tint{background:var(--grad-soft)}
.nvme-viz{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:22px}
.nvme-viz i{flex:1;border-radius:10px 10px 4px 4px;background:var(--card-3)}
.nvme-viz i.on{background:var(--grad)}
.nvme-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-3);margin-top:8px;font-weight:600}
.code-chip{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.code-chip .k{color:#FF9DC0}

/* panel preview */
.pv{position:relative;border-radius:var(--r-xl);padding:14px;background:var(--grad-soft);box-shadow:var(--sh-lg)}
.pv-bar{display:flex;gap:7px;padding:4px 6px 12px}
.pv-bar i{width:11px;height:11px;border-radius:50%;background:rgba(36,17,43,.18)}
.pv-in{border-radius:24px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-columns:200px 1fr;min-height:440px}
.pv-side{padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pv-main{padding:24px;display:grid;gap:16px;align-content:start}
.pv-wrap{display:grid;grid-template-columns:.8fr 1.4fr;gap:56px;align-items:center}
.pv-list{display:grid;gap:16px;margin:30px 0}
.pv-li{display:flex;gap:14px;align-items:flex-start}
.pv-li b{display:block;font-weight:700}
.pv-li span{color:var(--fg-2);font-size:15px}

/* how it works */
.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.steps-path{position:absolute;left:12%;right:12%;top:52px;height:60px;z-index:0;pointer-events:none}
.steps-path path{stroke-dasharray:2 14;stroke-linecap:round;animation:dash2 1.4s linear infinite}
@keyframes dash2{to{stroke-dashoffset:-32}}
.step{position:relative;z-index:1;text-align:center;padding:0 10px}
.step-n{position:relative;width:104px;height:104px;margin:0 auto 24px;border-radius:34px;display:grid;place-items:center;background:var(--b,var(--grad-warm));color:#fff;box-shadow:inset 0 3px 2px rgba(255,255,255,.45),inset 0 -12px 20px rgba(90,0,50,.25),0 24px 40px -18px rgba(255,62,127,.7);transform:rotate(var(--rot,-6deg));transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.step:hover .step-n{transform:rotate(0) scale(1.06)}
.step-n svg{width:40px;height:40px}
.step-n em{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--fg);font-style:normal;font-family:var(--f-display);font-weight:800;display:grid;place-items:center;box-shadow:var(--sh)}
.step h3{font-family:var(--f-ui);font-weight:700;font-size:21px;letter-spacing:-.02em}
.step p{color:var(--fg-2);margin-top:10px;max-width:320px;margin-left:auto;margin-right:auto}
.step .paychips{justify-content:center;margin-top:16px}

/* faq */
.faq-grid{display:grid;grid-template-columns:.8fr 1.4fr;gap:56px;align-items:start}
.faq{display:grid;gap:12px}
.qa{border-radius:22px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);transition:box-shadow .3s,background .3s}
.qa.open{box-shadow:var(--sh),inset 0 0 0 1.5px var(--g2)}
.qa-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;text-align:left;font-weight:700;font-size:17px;border-radius:22px}
.qa-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg-tint);flex:none;transition:transform .4s cubic-bezier(.3,1.3,.5,1),background .3s,color .3s}
.qa-ic svg{width:18px;height:18px}
.qa.open .qa-ic{transform:rotate(45deg);background:var(--grad);color:#fff}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.9,.3,1)}
.qa.open .qa-a{grid-template-rows:1fr}
.qa-a>div{overflow:hidden}
.qa-a p{padding:0 24px 22px;color:var(--fg-2)}

/* cta band + footer */
.cta-band{position:relative;border-radius:44px;background:var(--ink);color:#fff;padding:72px 56px;overflow:hidden;isolation:isolate}
.cta-band::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 80% at 100% 0%,rgba(255,62,127,.55),transparent 70%),radial-gradient(40% 70% at 0% 100%,rgba(255,122,61,.4),transparent 70%)}
.cta-band h2{font-size:clamp(32px,4.4vw,56px);max-width:640px}
.cta-band p{color:rgba(255,255,255,.78);font-size:18px;margin:16px 0 30px;max-width:520px}
.ftr{padding:70px 0 40px;margin-top:100px;border-top:1px solid var(--line);background:var(--bg-soft)}
.ftr-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
.ftr h4{font-family:var(--f-ui);font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:14px}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.ftr ul button{color:var(--fg-2);font-size:14.5px;text-align:left}
.ftr ul button:hover{color:var(--g2)}
.ftr-bot{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-top:44px;padding-top:26px;border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-3)}

/* ---------- flags ---------- */
.flag{display:inline-block;overflow:hidden;width:28px;height:28px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--card),0 2px 6px rgba(40,10,30,.18)}

.flag.flag-lg{width:52px;height:52px}
@media (max-width:520px){.hdr-r .hide-xs,.hide-xs{display:none!important}}

/* ---------- forms ---------- */
.field{display:grid;gap:7px}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--fg-2)}
.inp{width:100%;height:50px;padding:0 16px;border-radius:15px;border:1.5px solid var(--line-2);background:var(--input);color:var(--fg);font-size:15.5px;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
textarea.inp{height:auto;min-height:110px;padding:13px 16px;resize:vertical;line-height:1.5}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 21px) 52%,calc(100% - 16px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
.inp:hover{border-color:var(--fg-3)}
.inp:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 4px rgba(255,62,127,.16)}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(222,47,74,.12)}
.ferr{font-size:13px;color:var(--bad);font-weight:500;min-height:0}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:52px}
.inp-wrap .icon-btn{position:absolute;right:5px;top:4px;width:42px;height:42px}
.inp-wrap .brand{position:absolute;right:12px;top:50%;transform:translateY(-50%);height:24px;display:flex}
.inp-wrap .brand svg{height:24px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .3s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(40,10,30,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toggle input:checked+span{background:var(--grad)}
.toggle input:checked+span::after{transform:translateX(22px)}
.toggle input:focus-visible+span{outline:2.5px solid var(--g2);outline-offset:3px}
.opt-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.opt-row .grow{flex:1;min-width:0}
.opt-row b{display:block;font-weight:600}
.opt-row small{display:block;color:var(--fg-3);font-size:13.5px}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-art{position:relative;background:var(--grad);color:#fff;padding:40px 56px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.auth-art::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 50% at 20% 0%,rgba(255,210,140,.5),transparent 70%),radial-gradient(50% 60% at 100% 100%,rgba(110,50,255,.45),transparent 70%)}
.auth-art .logo{color:#fff;position:relative;z-index:1}
.auth-art h2,.auth-art ul{position:relative;z-index:1}
.auth-art .logo-mark{background:#fff}
.auth-art h2{font-size:clamp(34px,3.8vw,52px);margin-top:auto;max-width:480px}
.auth-art ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px}
.auth-art li{display:flex;gap:12px;align-items:center;font-weight:500}
.auth-art li .wi{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.auth-art li svg{width:18px;height:18px}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding:40px var(--gut-r) 40px var(--gut)}
.auth-box{width:100%;max-width:420px;margin:0 auto}
.auth-box h1{font-size:38px;margin:14px 0 8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line-2);font-weight:600;transition:box-shadow .2s,transform .2s}
.gbtn:hover{box-shadow:inset 0 0 0 1.5px var(--fg-3);transform:translateY(-1px)}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:14px;color:var(--fg-3);font-size:13px;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-2)}
.demo-tip{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--grad-soft);margin-top:18px;font-size:14px}
.demo-tip svg{width:20px;height:20px;color:var(--g2)}
.demo-tip button{margin-left:auto}

/* ---------- panel ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh;background:var(--bg-soft)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 16px;background:var(--card);border-right:1px solid var(--line)}
.side .logo{padding:4px 10px 22px}
.side-nav{display:grid;gap:4px}
.side-nav button{display:flex;align-items:center;gap:13px;height:48px;padding:0 14px;border-radius:15px;font-weight:600;color:var(--fg-2);transition:background .2s,color .2s;text-align:left}
.side-nav button svg{width:20px;height:20px}
.side-nav button:hover{background:var(--bg-tint);color:var(--fg)}
.side-nav button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.side-nav button[aria-current="page"] svg{color:#FF7FAA}
.side-cta{margin-top:auto;padding:18px;border-radius:22px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.side-cta small{display:block;opacity:.85;font-size:12.5px;font-weight:600}
.side-cta b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px}
.side-foot{display:flex;align-items:center;gap:6px;padding-top:12px}
.main{min-width:0;padding:28px max(36px,env(safe-area-inset-right,0px)) 60px max(36px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;min-height:46px}
.topbar h1{font-size:clamp(26px,3vw,34px);letter-spacing:-.035em}
.topbar .sp{flex:1}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad-lilac);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:15px}
.mtop{display:none}
.bnav{display:none}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);padding:24px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-h h2,.card-h h3{font-family:var(--f-ui);font-size:18px;font-weight:700;letter-spacing:-.015em}
.grid-dash{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.bal{position:relative;padding:26px;border-radius:var(--r-lg);background:var(--grad);color:#fff;overflow:hidden;isolation:isolate;box-shadow:0 26px 50px -24px rgba(255,62,127,.75)}
.bal::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 70% at 100% 0%,rgba(255,255,255,.35),transparent 60%)}
.bal small{font-weight:600;opacity:.88;font-size:14px}
.bal .amt{font-family:var(--f-display);font-weight:800;font-size:46px;letter-spacing:-.045em;line-height:1;margin:10px 0 22px}
.bal .shape{opacity:.95}
.kv{display:grid;gap:4px}
.kv small{color:var(--fg-3);font-size:13px;font-weight:600}
.kv b{font-size:17px;font-weight:700}
.servers{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.scard{position:relative;text-align:left;padding:22px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line);transition:transform .3s cubic-bezier(.2,.9,.3,1),box-shadow .3s;overflow:hidden;width:100%}
.scard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--acc,var(--grad))}
.scard:hover{transform:translateY(-4px);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.scard-h{display:flex;align-items:center;gap:12px}
.scard-h .ib{--b:var(--acc)}
.scard-n{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard-s{font-size:13.5px;color:var(--fg-3)}
.scard-specs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;background:var(--bg-tint);font-size:12.5px;font-weight:600;color:var(--fg-2)}
.tag .flag{width:16px;height:16px;box-shadow:none}
.scard-f{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.new-card{display:grid;place-items:center;text-align:center;gap:10px;min-height:200px;border-radius:var(--r-lg);border:2px dashed var(--line-2);color:var(--fg-2);font-weight:600;transition:border-color .3s,background .3s,color .3s;width:100%}
.new-card:hover{border-color:var(--g2);color:var(--g2);background:var(--card)}
.new-card .ib{margin:0 auto}
.list{display:grid}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:600}
.li small{color:var(--fg-3);font-size:13px}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.mute{background:var(--card-3);color:var(--fg-3)}
.tbl-box{overflow-x:auto;margin:0 -24px;padding:0 24px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
.tbl th{text-align:left;font-size:12.5px;font-weight:700;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;padding:0 12px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--fg-3)}

/* wizard */
.wz{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.stepper{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px;margin:-4px -4px 20px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stp{display:flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 6px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;color:var(--fg-2);white-space:nowrap;transition:background .3s,color .3s}
.stp i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg-tint);font-style:normal;font-weight:800;font-size:13px}
.stp i svg{width:16px;height:16px}
.stp.done i{background:var(--ok-bg);color:var(--ok)}
.stp[aria-current="step"]{background:var(--fg);color:var(--bg);box-shadow:none}
.stp[aria-current="step"] i{background:var(--grad);color:#fff}
.play .wz-body.anim{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.wz-body h2{font-size:26px;letter-spacing:-.03em;margin-bottom:6px}
.wz-body>p{color:var(--fg-2);margin-bottom:22px}
.tiles{display:grid;gap:14px}
.tiles.c2{grid-template-columns:1fr 1fr}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;text-align:left;padding:20px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .25s,transform .25s cubic-bezier(.3,1.3,.5,1),background .25s;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--fg-3);transform:translateY(-2px)}
.tile[aria-pressed="true"],.tile[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px var(--g2),0 16px 30px -18px rgba(255,62,127,.7);background:linear-gradient(var(--card),var(--card)) padding-box}
.tile .chk{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;color:#fff;transition:background .25s,box-shadow .25s}
.tile .chk svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.tile[aria-pressed="true"] .chk,.tile[aria-checked="true"] .chk{background:var(--grad);box-shadow:none}
.tile[aria-pressed="true"] .chk svg,.tile[aria-checked="true"] .chk svg{opacity:1;transform:none}
.tile b{font-weight:700;font-size:16.5px}
.tile small{color:var(--fg-3);font-size:13.5px;line-height:1.45}
.tile .tp{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;margin-top:6px}
.tile .tp small{font-family:var(--f-ui);font-weight:500;font-size:13px;letter-spacing:0}
.tile .hot-tag{position:absolute;top:-10px;left:16px;height:22px;padding:0 9px;border-radius:999px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center}
.tile.big{padding:26px;gap:10px;overflow:hidden}
.tile.big .shape{right:-20px;bottom:-20px}
.os-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.os-ic svg{width:24px;height:24px}
.wz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.sum{position:sticky;top:24px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--line);overflow:hidden}
.sum-h{padding:22px 24px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.sum-h h3{font-family:var(--f-ui);font-size:15px;font-weight:600;opacity:.8}
.sum-h .tot{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.045em;line-height:1;margin-top:8px}
.sum-h .tot small{font-family:var(--f-ui);font-size:14px;font-weight:500;letter-spacing:0;opacity:.75}
.sum-h .shape{right:-26px;top:-26px}
.sum-b{padding:18px 24px 24px}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14.5px;border-bottom:1px dashed var(--line-2)}
.sum-row span:first-child{color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;min-width:0}
.sum-row span:last-child{font-weight:600;text-align:right}
.sum-row .flag{width:18px;height:18px;box-shadow:none}
.sum-row.disc span:last-child{color:var(--ok)}
.sum-vat{font-size:12.5px;color:var(--fg-3);margin:12px 0 16px;display:flex;gap:8px}
.sum-vat svg{width:16px;height:16px;flex:none;margin-top:2px}
.msum{display:none}

/* checkout */
.co{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.method{position:relative;text-align:left;padding:20px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:14px;min-height:150px;transition:box-shadow .25s,transform .25s cubic-bezier(.3,1.3,.5,1)}
.method:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1.5px var(--fg-3),var(--sh)}
.method[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--g2),0 18px 36px -20px rgba(255,62,127,.8)}
.method b{font-size:17px;font-weight:700}
.method small{color:var(--fg-3);font-size:13px;display:block}
.method-ic{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.method-ic span{height:30px;padding:0 6px;border-radius:8px;background:var(--bg-soft);display:grid;place-items:center}
.method-ic svg{height:18px;width:auto}
.method .chk{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;color:#fff}
.method .chk svg{width:14px;height:14px;opacity:0}
.method[aria-pressed="true"] .chk{background:var(--grad);box-shadow:none}
.method[aria-pressed="true"] .chk svg{opacity:1}
.method[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.cc{position:relative;aspect-ratio:1.586;max-width:360px;border-radius:24px;padding:22px;color:#fff;background:var(--grad);overflow:hidden;box-shadow:0 30px 50px -26px rgba(255,62,127,.85);display:flex;flex-direction:column;isolation:isolate;margin-bottom:24px}
.cc::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 80% at 100% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(100,40,255,.4),transparent 70%)}
.cc-chip{width:42px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FFE6A6,#E6B85C);box-shadow:inset 0 0 0 1px rgba(120,80,0,.3)}
.cc-num{font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(17px,4.6vw,21px);letter-spacing:.1em;margin-top:auto;white-space:nowrap}
.cc-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-size:13px;gap:10px}
.cc-row small{display:block;opacity:.75;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.cc-row b{font-weight:600;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:180px}
.cc-brand{position:absolute;top:20px;right:22px;height:30px;display:flex}
.cc-brand svg{height:30px;width:auto}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.coin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:13.5px;text-align:center;transition:box-shadow .25s,transform .25s}
.coin small{display:block;font-weight:500;color:var(--fg-3);font-size:12px}
.coin:hover{transform:translateY(-2px)}
.coin[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--g2)}
.coin-ic{position:relative;width:40px;height:40px}
.coin-ic>svg{width:40px;height:40px}
.coin-ic .net{position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.coin-ic .net svg{width:20px;height:20px}
.cpay{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.qr-box{padding:14px;border-radius:24px;background:#fff;box-shadow:var(--sh);position:relative}
.qr-box canvas{display:block;width:180px;height:180px;image-rendering:pixelated}
.qr-box .qr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.qr-box .qr-logo svg{width:38px;height:38px}
.addr{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--bg-soft);box-shadow:inset 0 0 0 1px var(--line)}
.addr .mono,.addr .addr-t{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere;font-size:13.5px;line-height:1.4}
.cnt{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt svg{width:18px;height:18px;color:var(--g2)}
.track{display:grid;gap:0;margin-top:22px}
.trk{display:grid;grid-template-columns:32px 1fr;gap:14px;position:relative;padding-bottom:18px}
.trk:last-child{padding-bottom:0}
.trk::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line-2)}
.trk:last-child::before{display:none}
.trk.done::before{background:var(--grad)}
.trk i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card-3);color:var(--fg-3);position:relative;z-index:1;font-style:normal}
.trk i svg{width:16px;height:16px}
.trk.done i{background:var(--grad);color:#fff}
.trk.now i{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--g2);color:var(--g2)}
.trk.now i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--g2);opacity:.4;animation:mp 1.8s ease-out infinite}
.trk b{display:block;font-weight:600;padding-top:4px}
.trk small{color:var(--fg-3);font-size:13px}

/* provisioning */
.prov{max-width:760px;margin:0 auto}
.prov-card{position:relative;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh-lg),inset 0 0 0 1px var(--line);padding:40px;overflow:hidden;isolation:isolate}
.prov-card .shape{z-index:-1}
.prov-top{display:flex;align-items:center;gap:26px;margin-bottom:30px}
.prov-ring{position:relative;width:130px;height:130px;flex:none}
.prov-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.prov-ring circle{transition:stroke-dashoffset .6s ease}
.prov-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.03em}
.creds{display:grid;gap:10px;margin:26px 0}
.cred{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;padding:12px 8px 12px 18px;border-radius:16px;background:var(--bg-soft)}
.cred small{color:var(--fg-3);font-weight:600;font-size:13px}
.cred .mono{font-weight:600;overflow-wrap:anywhere;min-width:0}
.cred .acts{display:flex;gap:2px}
.mail-note{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:var(--info-bg);color:var(--info);font-weight:600;font-size:14.5px}
.mail-note svg{width:20px;height:20px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-40px;display:block;animation:fall var(--d,3s) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--x,0),110vh,0) rotate(var(--r,540deg))}}

/* server page */
.sv-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sv-head .flag{width:52px;height:52px}
.sv-head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em}
.sv-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:5px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border-radius:13px;font-weight:600;font-size:14.5px;color:var(--fg-2);white-space:nowrap;transition:background .25s,color .25s}
.tabs button svg{width:17px;height:17px}
.tabs button:hover{color:var(--fg);background:var(--bg-tint)}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.play .tabpanel.anim{animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:20px;border-radius:22px;background:var(--card);box-shadow:var(--sh-sm),inset 0 0 0 1px var(--line)}
.stat small{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-weight:600;font-size:13px}
.stat small svg{width:16px;height:16px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.chart{width:100%;height:180px;display:block}
.chart.sm{height:110px}
.chart-legend{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.chart-legend b{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.03em}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('nutraver.pulse.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nutraver.pulse.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
let LANG = LS.get('lang', 'en');
if (!I18N[LANG]) LANG = 'en';
document.documentElement.lang = LANG;
function t(k, v) {
  let s = I18N[LANG][k];
  if (s == null) s = I18N.en[k];
  if (s == null) s = k;
  if (v) s = s.replace(/\{(\w+)\}/g, (m, n) => (v[n] != null ? v[n] : m));
  return s;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const loc = () => (LANG === 'ru' ? 'ru-RU' : 'en-IE');
function money(n) { return new Intl.NumberFormat(loc(), { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n); }
function money0(n) { return Number.isInteger(n) ? new Intl.NumberFormat(loc(), { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n) : money(n); }
function num(n, d) { return new Intl.NumberFormat(loc(), { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }).format(n); }
function fmtDate(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString(LANG === 'ru' ? 'ru-RU' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function todayISO(offsetDays) { const d = new Date(); d.setDate(d.getDate() + (offsetDays || 0)); return d.toISOString().slice(0, 10); }

/* ---------- charts ---------- */
function linePath(data, w, h, max) {
  const n = data.length; const step = w / (n - 1);
  let d = '';
  data.forEach((v, i) => {
    const x = i * step, y = h - (Math.min(v, max) / max) * (h - 8) - 4;
    if (i === 0) d = 'M' + x.toFixed(1) + ' ' + y.toFixed(1);
    else { const px = (i - 1) * step, py = h - (Math.min(data[i - 1], max) / max) * (h - 8) - 4; const cx = (px + x) / 2; d += ' C' + cx.toFixed(1) + ' ' + py.toFixed(1) + ' ' + cx.toFixed(1) + ' ' + y.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1); }
  });
  return d;
}
function chart(datasets, o) {
  o = o || {}; const w = 600, h = o.h || 180, max = o.max || 100;
  let g = '';
  for (let i = 1; i < 4; i++) g += '<line x1="0" x2="' + w + '" y1="' + (h * i / 4) + '" y2="' + (h * i / 4) + '" stroke="var(--line)" stroke-dasharray="4 6" vector-effect="non-scaling-stroke"/>';
  const body = datasets.map((ds, i) => {
    const p = linePath(ds, w, h, max);
    const stroke = i === 0 ? 'url(#gLine)' : '#B57BFF';
    const fill = i === 0 ? 'url(#gArea)' : 'url(#gArea2)';
    return '<path d="' + p + ' L' + w + ' ' + h + ' L0 ' + h + 'Z" fill="' + fill + '"/><path d="' + p + '" fill="none" stroke="' + stroke + '" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }).join('');
  return '<svg class="chart ' + (o.cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="' + esc(o.label || '') + '">' + g + body + '</svg>';
}

/* ---------- pseudo QR ---------- */
function drawQR(cv, seed) {
  if (!cv) return;
  const N = 29, sc = 8; cv.width = N * sc; cv.height = N * sc;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  x.fillStyle = '#24112B';
  const finder = (cx, cy) => { x.fillRect(cx * sc, cy * sc, 7 * sc, 7 * sc); x.fillStyle = '#fff'; x.fillRect((cx + 1) * sc, (cy + 1) * sc, 5 * sc, 5 * sc); x.fillStyle = '#24112B'; x.fillRect((cx + 2) * sc, (cy + 2) * sc, 3 * sc, 3 * sc); };
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const inF = (r < 8 && c < 8) || (r < 8 && c > N - 9) || (r > N - 9 && c < 8);
    const mid = r > 10 && r < 18 && c > 10 && c < 18;
    if (!inF && !mid && rnd() > .52) x.fillRect(c * sc, r * sc, sc, sc);
  }
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
}

let countObs = null;
function fmtCount(el, v) { const d = +(el.dataset.dec || 0); return num(v, d) + (el.dataset.suf || ''); }
function initCounters(root) {
  const els = $$('[data-count]', root);
  els.forEach(el => { el.textContent = fmtCount(el, +el.dataset.count); });
  if (REDUCED() || !('IntersectionObserver' in window)) return;
  if (countObs) countObs.disconnect();
  countObs = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return; countObs.unobserve(e.target);
      const el = e.target, to = +el.dataset.count, from = +(el.dataset.from || 0), t0 = performance.now(), dur = 1500;
      const step = now => { const k = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - k, 3); el.textContent = fmtCount(el, from + (to - from) * ease); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, { threshold: .5 });
  els.forEach(el => countObs.observe(el));
}

function runProv() {
  const p = S.prov; if (!p || p.done) return;
  const total = PSTEPS.reduce((a, b) => a + b[1], 0);
  const R = 56, C = 2 * Math.PI * R;
  const upd = () => {
    if (currentView !== 'provisioning') return;
    const el = Date.now() - p.start; let acc = 0;
    $$('#pvTrack .trk').forEach((row, i) => {
      const s0 = acc; acc += PSTEPS[i][1];
      const done = el >= acc, now = !done && el >= s0;
      row.className = 'trk' + (done ? ' done' : now ? ' now' : '');
      row.querySelector('i').innerHTML = done ? ic('check') : now ? ic('clock') : '';
    });
    const k = Math.min(1, el / total);
    const ring = $('#pvRing'); if (ring) ring.setAttribute('stroke-dashoffset', (C * (1 - k)).toFixed(1));
    const pc = $('#pvPct'); if (pc) pc.textContent = Math.round(k * 100) + '%';
    if (el >= total + 400) {
      p.done = true; const s = srv(p.serverId); if (s) s.status = 'running';
      render(); confetti(); toast(t('toast.ready'), 'rocket');
    }
  };
  upd(); every(upd, 200);
}

function svRefresh() { if (currentView === 'server') { const y = window.scrollY; render(true); window.scrollTo(0, y); } }
function termRun(cmd) {
  const s = srv(S.cur); const L = S.term[s.id]; const p = getPlan(s.type, s.plan);
  L.push({ c: 'p', x: cmd });
  const c = cmd.trim();
  const out = x => L.push({ c: 'o', x });
  if (!c) { } else if (c === 'help') out(t('con.help'));
  else if (c === 'ls') out('backups  docker-compose.yml  logs  www');
  else if (c === 'ls -la' || c === 'll') out('drwx------  6 root root 4096 Nov 20 09:12 .\ndrwxr-xr-x 19 root root 4096 Aug 14 11:02 ..\n-rw-r--r--  1 root root 3106 Aug 14 11:02 .bashrc\ndrwx------  2 root root 4096 Aug 14 11:03 .ssh\ndrwxr-xr-x  2 root root 4096 Nov 02 18:40 backups\n-rw-r--r--  1 root root  812 Oct 30 14:21 docker-compose.yml\ndrwxr-xr-x  3 root root 4096 Nov 19 23:59 logs\ndrwxr-xr-x  5 root root 4096 Nov 11 16:05 www');
  else if (c === 'uptime') out(' ' + new Date().toTimeString().slice(0, 8) + ' up 37 days,  4:12,  1 user,  load average: 0.' + Math.round(s.m.cpu[39] / 10) + '4, 0.31, 0.27');
  else if (c === 'df -h' || c === 'df') { const d = s.type === 'ded' ? 1800 : p.disk; out('Filesystem      Size  Used Avail Use% Mounted on\n/dev/' + (s.type === 'ded' ? 'md0' : 'vda1') + '       ' + (s.type === 'ded' ? '1.8T  0.6T  1.2T' : (d + 'G').padEnd(5) + ' ' + (Math.round(d * .27) + 'G').padEnd(5) + ((d - Math.round(d * .27)) + 'G').padEnd(5)) + '  27% /\ntmpfs           ' + (s.type === 'ded' ? '32G' : Math.round(p.ram / 2) + 'G') + '     0  ' + (s.type === 'ded' ? '32G' : Math.round(p.ram / 2) + 'G') + '   0% /dev/shm'); }
  else if (c === 'free -h' || c === 'free') { const r = s.type === 'ded' ? parseInt(p.ram, 10) : p.ram; out('               total        used        free\nMem:           ' + r + 'Gi       ' + num(r * s.m.ram[39] / 100, 1) + 'Gi       ' + num(r - r * s.m.ram[39] / 100, 1) + 'Gi\nSwap:          2.0Gi          0B       2.0Gi'); }
  else if (c === 'whoami') out('root');
  else if (c === 'hostname') out(s.name);
  else if (c === 'nproc') out(String(s.type === 'ded' ? parseInt(p.cores, 10) : p.cpu));
  else if (c === 'date') out(new Date().toString());
  else if (c === 'ip a' || c === 'ip addr') out('2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500\n    inet ' + s.ipv4 + '/24 scope global eth0\n    inet6 ' + s.ipv6 + '/64 scope global');
  else if (c === 'clear') { S.term[s.id] = []; }
  else out(t('con.nf', { cmd: c.split(' ')[0] }));
}

function curRoute() { const h = (location.hash || '').slice(1); if (ROUTES.includes(h)) return h; if (h) history.replaceState(null, '', '#home'); return 'home'; }

const FORMS = {
  auth: (f) => {

  card: () => { if (validateCard()) threeDS(); },

  rename: () => { const s = srv(S.cur), v = $('#sv-name').value.trim(); if (!/^[a-zA-Z0-9][a-zA-Z0-9.-]{1,62}$/.test(v)) { $('#sv-name-err').textContent = t('op.eName'); $('#sv-name').classList.add('err'); return; } s.name = v; svRefresh(); toast(t('toast.renamed', { name: v }), 'edit'); },

  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => { const h = e.target.dataset && e.target.dataset.in; if (h && IN[h]) IN[h](e.target, e); });
document.addEventListener('change', e => { const h = e.target.dataset && e.target.dataset.ch; if (h && CH[h]) CH[h](e.target, e); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (MODAL) closeModal(); else closeDrawer(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
    const i = STABS.findIndex(x => x[0] === S.svTab); const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + STABS.length) % STABS.length;
    S.svTab = STABS[n][0]; svRefresh(); const b = $('#tab-' + S.svTab); if (b) b.focus();
  }
  if (e.key === 'Tab' && MODAL) {
    const f = $$('#modal-root button:not([disabled]), #modal-root input, #modal-root select, #modal-root textarea');
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener('hashchange', () => { closeModal(true); render(); });

applyTheme();
if (document.visibilityState === 'visible') document.documentElement.classList.add('play');
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeThumbs(document));
