<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nutraver Nordic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Mulish:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F7;--bg2:#EAEEF2;--surface:#FFFFFF;--surface2:#F7F8FA;--fg:#15191E;--muted:#58616D;--faint:#7F8893;
  --line:#DBE0E6;--line2:#E8ECF0;--hover:rgba(21,25,30,.04);
  --acc:#2B76A6;--acc-h:#22658F;--acc-fg:#FFFFFF;--ice:#BCDCF0;--ice-soft:#E6F1F8;--ice-ink:#1F5E86;
  --ok:#1D8A57;--ok-soft:#E3F3EA;--warn:#A66A12;--warn-soft:#FAF0DD;--bad:#BE3A2E;--bad-soft:#FBE7E4;
  --glass:rgba(243,245,247,.72);--glass-line:rgba(21,25,30,.07);
  --sh-sm:0 1px 2px rgba(20,30,45,.05),0 1px 1px rgba(20,30,45,.03);
  --sh:0 1px 2px rgba(20,30,45,.04),0 8px 24px -8px rgba(20,30,45,.10);
  --sh-lg:0 2px 6px rgba(20,30,45,.04),0 30px 60px -20px rgba(20,30,45,.20);
  --slab-t1:#FFFFFF;--slab-t2:#E2E8EE;--slab-l1:#B6C1CD;--slab-l2:#D3DAE2;--slab-r1:#E6EBF0;--slab-r2:#F3F6F8;--slab-edge:rgba(255,255,255,.9);--floor:rgba(30,45,60,.22);
  --term:#121619;--term-fg:#D9E3EA;
  --gut:max(16px, env(safe-area-inset-left, 0px));--gutr:max(16px, env(safe-area-inset-right, 0px));
  --r:18px;--r-sm:12px;--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215;--bg2:#14181C;--surface:#191D22;--surface2:#1F2429;--fg:#E8ECF0;--muted:#9AA3AD;--faint:#6E7781;
  --line:#2A3037;--line2:#23292F;--hover:rgba(255,255,255,.04);
  --acc:#8CC3E6;--acc-h:#A8D3EF;--acc-fg:#0C1821;--ice:#2B4658;--ice-soft:#17242D;--ice-ink:#A8D3EF;
  --ok:#4CC08A;--ok-soft:#14281F;--warn:#E0A84A;--warn-soft:#2A2214;--bad:#EE7B6F;--bad-soft:#2E1A18;
  --glass:rgba(15,18,21,.72);--glass-line:rgba(255,255,255,.06);
  --sh-sm:0 1px 2px rgba(0,0,0,.3);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.55);--sh-lg:0 30px 70px -20px rgba(0,0,0,.7);
  --slab-t1:#3A424B;--slab-t2:#262C33;--slab-l1:#161A1E;--slab-l2:#1E2328;--slab-r1:#22282E;--slab-r2:#2B3239;--slab-edge:rgba(255,255,255,.14);--floor:rgba(0,0,0,.6);
  --term:#0B0E10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215;--bg2:#14181C;--surface:#191D22;--surface2:#1F2429;--fg:#E8ECF0;--muted:#9AA3AD;--faint:#6E7781;
  --line:#2A3037;--line2:#23292F;--hover:rgba(255,255,255,.04);
  --acc:#8CC3E6;--acc-h:#A8D3EF;--acc-fg:#0C1821;--ice:#2B4658;--ice-soft:#17242D;--ice-ink:#A8D3EF;
  --ok:#4CC08A;--ok-soft:#14281F;--warn:#E0A84A;--warn-soft:#2A2214;--bad:#EE7B6F;--bad-soft:#2E1A18;
  --glass:rgba(15,18,21,.72);--glass-line:rgba(255,255,255,.06);
  --sh-sm:0 1px 2px rgba(0,0,0,.3);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -10px rgba(0,0,0,.55);--sh-lg:0 30px 70px -20px rgba(0,0,0,.7);
  --slab-t1:#3A424B;--slab-t2:#262C33;--slab-l1:#161A1E;--slab-l2:#1E2328;--slab-r1:#22282E;--slab-r2:#2B3239;--slab-edge:rgba(255,255,255,.14);--floor:rgba(0,0,0,.6);
  --term:#0B0E10;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 "Mulish","Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Jost","Futura","Century Gothic",system-ui,sans-serif;font-weight:500;letter-spacing:.005em;margin:0;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;letter-spacing:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}.ic-lg{width:24px;height:24px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
@media (min-width:760px){:root{--gut:max(32px, env(safe-area-inset-left, 0px));--gutr:max(32px, env(safe-area-inset-right, 0px))}}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.eyebrow{font:600 13px/1 "Mulish",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:18px;display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap;transition:background .2s,color .2s,box-shadow .25s var(--ease),transform .2s var(--ease),border-color .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--acc);color:var(--acc-fg);box-shadow:0 1px 2px rgba(20,60,90,.18),0 8px 20px -10px rgba(43,118,166,.55)}
.btn-primary:hover{background:var(--acc-h);transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,60,90,.18),0 14px 28px -12px rgba(43,118,166,.6)}
.btn-primary:active{transform:scale(.97)}
.btn-quiet{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line),var(--sh-sm)}
.btn-quiet:hover{box-shadow:inset 0 0 0 1px var(--faint),var(--sh);transform:translateY(-1px)}
.btn-ghost{color:var(--fg);height:40px;padding:0 14px}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}
.btn-sm{height:38px;padding:0 16px;font-size:14px}
.btn-lg{height:56px;padding:0 30px;font-size:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icbtn{width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;color:var(--fg);transition:background .2s}
.icbtn:hover{background:var(--hover)}
.link{color:var(--acc);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* segmented */
.seg{--n:2;--i:0;position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line2)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(20,30,45,.08),0 3px 10px -3px rgba(20,30,45,.14);transform:translateX(calc(var(--i)*100%));transition:transform .38s var(--ease)}
.seg button{position:relative;z-index:1;height:36px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:color .2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg.sm button{height:30px;padding:0 12px;font-size:13px}
.save{font-size:11px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:2px 7px;border-radius:999px}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid var(--glass-line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:inline-flex;align-items:center;gap:10px;font:600 21px/1 "Jost",sans-serif;letter-spacing:.02em}
.logo-mk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#2F3740,#14181D);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 10px -4px rgba(0,0,0,.4)}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button,.nav a{height:38px;padding:0 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:color .2s,background .2s;display:inline-flex;align-items:center}
.nav button:hover,.nav a:hover{color:var(--fg);background:var(--hover)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr .menu-btn{display:none}
@media (max-width:980px){.nav{display:none}.hdr .hide-m{display:none}.hdr .menu-btn{display:inline-grid}}
@media (max-width:420px){.hdr .seg button{padding:0 9px}.hdr-r{gap:4px}.hdr .wrap{gap:10px}}
.drawer{position:fixed;inset:68px 0 auto 0;z-index:49;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-lg);padding:12px var(--gutr) 20px var(--gut);animation:dropIn .3s var(--ease)}
.drawer button,.drawer a{display:flex;width:100%;height:52px;align-items:center;font-weight:600;font-size:17px;border-bottom:1px solid var(--line2)}
.drawer .btn{margin-top:14px;border:0;justify-content:center;height:50px}
@keyframes dropIn{from{transform:translateY(-8px)}to{transform:none}}

/* hero */
.hero{position:relative;padding:72px 0 40px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.85fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(44px,5.1vw,74px);font-weight:500;letter-spacing:.004em;line-height:1.02}
.hero h1 span{color:var(--muted)}
.hero .sub{font-size:clamp(18px,1.6vw,21px);color:var(--muted);margin-top:26px;max-width:520px;line-height:1.5}
.hero .ctas{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
.hero .trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:40px;color:var(--muted);font-size:14px;font-weight:600}
.hero .trust span{display:inline-flex;align-items:center;gap:7px}
.hero .trust .ic{color:var(--acc);width:17px;height:17px}
.enter{animation:rise .9s var(--ease) both}
.enter.d1{animation-delay:.08s}.enter.d2{animation-delay:.16s}.enter.d3{animation-delay:.24s}.enter.d4{animation-delay:.32s}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
.stage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;margin:0 auto}
.stage::before{content:"";position:absolute;inset:6% 4% 10%;border-radius:50%;background:radial-gradient(closest-side,var(--ice-soft),transparent 70%);opacity:.95}
.node{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.node .slab{animation:float 7s ease-in-out infinite;transform-box:fill-box}
.node .s2{animation-delay:-.6s}.node .s3{animation-delay:-1.2s}
.node .floor{animation:floorPulse 7s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.node .sheen{animation:sheen 9s ease-in-out infinite}
.node .glow{animation:glow 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floorPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.8}}
@keyframes sheen{0%,100%{transform:translateX(-40px);opacity:.0}45%{opacity:.55}55%{opacity:.55}70%{transform:translateX(60px);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.spin{animation:sway 14s ease-in-out infinite;transform-origin:50% 55%}
@keyframes sway{0%,100%{transform:perspective(900px) rotateY(-6deg)}50%{transform:perspective(900px) rotateY(6deg)}}
.pill{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--glass-line),var(--sh);font-size:14px;font-weight:700;white-space:nowrap;animation:float 8s ease-in-out infinite}
.pill .pi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--acc);box-shadow:var(--sh-sm)}
.pill small{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.pill b{display:block;line-height:1.25}
.pill.p1{top:12%;left:-2%}.pill.p2{top:40%;right:-4%;animation-delay:-2.5s}.pill.p3{bottom:12%;left:6%;animation-delay:-5s}
@media (max-width:900px){.hero{padding:40px 0 24px}.hero-grid{grid-template-columns:1fr;gap:12px}.stage{max-width:440px}.pill.p1{left:0}.pill.p2{right:0}}
@media (max-width:420px){.pill{font-size:12.5px;padding:7px 12px 7px 7px}.pill .pi{width:26px;height:26px}.pill small{font-size:11px}}

/* sections */
.sec{padding:120px 0;position:relative}
.sec.alt{background:var(--surface)}
.sec.fog{background:var(--bg2)}
.sec-h{max-width:720px;margin-bottom:56px}
.sec-h.c{margin-left:auto;margin-right:auto;text-align:center}
.sec-h h2{font-size:clamp(34px,4.4vw,56px);letter-spacing:.006em}
.sec-h p{font-size:19px;color:var(--muted);margin-top:18px;line-height:1.55}
@media (max-width:760px){.sec{padding:76px 0}.sec-h{margin-bottom:36px}.sec-h p{font-size:17px}}

/* stats strip */
.strip{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip .it{padding:28px 20px;display:flex;align-items:center;gap:14px}
.strip .it+.it{border-left:1px solid var(--line2)}
.strip .n{font:500 30px/1 "Jost",sans-serif;letter-spacing:.01em;white-space:nowrap}
.strip .l{font-size:14px;color:var(--muted);font-weight:600;line-height:1.35}
.strip .pmr{display:flex;gap:4px}
@media (max-width:860px){.strip .wrap{grid-template-columns:1fr 1fr}.strip .it:nth-child(3){border-left:0}.strip .it:nth-child(n+3){border-top:1px solid var(--line2)}}
@media (max-width:420px){.strip .it{padding:20px 4px 20px 12px;gap:10px;flex-direction:column;align-items:flex-start}.strip .it:nth-child(odd){padding-left:0}.strip .n{font-size:26px}}

/* speed */
.speed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px;align-items:center}
.bignum{font:500 clamp(130px,19vw,260px)/.86 "Jost",sans-serif;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.08em}
.bignum small{font-size:.32em;color:var(--acc);font-weight:500}
.timeline{display:grid;gap:0;margin-top:8px}
.tl{display:grid;grid-template-columns:64px 1fr;gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.tl:last-child{border-bottom:1px solid var(--line)}
.tl .t{font:500 22px/1.2 "Jost",sans-serif;color:var(--acc)}
.tl h3{font-size:22px;margin-bottom:6px}
.tl p{color:var(--muted)}
.tl .pmr{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
@media (max-width:900px){.speed{grid-template-columns:1fr;gap:28px}}

/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
.feat{background:var(--surface);padding:36px 32px;transition:background .25s}
.feat:hover{background:var(--surface2)}
.feat .fi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--ice-soft);color:var(--ice-ink);margin-bottom:22px}
.feat h3{font-size:21px;margin-bottom:8px}
.feat p{color:var(--muted);font-size:15.5px}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.feats{grid-template-columns:1fr}.feat{padding:26px 22px}}

/* equinix */
.eqx{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:72px;align-items:start}
.eqx-lead h2{font-size:clamp(34px,4.4vw,56px)}
.eqx-lead p{font-size:19px;color:var(--muted);margin-top:22px;line-height:1.55}
.eqx-lead .facts{display:flex;gap:40px;margin-top:40px;flex-wrap:wrap}
.eqx-lead .facts b{display:block;font:500 44px/1 "Jost",sans-serif}
.eqx-lead .facts span{font-size:14px;color:var(--muted);font-weight:600}
.eqx-list{display:grid;gap:12px}
.eqx-it{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 24px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-sm);transition:transform .3s var(--ease),box-shadow .3s}
.eqx-it:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--line),var(--sh)}
.eqx-it .fi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--bg2);color:var(--fg)}
.eqx-it h3{font-size:19px;margin-bottom:4px}
.eqx-it p{color:var(--muted);font-size:15px}
.ixr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 6px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:700}
.chip.np{padding:0 12px}
@media (max-width:900px){.eqx{grid-template-columns:1fr;gap:40px}}

/* locations */
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.loc{position:relative;padding:32px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-sm);transition:transform .35s var(--ease),box-shadow .35s;overflow:hidden}
.loc:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line),var(--sh-lg)}
.loc h3{font-size:30px;margin-top:28px}
.loc .cty{color:var(--muted);font-weight:600;margin-top:4px}
.loc dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line2);font-size:14.5px}
.loc dt{color:var(--muted)}.loc dd{margin:0;font-weight:700;text-align:right}
.loc .ping{position:absolute;top:32px;right:32px;font:500 15px/1 "Jost",sans-serif;color:var(--ok);display:inline-flex;align-items:center;gap:7px}
.loc .ping i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}80%,100%{box-shadow:0 0 0 10px transparent}}
.mapbox{margin-top:20px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);padding:20px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.map-svg{width:100%;height:auto;display:block;-webkit-mask-image:radial-gradient(ellipse 60% 62% at 52% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 60% 62% at 52% 50%,#000 55%,transparent 100%)}
.map-svg .land{fill:var(--line)}
.map-svg .arc{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 6;animation:dash 2.4s linear infinite;opacity:.8}
@keyframes dash{to{stroke-dashoffset:-20}}
.map-svg .pt{fill:var(--acc);stroke:var(--surface);stroke-width:3}
.map-svg .ring{fill:none;stroke:var(--acc);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3);opacity:0}}

function calc(o){
  const p=planOf(o.type,o.plan);
  const win=(o.type==='vps'&&o.image==='windows')?9:0;
  const bk=o.backups?round2(p.price*.2):0;
  const ip=o.ipv4?2:0,dd=o.ddos?5:0;
  const monthly=round2(p.price+win+bk+ip+dd);
  const per=PERIODS.find(x=>x.id===o.period)||PERIODS[0];
  const gross=round2(monthly*per.months);
  const disc=round2(gross*per.disc);
  return {p,win,bk,ip,dd,monthly,per,gross,disc,total:round2(gross-disc)};
}

q1:'Which payment methods do you accept?',a1:'Visa, Mastercard, Apple Pay and Google Pay, plus USDT (TRC-20 and ERC-20), Bitcoin, Ethereum and Litecoin. You can also top up your account balance and pay from it.',

/* ---------- toast / sheet / copy ---------- */
function toast(msg){
  const box=$('#toasts');box.className='toasts'+(isPanel()?' pn':'');
  const el=document.createElement('div');el.className='toast';el.innerHTML=ic('check')+'<span>'+esc(msg)+'</span>';
  box.appendChild(el);setTimeout(()=>{el.remove()},2800);
}
let sheetReturn=null,sheetOnClose=null;
function sheet(html,opts){
  opts=opts||{};sheetReturn=document.activeElement;sheetOnClose=opts.onClose||null;
  $('#modal-root').innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="grab"></div>${html}</div></div>`;
  const f=$('#modal-root [autofocus]')||$('#modal-root input, #modal-root textarea, #modal-root select, #modal-root .btn');
  if(f)setTimeout(()=>f.focus(),60);
}
function closeSheet(){
  if(!$('#modal-root').innerHTML)return;
  $('#modal-root').innerHTML='';const cb=sheetOnClose;sheetOnClose=null;if(cb)cb();
  if(sheetReturn&&document.contains(sheetReturn))sheetReturn.focus();sheetReturn=null;
}
let confirmCb=null;
function confirmSheet(o){
  confirmCb=o.onOk;
  sheet(`<div class="sic ${o.danger?'bad':''}">${ic(o.icon||'info','ic-lg')}</div><h2 id="sh-title">${o.title}</h2><p class="sp-t">${o.text}</p>
  <div class="acts"><button class="btn btn-quiet" data-act="close">${t('cancel')}</button><button class="btn ${o.danger?'btn-danger':'btn-primary'}" data-act="confirm-ok">${o.ok}</button></div>`);
}
function selectText(el){
  if(!el)return;
  if(el.select){el.focus();el.select();return}
  try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
}
function copyText(text,el){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(()=>{selectText(el);toast(t('copy_manual'))});
    }else{selectText(el);toast(t('copy_manual'))}
  }catch(e){selectText(el);toast(t('copy_manual'))}
}

/* ---------- charts ---------- */
let gid=0;
function smoothPath(pts){
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function areaChart(sets,h){
  h=h||110;const w=600,pad=6,id='g'+(++gid);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px" aria-hidden="true"><defs>`;
  sets.forEach((x,i)=>{s+=`<linearGradient id="${id}${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${x.c};stop-opacity:.28"/><stop offset="1" style="stop-color:${x.c};stop-opacity:0"/></linearGradient>`});
  s+='</defs>';
  for(let g=1;g<4;g++){const y=(h*g/4).toFixed(1);s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" style="stroke:var(--line2)" stroke-width="1" vector-effect="non-scaling-stroke"/>`}
  sets.forEach((x,i)=>{
    const n=x.d.length;const pts=x.d.map((v,j)=>[j*(w/(n-1)),h-pad-(v/100)*(h-pad*2)]);const d=smoothPath(pts);
    s+=`<path d="${d} L${w},${h} L0,${h} Z" fill="url(#${id}${i})"/><path d="${d}" fill="none" style="stroke:${x.c}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  return s+'</svg>';
}

/* ---------- pseudo QR ---------- */
function drawQR(cv,text){
  if(!cv)return;const n=29,dpr=Math.max(2,window.devicePixelRatio||1),size=172;
  cv.width=size*dpr;cv.height=size*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  c.fillStyle='#fff';c.fillRect(0,0,size,size);
  const m=size/n;let seed=7;for(const ch of text)seed=(seed*31+ch.charCodeAt(0))>>>0;
  const r=()=>{seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296};
  const inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
  c.fillStyle='#15191E';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(inF(x,y))continue;if(x>=12&&x<=16&&y>=12&&y<=16)continue;
    if(r()>.5){c.beginPath();if(c.roundRect)c.roundRect(x*m+.5,y*m+.5,m-1,m-1,1.5);else c.rect(x*m,y*m,m,m);c.fill()}
  }
  const box=(x,y,s,col,rad)=>{c.fillStyle=col;c.beginPath();if(c.roundRect)c.roundRect(x*m,y*m,s*m,s*m,rad*m);else c.rect(x*m,y*m,s*m,s*m);c.fill()};
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{box(x,y,7,'#15191E',1.8);box(x+1,y+1,5,'#fff',1.2);box(x+2,y+2,3,'#2B76A6',.8)});
  box(12.5,12.5,4,'#2B76A6',1.2);
}

function rhomb(cx,cy,a,b){return `M${cx},${cy-b} L${cx+a},${cy} L${cx},${cy+b} L${cx-a},${cy} Z`}
function slab(cls,cx,cy,a,b,h,top){
  return `<g class="slab ${cls}">
   <path d="M${cx-a},${cy} L${cx},${cy+b} L${cx},${cy+b+h} L${cx-a},${cy+h} Z" fill="url(#gl)"/>
   <path d="M${cx},${cy+b} L${cx+a},${cy} L${cx+a},${cy+h} L${cx},${cy+b+h} Z" fill="url(#gr)"/>
   <path d="${rhomb(cx,cy,a,b)}" fill="url(#gt)"/>
   <path d="M${cx-a},${cy} L${cx},${cy+b} L${cx+a},${cy}" fill="none" style="stroke:var(--slab-edge)" stroke-width="1.4" stroke-linejoin="round"/>
   <path d="M${cx},${cy+b} L${cx},${cy+b+h}" style="stroke:var(--slab-edge)" stroke-width=".8" opacity=".6"/>

}

function validateCard(p){
  const num=$('#'+p+'-num').value,exp=$('#'+p+'-exp').value,cvc=$('#'+p+'-cvc').value,name=$('#'+p+'-name').value.trim();

  const r={num:luhn(num),exp:expOk,cvc:/^\d{3,4}$/.test(cvc),name:name.length>1};
  Object.keys(r).forEach(k=>$('#'+p+'-f-'+k).classList.toggle('bad',!r[k]));
  const bad=Object.keys(r).find(k=>!r[k]);if(bad)$('#'+p+'-'+bad).focus();
  return bad?null:{brand:cardBrand(num)||'visa',last4:num.replace(/\D/g,'').slice(-4),exp};

function runCmd(s,cmd){
  const L=S.term[s.id];L.push('$ '+cmd);const c=cmd.trim();
  const up=Math.floor((Date.now()-s.created)/DAY);const p=planOf(s.type,s.plan);
  const out={
    help:t('con_help'),
    ls:'backups  docker-compose.yml  logs  www',
    'ls -la':'total 28\ndrwx------ 6 root root 4096 .\ndrwxr-xr-x 19 root root 4096 ..\n-rw-r--r-- 1 root root 3106 .bashrc\ndrwx------ 2 root root 4096 .ssh\ndrwxr-xr-x 2 root root 4096 backups\n-rw-r--r-- 1 root root  612 docker-compose.yml\ndrwxr-xr-x 3 root root 4096 logs\ndrwxr-xr-x 5 root root 4096 www',
    uptime:` ${new Date().toTimeString().slice(0,8)} up ${up} days,  3:12,  1 user,  load average: 0.${Math.floor(rnd(10,60))}, 0.${Math.floor(rnd(10,50))}, 0.${Math.floor(rnd(10,40))}`,
    'df -h':`Filesystem      Size  Used Avail Use% Mounted on\n/dev/vda1       ${s.type==='ded'?'1.8T':p.disk+'G'}   ${s.type==='ded'?'412G':Math.round(p.disk*.31)+'G'}  ${s.type==='ded'?'1.4T':Math.round(p.disk*.69)+'G'}  ${s.type==='ded'?'23%':'31%'} /\ntmpfs           ${Math.round(p.ram/2)}G     0  ${Math.round(p.ram/2)}G   0% /dev/shm`,
    'free -h':`               total        used        free\nMem:           ${p.ram}Gi       ${(p.ram*.52).toFixed(1)}Gi       ${(p.ram*.48).toFixed(1)}Gi\nSwap:          2.0Gi          0B       2.0Gi`,
    whoami:'root',hostname:s.name,
    'uname -a':`Linux ${s.name} 6.8.0-45-generic #45-Ubuntu SMP x86_64 GNU/Linux`,
    'ip a':`1: lo: <LOOPBACK,UP> mtu 65536\n    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,MULTICAST,UP> mtu 1500\n    inet ${s.ip4}/24 scope global eth0\n    inet6 ${s.ip6}/64 scope global`,
    date:new Date().toUTCString(),
  };
  if(c==='clear'){S.term[s.id]=[];return}
  if(c==='')return;
  L.push(out[c]!=null?out[c]:t('con_nf',{c:c.split(' ')[0]}));
}
function pwr(s,action){
  const map={start:['starting','running','t_started'],stop:['stopping','stopped','t_stopped'],reboot:['rebooting','running','t_rebooted']}[action];
  s.status=map[0];render();
  setTimeout(()=>{s.status=map[1];if(S.route==='server'||S.route==='panel')render();toast(t(map[2],{n:s.name}))},action==='reboot'?3200:2000);
}

/* ---------- router ---------- */
const ROUTES=['home','pricing','login','signup','panel','order','checkout','provisioning','server','billing','support','account'];
const PANEL=['panel','order','checkout','provisioning','server','billing','support','account'];
const isPanel=()=>PANEL.includes(S.route);
let timers=[];
function clearTimers(){timers.forEach(x=>clearInterval(x));timers=[]}
function go(r){if(location.hash==='#'+r)onHash();else location.hash=r}
function onHash(){
  let r=(location.hash||'').slice(1);if(!ROUTES.includes(r))r='home';
  if(PANEL.includes(r)&&!S.authed){S.authed=true;S.user={name:S.lang==='ru'?'Анна Соколова':'Anna Berg',email:'anna@example.com'}}
  if(r==='checkout'&&!S.checkout){if(S.order){newCheckout('order',calc(S.order).total)}else{r='order'}}
  if(r==='provisioning'&&!S.prov)r='panel';
  if(r==='server'&&!curSrv())r='panel';
  const changed=r!==S.route;S.route=r;S.menu=false;closeSheet();
  render();
  if(r==='pricing'){const el=$('#pricing');if(el)setTimeout(()=>el.scrollIntoView({behavior:RM()?'auto':'smooth'}),30)}
  else if(changed)window.scrollTo(0,0);
}
function render(){
  clearTimers();
  const r=S.route;let h;
  if(r==='home'||r==='pricing')h=viewHome();
  else if(r==='login'||r==='signup')h=viewAuth(r);
  else if(r==='order')h=viewOrder();
  else if(r==='checkout')h=viewCheckout();
  else if(r==='provisioning')h=viewProvisioning();
  else if(r==='server')h=viewServer();
  else if(r==='billing')h=viewBilling();
  else if(r==='support')h=viewSupport();
  else if(r==='account')h=viewAccount();
  else h=viewDashboard();
  const ae=document.activeElement,aeId=ae&&ae.id;
  $('#app').innerHTML=h;
  if(aeId&&$('#'+aeId)&&/term-input|o-host|o-pass/.test(aeId)){const el=$('#'+aeId);el.focus();if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}
  animateSegs();after();
}
function after(){
  const r=S.route;
  if(r==='checkout'&&S.checkout&&S.checkout.method==='crypto'){
    const co=S.checkout;drawQR($('#qr'),COINS.find(c=>c.id===co.coin).addr);
    const upd=()=>{const el=$('#co-timer');if(!el)return;const left=Math.max(0,co.deadline-Date.now());el.textContent=String(Math.floor(left/60e3)).padStart(2,'0')+':'+String(Math.floor(left/1e3)%60).padStart(2,'0')};
    upd();timers.push(setInterval(upd,1000));
  }
  if(r==='provisioning'&&S.prov&&!S.prov.done)timers.push(setInterval(provTick,RM()?600:1450));
  if(r==='server'){
    const s=curSrv();const o=$('#term-out');if(o)o.scrollTop=o.scrollHeight;
    if(S.tab==='overview'&&s.status==='running')timers.push(setInterval(()=>{
      const push=(a,base,amp)=>{let v=a[a.length-1]+rnd(-amp,amp);v=Math.max(2,Math.min(97,v*.85+base*.15));a.push(+v.toFixed(1));a.shift()};
      push(s.cpu,s.type==='ded'?18:32,9);push(s.ram,s.type==='ded'?41:56,3);push(s.rx,30,10);push(s.tx,18,8);
      const m=$('#metrics');if(m)m.outerHTML=metricCards(s);
    },2500));
  }
  if(r==='order'){const st=$('.stp[aria-current]');if(st)st.parentNode.scrollLeft=st.offsetLeft-20}
  if(r==='home'||r==='pricing')counters();
}
function counters(){
  if(RM()||!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target;const end=parseFloat(el.dataset.count),dec=+(el.dataset.dec||0),suf=el.textContent.includes('%')?'%':'';const t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/1300),v=end*(1-Math.pow(1-k,3));el.textContent=v.toFixed(dec)+suf;if(k<1)requestAnimationFrame(step);else el.textContent=end.toFixed(dec)+suf};requestAnimationFrame(step)}),{threshold:.6});
  $$('[data-count]').forEach(el=>io.observe(el));
}

  /* account */
  case 'key-add':sheet(`<div class="sic">${ic('key','ic-lg')}</div><h2 id="sh-title">${t('ac_key_add')}</h2><p class="sp-t">${t('ac_key_p')}</p><div class="field"><label for="key-name">${t('ac_key_name')}</label><input class="input" id="key-name" placeholder="Work laptop"></div><div class="field"><label for="key-val">${t('ac_key_val')}</label><textarea class="textarea mono" id="key-val" placeholder="ssh-ed25519 AAAA… user@host"></textarea></div><div class="acts"><button class="btn btn-quiet" data-act="close">${t('cancel')}</button><button class="btn btn-primary" data-act="key-save">${t('save')}</button></div>`);break;
  case 'key-save':{const nm=$('#key-name').value.trim(),kv=$('#key-val').value.trim();if(!nm||!/^(ssh-|ecdsa-)/.test(kv)){toast(t('err_key'));return}S.keys.push({id:'k'+Date.now(),name:nm,fp:'SHA256:'+Math.random().toString(36).slice(2,6)+'…'+Math.random().toString(36).slice(2,6),date:Date.now()});closeSheet();render();toast(t('t_key'));break}
  case 'key-del':S.keys=S.keys.filter(k=>k.id!==el.dataset.id);render();toast(t('t_deleted'));break;
  case 'tok-add':sheet(`<div class="sic">${ic('code','ic-lg')}</div><h2 id="sh-title">${t('ac_tok_add')}</h2><p class="sp-t">${t('ac_tok_p')}</p><div class="field"><label for="tok-name">${t('ac_tok_name')}</label><input class="input" id="tok-name" placeholder="ci-deploy"></div><div class="acts"><button class="btn btn-quiet" data-act="close">${t('cancel')}</button><button class="btn btn-primary" data-act="tok-save">${t('ac_tok_create')}</button></div>`);break;
  case 'tok-save':{const nm=$('#tok-name').value.trim()||'token';const val='nvt_'+Array.from({length:32},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');S.tokens.push({id:'tk'+Date.now(),name:nm,date:Date.now(),last:null});render();
    sheet(`<div class="sic">${ic('check','ic-lg')}</div><h2 id="sh-title">${t('ac_tok_done')}</h2><p class="sp-t">${t('ac_tok_once')}</p><label class="lbl" for="tok-val">${t('ac_tok_val')}</label><div class="copyrow" style="margin-top:6px"><input class="v mono" id="tok-val" readonly value="${val}"><button class="btn btn-quiet btn-sm" data-act="copy" data-src="tok-val">${ic('copy','ic-sm')}${t('copy')}</button></div><div class="acts"><button class="btn btn-primary" data-act="close">${t('done')}</button></div>`);break}
  case 'tok-del':S.tokens=S.tokens.filter(k=>k.id!==el.dataset.id);render();toast(t('t_revoked'));break;
  case '2fa':if(el.checked){el.checked=false;sheet(`<div class="sic">${ic('lock','ic-lg')}</div><h2 id="sh-title">${t('fa_h')}</h2><p class="sp-t">${t('fa_p')}</p><div class="qr" style="width:max-content;margin:0 auto 18px"><canvas id="qr2" width="172" height="172" role="img" aria-label="${esc(t('co_qr'))}"></canvas></div><div class="field"><label for="fa-code">${t('fa_code')}</label><input class="input mono" id="fa-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.3em;text-align:center;font-size:20px"></div><div class="acts"><button class="btn btn-quiet" data-act="close">${t('cancel')}</button><button class="btn btn-primary" data-act="fa-ok">${t('fa_ok')}</button></div>`);drawQR($('#qr2'),'otpauth-nutraver')}else{S.twofa=false;render();toast(t('t_2fa_off'))}break;
  case 'fa-ok':if(!/^\d{6}$/.test($('#fa-code').value)){toast(t('err_code'));return}S.twofa=true;closeSheet();render();toast(t('t_2fa_on'));break;
  }
});
function validHost(){
  const o=S.order;if(!o)return true;
  if(!/^[a-zA-Z0-9][a-zA-Z0-9.-]{1,62}$/.test(o.hostname)){S.step=4;render();toast(t('err_host'));return false}
  return true;
}
document.addEventListener('input',e=>{
  const el=e.target,o=S.order;
  if(el.id==='o-host'){o.hostname=el.value;o.hostEdited=true}
  else if(el.id==='o-pass'){o.pass=el.value}
  else if(el.id==='o-keypaste'){o.keyPaste=el.value}
  else if(el.dataset.act==='cardnum'){
    const d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(.{4})/g,'$1 ').trim();
    const b=cardBrand(d);const ad=$('#'+el.id.split('-')[0]+'-brand');if(ad)ad.innerHTML=b?pm(b,20):pm('visa',20)+pm('mc',20);
    el.closest('.field').classList.remove('bad');
  }else if(el.dataset.act==='cardexp'){
    let d=el.value.replace(/\D/g,'').slice(0,4);if(d.length>=3)d=d.slice(0,2)+'/'+d.slice(2);el.value=d;el.closest('.field').classList.remove('bad');
  }else if(el.closest&&el.closest('.field.bad'))el.closest('.field.bad').classList.remove('bad');
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='o-keysel'){S.order.key=el.value;render()}
  else if(el.dataset.act==='o-addon'){S.order[el.dataset.k]=el.checked;render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='auth-form')doLogin();
  else if(f.id==='term-form'){const s=curSrv(),inp=$('#term-input');runCmd(s,inp.value);inp.value='';render()}
  else if(f.id==='fw-form'){const s=curSrv();const port=$('#fw-port').value.trim(),proto=$('#fw-proto').value;if(proto!=='ICMP'&&!/^\d{1,5}([-,: ]+\d{1,5})*$/.test(port)){toast(t('err_port'));$('#fw-port').focus();return}s.fw.push({id:Date.now(),proto,port:proto==='ICMP'?'—':port,src:$('#fw-src').value.trim()||'0.0.0.0/0',act:$('#fw-act').value});render();toast(t('t_fw_add'))}
  else if(f.id==='prof-form'){S.user={name:$('#ac-name').value.trim()||S.user.name,email:$('#ac-email').value.trim()||S.user.email};render();toast(t('t_saved'))}
  else if(f.id==='tk-form'){const sj=$('#tk-subj'),mg=$('#tk-msg');let bad=false;[sj,mg].forEach(x=>{const b=!x.value.trim();x.closest('.field').classList.toggle('bad',b);if(b)bad=true});if(bad)return;
    const k={id:'T-'+(20500+Math.floor(rnd(0,400))),subj:sj.value.trim(),status:'open',date:Date.now(),msgs:[{me:1,txt:mg.value.trim(),ts:Date.now()}]};S.tickets.unshift(k);S.ticket=k.id;closeSheet();render();toast(t('t_ticket'));agentReply(k)}
  else if(f.id==='reply-form'){const v=$('#reply').value.trim();if(!v)return;const k=S.tickets.find(x=>x.id===S.ticket);k.msgs.push({me:1,txt:v,ts:Date.now()});k.status='open';render();agentReply(k)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root').innerHTML){closeSheet();return}
  if(e.key==='Tab'&&$('#modal-root').innerHTML){const f=$$('#modal-root button, #modal-root input, #modal-root select, #modal-root textarea').filter(x=>!x.disabled);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}
});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)render()})}catch(e){}
window.addEventListener('hashchange',onHash);
applyTheme();document.documentElement.lang=S.lang;document.title=t('doc_title');
onHash();
})();
</script>

</body>
