<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nutraver Aurora</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Cpath d="M3 31V13Q3 5 11 5h3l12 19V9l9-4v22q0 8-8 8h-3L12 16v11Z" fill="%230b5cff"/%3E%3Cpath d="M3 31 12 27l8-4 4 7q-10-3-21 5Z" fill="%2314b8a6"/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nutraver: fast VPS and dedicated servers in Equinix data centers in Frankfurt, Amsterdam and Stockholm. Ready in under a minute, pay by card or crypto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: dark-first ===== */
:root{
  --bg:#060a1d; --bg-2:#0a1030; --surface:#0e1538; --surface-2:#121a44;
  --fg:#eef1ff; --fg-2:#c6cbea; --muted:#8e96bf; --faint:#5f6894;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --glass-3:rgba(255,255,255,.12);
  --glass-solid:rgba(14,20,52,.72);
  --edge-1:rgba(255,255,255,.24); --edge-2:rgba(255,255,255,.03); --edge-3:rgba(255,255,255,.10);
  --hi:inset 0 1px 0 rgba(255,255,255,.09);
  --teal:#2ee6d6; --cyan:#3fc8ff; --violet:#6c4dff; --coral:#ff7a59;
  --accent:#5ef2e2; --accent-2:#7dd8ff;
  --brand-grad:linear-gradient(135deg,#3ff3df 0%,#22d3ee 52%,#3aa8ff 100%);
  --on-brand:#03141c;
  --glow:0 10px 34px -8px rgba(45,230,214,.6),0 0 0 1px rgba(150,255,245,.35) inset;
  --glow-strong:0 16px 48px -10px rgba(45,230,214,.75),0 0 0 1px rgba(170,255,248,.5) inset;
  --ok:#3ee0a1; --ok-bg:rgba(62,224,161,.12); --warn:#ffc35a; --warn-bg:rgba(255,195,90,.12);
  --err:#ff6b8b; --err-bg:rgba(255,107,139,.12); --info:#5cc8ff; --info-bg:rgba(92,200,255,.12);
  --a1:rgba(46,230,214,.55); --a2:rgba(108,77,255,.62); --a3:rgba(255,122,89,.42); --a4:rgba(63,200,255,.4);
  --shadow-1:0 1px 2px rgba(0,0,0,.25),0 10px 30px -10px rgba(0,0,0,.55);
  --shadow-2:0 40px 90px -24px rgba(0,0,0,.7);
  --input:rgba(255,255,255,.04); --input-hover:rgba(255,255,255,.07);
  --term-bg:#050817; --term-fg:#d5ddff; --overlay:rgba(3,6,20,.62);
  --card-grad:linear-gradient(135deg,#1de3d0 0%,#2a7bff 55%,#6c4dff 100%);
  --globe-dot:150,170,240; --globe-land:110,245,230; --globe-rim:110,140,255;
  --grain-op:.07;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f4fb; --bg-2:#e8ecf8; --surface:#ffffff; --surface-2:#f7f8fd;
    --fg:#0a1030; --fg-2:#2a3158; --muted:#59618a; --faint:#8b92b2;
    --line:rgba(16,24,72,.08); --line-2:rgba(16,24,72,.15);
    --glass:rgba(255,255,255,.6); --glass-2:rgba(255,255,255,.76); --glass-3:rgba(255,255,255,.92);
    --glass-solid:rgba(255,255,255,.82);
    --edge-1:rgba(255,255,255,1); --edge-2:rgba(16,24,72,.07); --edge-3:rgba(16,24,72,.1);
    --hi:inset 0 1px 0 rgba(255,255,255,.95);
    --teal:#13c4b3; --cyan:#0ea5e9; --violet:#7d5cff; --coral:#ff8b6b;
    --accent:#08867b; --accent-2:#0a73b8;
    --brand-grad:linear-gradient(135deg,#34ead6 0%,#1fcbe8 52%,#3aa8ff 100%);
    --on-brand:#03141c;
    --glow:0 10px 26px -10px rgba(10,170,190,.6),0 0 0 1px rgba(255,255,255,.5) inset;
    --glow-strong:0 16px 40px -12px rgba(10,170,190,.7),0 0 0 1px rgba(255,255,255,.6) inset;
    --ok:#0b9466; --ok-bg:rgba(11,148,102,.1); --warn:#b26f00; --warn-bg:rgba(230,150,20,.13);
    --err:#d92d55; --err-bg:rgba(217,45,85,.09); --info:#0a7cc9; --info-bg:rgba(10,124,201,.09);
    --a1:rgba(60,225,205,.46); --a2:rgba(150,120,255,.40); --a3:rgba(255,150,115,.40); --a4:rgba(80,180,255,.36);
    --shadow-1:0 1px 2px rgba(16,24,72,.05),0 12px 32px -14px rgba(16,24,72,.2);
    --shadow-2:0 40px 90px -30px rgba(16,24,72,.3);
    --input:rgba(255,255,255,.75); --input-hover:#fff;
    --term-bg:#0b1030; --term-fg:#d5ddff; --overlay:rgba(20,26,60,.35);
    --card-grad:linear-gradient(135deg,#22dccb 0%,#3a86ff 55%,#7d5cff 100%);
    --globe-dot:70,85,150; --globe-land:8,160,150; --globe-rim:120,140,230;
    --grain-op:.035;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f4fb; --bg-2:#e8ecf8; --surface:#ffffff; --surface-2:#f7f8fd;
  --fg:#0a1030; --fg-2:#2a3158; --muted:#59618a; --faint:#8b92b2;
  --line:rgba(16,24,72,.08); --line-2:rgba(16,24,72,.15);
  --glass:rgba(255,255,255,.6); --glass-2:rgba(255,255,255,.76); --glass-3:rgba(255,255,255,.92);
  --glass-solid:rgba(255,255,255,.82);
  --edge-1:rgba(255,255,255,1); --edge-2:rgba(16,24,72,.07); --edge-3:rgba(16,24,72,.1);
  --hi:inset 0 1px 0 rgba(255,255,255,.95);
  --teal:#13c4b3; --cyan:#0ea5e9; --violet:#7d5cff; --coral:#ff8b6b;
  --accent:#08867b; --accent-2:#0a73b8;
  --brand-grad:linear-gradient(135deg,#34ead6 0%,#1fcbe8 52%,#3aa8ff 100%);
  --on-brand:#03141c;
  --glow:0 10px 26px -10px rgba(10,170,190,.6),0 0 0 1px rgba(255,255,255,.5) inset;
  --glow-strong:0 16px 40px -12px rgba(10,170,190,.7),0 0 0 1px rgba(255,255,255,.6) inset;
  --ok:#0b9466; --ok-bg:rgba(11,148,102,.1); --warn:#b26f00; --warn-bg:rgba(230,150,20,.13);
  --err:#d92d55; --err-bg:rgba(217,45,85,.09); --info:#0a7cc9; --info-bg:rgba(10,124,201,.09);
  --a1:rgba(60,225,205,.46); --a2:rgba(150,120,255,.40); --a3:rgba(255,150,115,.40); --a4:rgba(80,180,255,.36);
  --shadow-1:0 1px 2px rgba(16,24,72,.05),0 12px 32px -14px rgba(16,24,72,.2);
  --shadow-2:0 40px 90px -30px rgba(16,24,72,.3);
  --input:rgba(255,255,255,.75); --input-hover:#fff;
  --term-bg:#0b1030; --term-fg:#d5ddff; --overlay:rgba(20,26,60,.35);
  --card-grad:linear-gradient(135deg,#22dccb 0%,#3a86ff 55%,#7d5cff 100%);
  --globe-dot:70,85,150; --globe-land:8,160,150; --globe-rim:120,140,230;
  --grain-op:.035;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
:root{
  --f-display:"Wix Madefor Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-body:"Wix Madefor Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gxr:max(16px, env(safe-area-inset-right, 0px));
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;
  transition:background-color .4s var(--ease),color .4s var(--ease)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;letter-spacing:-.025em;font-weight:700}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}
::selection{background:rgba(46,230,214,.3)}

/* grain overlay */
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:var(--grain-op);background-image:var(--grain-img);background-size:160px;mix-blend-mode:overlay}
#app{position:relative;z-index:2}

/* ===== Layout ===== */
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gxr)}
@media (min-width:760px){.wrap{padding-left:max(32px, env(safe-area-inset-left, 0px));padding-right:max(32px, env(safe-area-inset-right, 0px))}}
.section{position:relative;padding:112px 0}
@media (max-width:760px){.section{padding:72px 0}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  padding:6px 12px 6px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.h-sec{font-size:clamp(32px,4.6vw,56px);font-weight:700;margin-top:18px;max-width:18ch}
.lead{font-size:clamp(16px,1.5vw,19px);color:var(--muted);margin-top:16px;max-width:60ch}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:48px}

/* ===== Buttons ===== */
.btn{--h:44px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 20px;
  border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:-.005em;
  transition:transform .25s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease),color .2s,border-color .3s,opacity .2s;user-select:none}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-lg{--h:54px;padding:0 26px;font-size:16px}
.btn-sm{--h:36px;padding:0 14px;font-size:14px}
.btn-xs{--h:30px;padding:0 11px;font-size:13px}
.btn-block{width:100%}
.btn-primary{background:var(--brand-grad);color:var(--on-brand);box-shadow:var(--glow)}
.btn-primary::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);opacity:.6;pointer-events:none}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--glow-strong)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-glass{background:var(--glass-2);border:1px solid var(--line-2);box-shadow:var(--hi);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.btn-glass:hover{background:var(--glass-3);transform:translateY(-1px);border-color:var(--edge-3)}
.btn-ghost{color:var(--fg-2)}
.btn-ghost:hover{background:var(--glass-2);color:var(--fg)}
.btn-danger{background:var(--err);color:#fff;box-shadow:0 10px 30px -10px var(--err)}
.btn-danger:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none;box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--fg-2);transition:background .2s,color .2s,transform .2s}
.icon-btn:hover{background:var(--glass-2);color:var(--fg)}
.icon-btn:active{transform:scale(.94)}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ===== Glass ===== */
.glass{position:relative;border-radius:var(--r-l);
  background:linear-gradient(var(--glass),var(--glass)) padding-box,
    linear-gradient(150deg,var(--edge-1),var(--edge-2) 38%,var(--edge-2) 62%,var(--edge-3)) border-box;
  border:1px solid transparent;box-shadow:var(--hi),var(--shadow-1);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.glass.flat{backdrop-filter:none;-webkit-backdrop-filter:none}
.glass-solid{background:linear-gradient(var(--glass-solid),var(--glass-solid)) padding-box,linear-gradient(150deg,var(--edge-1),var(--edge-2) 40%,var(--edge-3)) border-box}
.spot{overflow:hidden;isolation:isolate}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s var(--ease);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(46,230,214,.14),rgba(108,77,255,.08) 40%,transparent 70%)}
.spot:hover::before{opacity:1}
.lift{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.lift:hover{transform:translateY(-4px);box-shadow:var(--hi),var(--shadow-2)}
@media (hover:none),(pointer:coarse){.spot::before{display:none}.lift:hover{transform:none}}

/* ===== Aurora ===== */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;opacity:.9}
.aurora .b1{width:56vw;height:56vw;max-width:780px;max-height:780px;left:-12%;top:-22%;background:radial-gradient(circle,var(--a1),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.aurora .b2{width:60vw;height:60vw;max-width:860px;max-height:860px;right:-18%;top:-10%;background:radial-gradient(circle,var(--a2),transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.aurora .b3{width:38vw;height:38vw;max-width:520px;max-height:520px;left:38%;top:42%;background:radial-gradient(circle,var(--a3),transparent 65%);animation:drift3 18s ease-in-out infinite alternate}
.aurora .b4{width:34vw;height:34vw;max-width:480px;max-height:480px;left:6%;top:58%;background:radial-gradient(circle,var(--a4),transparent 65%);animation:drift2 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vw,6vh,0) scale(1.12)}100%{transform:translate3d(-3vw,10vh,0) scale(.95)}}
@keyframes drift2{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-9vw,8vh,0) scale(.9)}100%{transform:translate3d(-4vw,-4vh,0) scale(1.1)}}
@keyframes drift3{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-6vw,-8vh,0) scale(1.2)}100%{transform:translate3d(7vw,-2vh,0) scale(.9)}}
.aurora.soft i{opacity:.45}
.fade-bottom{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none;z-index:1}

/* ===== Header ===== */
.hdr{position:sticky;top:0;z-index:50;padding-top:12px}
.hdr-in{display:flex;align-items:center;gap:12px;height:60px;padding:0 10px 0 18px;border-radius:999px;transition:background .3s,box-shadow .3s}
.hdr.scrolled .hdr-in{background:linear-gradient(var(--glass-solid),var(--glass-solid)) padding-box,linear-gradient(150deg,var(--edge-1),var(--edge-2) 40%,var(--edge-3)) border-box;border:1px solid transparent;box-shadow:var(--hi),var(--shadow-1);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.hdr .hdr-in{border:1px solid transparent}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo-mark{width:30px;height:30px;flex:none;display:block}
.logo-word{height:15px;width:auto;flex:none;display:block;color:var(--fg)}
.nav{display:flex;gap:2px;margin-left:20px}
.nav a,.nav button{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--fg-2);transition:background .2s,color .2s}
.nav a:hover,.nav button:hover{background:var(--glass-2);color:var(--fg)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);position:relative}
.lang button{position:relative;z-index:1;width:38px;height:30px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:color .25s}
.lang button[aria-pressed="true"]{color:var(--fg)}
.lang .thumb{position:absolute;top:3px;left:3px;width:38px;height:30px;border-radius:999px;background:var(--glass-3);box-shadow:var(--hi),0 2px 8px rgba(0,0,0,.15);transition:transform .35s var(--ease-spring)}
.lang[data-l="ru"] .thumb{transform:translateX(38px)}
.burger{display:none}
@media (max-width:1020px){.nav,.hdr-r .hide-m{display:none}.burger{display:inline-grid}}
@media (max-width:420px){.hdr-r .hide-xs{display:none}}
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .25s var(--ease)}
.drawer .sheet{position:absolute;top:12px;left:var(--gx);right:var(--gxr);padding:16px;border-radius:var(--r-l);animation:dropIn .35s var(--ease)}
.drawer .sheet a,.drawer .sheet button.dl{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:14px;font-weight:600;font-size:17px}
.drawer .sheet a:hover,.drawer .sheet button.dl:hover{background:var(--glass-2)}
@keyframes dropIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== Hero ===== */
.hero{position:relative;padding:40px 0 40px;overflow:hidden;margin-top:-84px;padding-top:124px}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;min-height:620px}
@media (max-width:1020px){.hero-grid{grid-template-columns:1fr;min-height:0}}
.hero h1{font-size:clamp(40px,5.7vw,78px);font-weight:800;letter-spacing:-.04em;line-height:1.0;margin-top:22px}
.grad-text{background:linear-gradient(100deg,#4ff7e4 0%,#38c9ff 45%,#9b85ff 75%,#ff8f6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 8s ease-in-out infinite alternate}
:root[data-theme="light"] .grad-text{background-image:linear-gradient(100deg,#0bb8a6 0%,#0a8fd8 45%,#6d4dff 75%,#f0663f 100%)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .grad-text{background-image:linear-gradient(100deg,#0bb8a6 0%,#0a8fd8 45%,#6d4dff 75%,#f0663f 100%)}}
@keyframes shine{from{background-position:0% 50%}to{background-position:100% 50%}}
.hero .lead{font-size:clamp(17px,1.6vw,20px);margin-top:22px;max-width:34em}
.hero-cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.hero-trust{display:flex;align-items:center;gap:14px;margin-top:34px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pay-row{display:flex;gap:6px;flex-wrap:wrap}
.enter{animation:enter .9s var(--ease) both}
.enter.d1{animation-delay:.08s}.enter.d2{animation-delay:.16s}.enter.d3{animation-delay:.24s}.enter.d4{animation-delay:.32s}.enter.d5{animation-delay:.45s}
@keyframes enter{from{transform:translateY(22px)}to{transform:none}}
.globe-wrap{position:relative;aspect-ratio:1/1;width:100%;max-width:600px;margin:0 auto}
.globe-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.globe-halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(46,230,214,.18),rgba(108,77,255,.12) 45%,transparent 70%);filter:blur(30px)}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:18px;font-size:14px;font-weight:600;white-space:nowrap;animation:float 7s ease-in-out infinite}
.chip .ci{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--glass-3);color:var(--accent)}
.chip small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.chip.c1{left:-2%;top:16%}
.chip.c2{right:-2%;top:40%;animation-delay:-2.5s}
.chip.c3{left:6%;bottom:8%;animation-delay:-4.5s;padding:10px 12px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (max-width:1020px){.globe-wrap{max-width:460px;margin-top:8px}.chip.c1{left:0}.chip.c2{right:0}}
@media (max-width:480px){.chip{font-size:12.5px;padding:8px 10px 8px 8px;border-radius:14px}.chip .ci{width:28px;height:28px;border-radius:9px}.chip.c3{left:0;bottom:2%}}
.ping-dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.ping-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}

/* ===== Payment icons ===== */
.pi{display:inline-grid;place-items:center;flex:none;width:40px;height:26px;padding:5px 6px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px rgba(16,24,72,.10),0 2px 6px -2px rgba(0,0,0,.28);vertical-align:middle}
.pi svg{display:block;width:100%;height:100%}
.pi.lg{width:54px;height:35px;padding:7px 8px;border-radius:8px}
.marquee{position:relative;overflow:hidden;padding:18px 0;border-radius:var(--r-l);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee-track{display:flex;gap:14px;width:max-content;animation:marq 38s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.mq-item{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--fg-2);white-space:nowrap}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pay-strip{margin-top:20px;padding:6px 8px}
.pay-strip-row{display:flex;align-items:center;gap:20px}
.pay-strip-label{flex:none;padding-left:16px;font-size:13px;color:var(--muted);font-weight:600;max-width:150px;line-height:1.3}
@media (max-width:640px){.pay-strip-row{flex-direction:column;align-items:stretch;gap:0}.pay-strip-label{padding:12px 12px 0;max-width:none}}

/* ===== Trust stats ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:22px}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.03em;display:flex;align-items:baseline;gap:2px}
.stat .l{color:var(--muted);font-size:14px;margin-top:4px}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);color:var(--accent);margin-bottom:16px;box-shadow:var(--hi)}

/* ===== Bento ===== */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tile{padding:28px;min-height:230px;display:flex;flex-direction:column}
.tile h3{font-size:22px;font-weight:700;margin-top:auto}
.tile p{color:var(--muted);margin-top:8px;font-size:15px}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(150deg,rgba(46,230,214,.18),rgba(108,77,255,.14));box-shadow:var(--hi);margin-bottom:24px}
.t-a{grid-column:span 3;grid-row:span 2;min-height:480px}
.t-b{grid-column:span 3}
.t-c{grid-column:span 3}
.t-d{grid-column:span 2}.t-e{grid-column:span 2}.t-f{grid-column:span 2}
@media (max-width:960px){.t-a,.t-b,.t-c{grid-column:span 6}.t-a{min-height:380px}.t-d,.t-e,.t-f{grid-column:span 3}}
@media (max-width:600px){.bento{grid-template-columns:1fr}.t-a,.t-b,.t-c,.t-d,.t-e,.t-f{grid-column:auto}.tile{min-height:0}}
.nvme-viz{position:relative;margin:4px 0 28px;height:200px;border-radius:18px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.nvme-bars{position:absolute;inset:20px 20px 40px;display:flex;align-items:flex-end;gap:6px}
.nvme-bars span{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(to top,rgba(46,230,214,.15),rgba(46,230,214,.85));transform-origin:bottom;animation:eq 2.4s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
.nvme-cap{position:absolute;left:20px;right:20px;bottom:12px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.api-snip{margin-top:4px;margin-bottom:22px;padding:14px 16px;border-radius:14px;background:var(--term-bg);color:var(--term-fg);font-family:var(--f-mono);font-size:12.5px;line-height:1.7;overflow:hidden;white-space:nowrap;border:1px solid rgba(255,255,255,.06)}
.api-snip .k{color:#7dd8ff}.api-snip .s{color:#5ef2e2}.api-snip .m{color:#b9a8ff}

/* ===== Segmented ===== */
.seg{--n:2;--i:0;position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:999px;background:var(--glass-3);
  box-shadow:var(--hi),0 4px 14px -4px rgba(0,0,0,.25),0 0 0 1px var(--line-2);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--ease-spring)}
.seg button{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:color .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .save{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(46,230,214,.16);color:var(--accent)}
.seg.lg button{padding:12px 22px;font-size:15px}

/* ===== Pricing ===== */
.price-ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:stretch}
.plans.ded{grid-template-columns:repeat(4,1fr)}
@media (max-width:1180px){.plans{grid-template-columns:repeat(3,1fr)}.plans.ded{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.plans,.plans.ded{grid-template-columns:1fr}}
.plan{padding:24px 22px;display:flex;flex-direction:column;gap:18px;animation:planIn .5s var(--ease) both}
.plans .plan:nth-child(2){animation-delay:.04s}.plans .plan:nth-child(3){animation-delay:.08s}.plans .plan:nth-child(4){animation-delay:.12s}.plans .plan:nth-child(5){animation-delay:.16s}
@keyframes planIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.plan .pn{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .pp{display:flex;align-items:baseline;gap:6px}
.plan .pp b{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1}
.plan .pp span{color:var(--muted);font-size:14px}
.plan .was{color:var(--faint);text-decoration:line-through;font-size:13px;height:16px;margin-top:-12px}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;font-size:14.5px;color:var(--fg-2)}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li .ic{color:var(--accent);margin-top:2px}
.plan .btn{margin-top:auto}
.plan.hot{background:linear-gradient(180deg,rgba(46,230,214,.13),rgba(108,77,255,.06) 60%,rgba(255,143,110,.04)) padding-box,linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(150deg,#46f5e2,rgba(63,200,255,.5) 40%,rgba(108,77,255,.6) 80%,#ff8f6e) border-box;
  box-shadow:var(--hi),0 30px 80px -30px rgba(46,230,214,.55),0 0 0 1px rgba(46,230,214,.25)}
.plan.hot::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(46,230,214,.22),transparent 60%)}
.badge-pop{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--brand-grad);color:var(--on-brand);box-shadow:0 6px 18px -6px rgba(46,230,214,.7)}
.price-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* ===== Equinix ===== */
.eqx{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:clamp(28px,5vw,64px)}
.eqx-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:start}
@media (max-width:960px){.eqx-grid{grid-template-columns:1fr}}
.eqx-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
@media (max-width:600px){.eqx-nums{grid-template-columns:1fr 1fr}.eqx-nums>div:last-child{grid-column:span 2}}
.bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,3.3vw,46px);letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,var(--fg),color-mix(in srgb,var(--fg) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.bignum-l{color:var(--muted);font-size:14px;margin-top:8px}
.eqx-list{display:grid;gap:10px}
.eqx-item{display:flex;gap:16px;align-items:flex-start;padding:18px;border-radius:18px}
.eqx-item .ei{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;color:var(--accent);background:var(--glass-2);box-shadow:var(--hi)}
.eqx-item h4{font-size:16px;font-weight:700;letter-spacing:-.01em;font-family:var(--f-body)}
.eqx-item p{color:var(--muted);font-size:14px;margin-top:3px}

/* ===== Locations ===== */
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.locs{grid-template-columns:1fr}}
.loc{padding:26px}
.loc-top{display:flex;align-items:center;gap:14px}
.flag{display:inline-block;border-radius:50%;flex:none;position:relative;box-shadow:0 0 0 2px var(--glass-3),0 4px 14px -4px rgba(0,0,0,.4)}
.flag svg{display:block;width:100%;height:100%;clip-path:circle(50%)}
.loc h3{font-size:24px}
.loc .cty{color:var(--muted);font-size:14px}
.ping-badge{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.loc dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:24px 0 0;font-size:14px}
.loc dt{color:var(--muted)}.loc dd{margin:0;font-weight:600;text-align:right}
.loc-map{position:relative;height:120px;margin-top:22px;border-radius:16px;overflow:hidden;background:var(--glass);border:1px solid var(--line)}

/* ===== Steps ===== */
.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.steps-line{position:absolute;left:16%;right:16%;top:40px;height:2px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);overflow:hidden;border-radius:2px}
.steps-line::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--teal),#3fc8ff,transparent);box-shadow:0 0 16px var(--teal);animation:beam 3.2s ease-in-out infinite}
@keyframes beam{from{left:-30%}to{left:100%}}
.step{text-align:left;padding:0 6px}
.step-n{position:relative;z-index:1;width:80px;height:80px;border-radius:26px;display:grid;place-items:center;color:var(--accent);margin-bottom:24px}
.step-n .ic{width:30px;height:30px}
.step-n b{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--brand-grad);color:var(--on-brand);box-shadow:var(--glow)}
.step h3{font-size:22px}
.step p{color:var(--muted);margin-top:8px}
@media (max-width:860px){.steps{grid-template-columns:1fr;gap:28px}.steps-line{left:39px;right:auto;top:40px;bottom:40px;width:2px;height:auto;background:linear-gradient(180deg,transparent,var(--line-2),transparent)}
  .steps-line::after{width:auto;height:30%;left:0;right:0;animation:beamv 3.2s ease-in-out infinite;background:linear-gradient(180deg,transparent,var(--teal),transparent)}
  .step{display:grid;grid-template-columns:80px 1fr;gap:20px;align-items:center}.step-n{margin:0}}
@keyframes beamv{from{top:-30%}to{top:100%}}

/* ===== Panel preview ===== */
.preview{position:relative;padding:14px;border-radius:var(--r-xl);transform:perspective(1800px) rotateX(8deg);transform-origin:50% 0;transition:transform .8s var(--ease)}
.preview:hover{transform:perspective(1800px) rotateX(2deg)}
.preview-in{border-radius:22px;overflow:hidden;background:var(--bg);border:1px solid var(--line);pointer-events:none;user-select:none}
.preview-bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.preview-bar i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.preview .shell{min-height:0}

/* ===== FAQ ===== */
.faq{display:grid;gap:10px;max-width:880px;margin:0 auto}
.qa{border-radius:20px;padding:0;overflow:hidden}
.qa button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;text-align:left;font-weight:600;font-size:17px}
.qa .chev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);flex:none;transition:transform .45s var(--ease),background .3s}
.qa.open .chev{transform:rotate(45deg);background:var(--brand-grad);color:var(--on-brand)}
.qa-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.qa.open .qa-body{grid-template-rows:1fr}
.qa-body>div{overflow:hidden}
.qa-body p{padding:0 24px 22px;color:var(--muted);max-width:70ch}

/* ===== CTA + footer ===== */
.cta{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:clamp(36px,6vw,80px);text-align:left}
.cta h2{font-size:clamp(32px,4.6vw,58px);font-weight:800;max-width:16ch;position:relative;z-index:2}
.cta .lead{position:relative;z-index:2}
.cta .hero-cta{position:relative;z-index:2}
.foot{padding:72px 0 40px;border-top:1px solid var(--line);margin-top:40px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
.foot h4{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14.5px}
.foot ul button,.foot ul a{color:var(--fg-2)}
.foot ul button:hover,.foot ul a:hover{color:var(--fg)}
.foot-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;align-items:center}

/* ===== Auth ===== */
.auth{position:relative;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-side{display:none!important}}
.auth-main{position:relative;z-index:2;display:flex;flex-direction:column;padding:24px var(--gxr) 40px var(--gx)}
.auth-card{width:100%;max-width:440px;margin:auto;padding:36px}
@media (max-width:480px){.auth-card{padding:24px 20px}}
.auth-card h1{font-size:32px;font-weight:700}
.auth-card .lead{font-size:15px;margin-top:8px}
.auth-side{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:48px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:20px 0}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.auth-quote{max-width:440px;margin:0 auto}
.auth-quote h2{font-size:40px;font-weight:800;letter-spacing:-.04em}
.auth-feats{display:grid;gap:12px;margin-top:28px}
.auth-feat{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;font-weight:600;font-size:15px}
.auth-feat .ei{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--glass-2);color:var(--accent)}

/* ===== Forms ===== */
.field{display:grid;gap:7px}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--fg-2)}
.input{width:100%;height:48px;padding:0 16px;border-radius:14px;background:var(--input);border:1px solid var(--line-2);transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:var(--hi)}
textarea.input{height:auto;padding:12px 16px;resize:vertical;min-height:110px;line-height:1.5}
select.input{appearance:none;-webkit-appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
select.input option{background:var(--surface);color:var(--fg)}
.input:hover{background:var(--input-hover)}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(46,230,214,.16)}
.input.bad{border-color:var(--err);box-shadow:0 0 0 4px var(--err-bg)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:52px}
.input-wrap .in-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.input-wrap .in-btn:hover{background:var(--glass-2);color:var(--fg)}
.input-wrap .in-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex}
.hint{font-size:12.5px;color:var(--muted)}
.err-msg{font-size:12.5px;color:var(--err);min-height:0}
.form-grid{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row2.st{grid-template-columns:1fr}}
.switch{position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:28px;border-radius:999px;background:var(--glass-3);border:1px solid var(--line-2);position:relative;transition:background .3s,box-shadow .3s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--ease-spring)}
.switch input:checked+.tr{background:var(--brand-grad);box-shadow:0 0 18px -4px rgba(46,230,214,.7);border-color:transparent}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:3px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:#22d3ee;margin-top:2px;flex:none}

/* ===== Panel shell ===== */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh;position:relative}
.side{position:sticky;top:0;height:100vh;padding:16px;display:flex;flex-direction:column;z-index:20}
.side-in{height:100%;border-radius:26px;padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.side .logo{padding:4px 8px 18px}
.snav{display:grid;gap:4px}

function copyText(text,btn){
  const fallback=()=>{const src=btn&&btn.getAttribute('data-sel')?$(btn.getAttribute('data-sel')):null;
    if(src&&src.select){src.focus();src.select();}
    else if(src){const r=document.createRange();r.selectNodeContents(src);const s=getSelection();s.removeAllRanges();s.addRange(r)}
    toast(t('t.copyManual'),'info')};
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText){fallback();return}
    navigator.clipboard.writeText(text).then(()=>{toast(t('t.copied'));if(btn){const o=btn.innerHTML;btn.innerHTML=ic('check');setTimeout(()=>{if(btn.isConnected)btn.innerHTML=o},1400)}}).catch(fallback);
  }catch(e){fallback()}
}

/* ================= Router ================= */
const ROUTES=['home','pricing','login','signup','panel','servers','order','checkout','provisioning','server','billing','support','account'];
const PANEL=['panel','servers','order','checkout','provisioning','server','billing','support','account'];
let ROUTE='home', VIEW='', cleanups=[], globe=null;
function addCleanup(f){cleanups.push(f)}
function runCleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];globe=null}
function routeFromHash(){const h=decodeURIComponent((location.hash||'').slice(1));return ROUTES.includes(h)?h:(h?null:'home')}
function onHash(){
  let r=routeFromHash();
  if(r===null){history.replaceState(null,'','#home');r='home'}
  const landing=r==='home'||r==='pricing';
  if(landing&&VIEW==='landing'){ROUTE=r;afterLandingNav();return}
  ROUTE=r;paint(false);
}
function go(r){if(location.hash==='#'+r)onHash();else location.hash=r}
function afterLandingNav(){
  if(ROUTE==='pricing'){const el=$('#sec-pricing');if(el)el.scrollIntoView({behavior:RM.matches?'auto':'smooth'})}
  else if(pendingScroll){const el=$('#'+pendingScroll);pendingScroll=null;if(el)el.scrollIntoView({behavior:RM.matches?'auto':'smooth'})}
  else scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});
}
let pendingScroll=null;
function paint(keep){
  runCleanup();closeModalSilently();S.menu=false;
  let r=ROUTE, html='';
  if(PANEL.includes(r)&&!S.authed){S.authed=true}
  if(r==='checkout'&&!S.checkout){r=ROUTE='order';history.replaceState(null,'','#order')}
  if(r==='provisioning'&&!S.prov){r=ROUTE='panel';history.replaceState(null,'','#panel')}
  if(r==='server'&&!curSrv()){r=ROUTE='panel';history.replaceState(null,'','#panel')}
  document.title=t('title.'+r)+' · Nutraver';
  if(r==='home'||r==='pricing'){VIEW='landing';html=vLanding()}
  else if(r==='login'||r==='signup'){VIEW='auth';html=vAuth(r)}
  else {VIEW='panel';html=vPanel(r)}
  $('#app').innerHTML=html;
  if(VIEW==='landing') initLanding(keep);
  if(VIEW==='panel') initPanel(r);
  if(VIEW==='auth') initAuth();
  if(!keep){
    if(VIEW==='landing'&&(r==='pricing'||pendingScroll)) setTimeout(afterLandingNav,60);
    else scrollTo(0,0);
  }
  initCounters();
}

/* ================= Globe ================= */
const LAND=[[12,50,16,9],[25,55,18,10],[-4,40,6,4.5],[13,42,3,5],[15,63,7,7],[27,64,5,6],[-2,54,3.5,5],[34,39,8,3],[60,60,35,12],[110,62,40,11],[70,45,18,8],[105,33,18,12],[78,21,9,10],[102,15,7,8],[115,-2,14,4],[46,24,10,9],[12,22,24,12],[22,2,16,14],[25,-20,11,12],[47,-19,2.5,6],[134,-25,17,10],[172,-42,3,5],[138,37,4,6],[-100,48,26,14],[-152,63,12,6],[-95,64,28,8],[-102,23,9,7],[-86,13,5,5],[-42,73,12,8],[-62,-5,16,12],[-65,-30,8,15],[-70,-45,4,8],[-75,5,6,6]];
function isLand(lat,lon){for(const e of LAND){let dl=lon-e[0];if(dl>180)dl-=360;if(dl<-180)dl+=360;const a=dl/e[2],b=(lat-e[1])/e[3];if(a*a+b*b<=1)return true}return false}
const D2R=Math.PI/180;
function v3(lat,lon){const p=lat*D2R,l=lon*D2R;return [Math.cos(p)*Math.sin(l),Math.sin(p),Math.cos(p)*Math.cos(l)]}
function Globe(canvas){
  const ctx=canvas.getContext('2d');
  const N=2600, pts=[], gold=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=gold*i;const x=Math.cos(th)*r,z=Math.sin(th)*r;
    const lat=Math.asin(y)/D2R,lon=Math.atan2(x,z)/D2R;pts.push([x,y,z,isLand(lat,lon)?1:0])}
  const world={ny:[40.7,-74],sp:[-23.5,-46.6],dxb:[25.2,55.3],sg:[1.35,103.8],jnb:[-26.2,28],ist:[41,29],lon:[51.5,-0.1],mad:[40.4,-3.7],nbo:[-1.3,36.8],mow:[55.7,37.6]};
  const C={};LOCS.forEach(l=>C[l.id]=[l.lat,l.lon]);
  const pairs=[['fra','ams',.25],['ams','sto',.25],['sto','fra',.25],['fra','ny',.5],['ams','sp',.55],['fra','dxb',.4],['sto','sg',.55],['fra','jnb',.5],['ams','lon',.15],['fra','mad',.2],['sto','mow',.2],['fra','ist',.25],['ams','nbo',.45]];
  const arcs=pairs.map((p,i)=>{const a=C[p[0]]||world[p[0]],b=C[p[1]]||world[p[1]];const A=v3(a[0],a[1]),B=v3(b[0],b[1]);
    const dot=Math.max(-1,Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])),om=Math.acos(dot),so=Math.sin(om)||1;const S=[];const M=60;
    for(let k=0;k<=M;k++){const tt=k/M,f1=Math.sin((1-tt)*om)/so,f2=Math.sin(tt*om)/so,h=1+p[2]*Math.sin(Math.PI*tt)*.42;
      S.push([(A[0]*f1+B[0]*f2)*h,(A[1]*f1+B[1]*f2)*h,(A[2]*f1+B[2]*f2)*h])}
    return {S,off:i*.37,sp:.00016+((i*13)%7)*.00002,local:!!(C[p[0]]&&C[p[1]])}});
  const cities=LOCS.map(l=>({id:l.id,v:v3(l.lat,l.lon)}));
  const dests=Object.values(world).map(w=>v3(w[0],w[1]));
  let W=0,H=0,dpr=1,raf=0,visible=true,col={},t0=performance.now(),last=0;
  function colors(){const cs=getComputedStyle(document.documentElement);col={dot:cs.getPropertyValue('--globe-dot').trim(),land:cs.getPropertyValue('--globe-land').trim(),rim:cs.getPropertyValue('--globe-rim').trim(),dark:isDark(),font:cs.getPropertyValue('--f-body')};if(RM.matches)draw(last)}
  function size(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.max(1,W*dpr);canvas.height=Math.max(1,H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw(RM.matches?last:performance.now())}
  function rot(v,sl,cl,sp,cp){const x=v[0]*cl-v[2]*sl,z1=v[0]*sl+v[2]*cl,y=v[1]*cp-z1*sp,z=v[1]*sp+z1*cp;return [x,y,z]}
  function draw(ms){
    last=ms;const tm=ms-t0;ctx.clearRect(0,0,W,H);
    const R=Math.min(W,H)*.4,cx=W/2,cy=H/2;
    const lam=(RM.matches?6:(6+Math.sin(tm*.00011)*48))*D2R, phi=(RM.matches?34:(34+Math.sin(tm*.00007)*5))*D2R;
    const sl=Math.sin(lam),cl=Math.cos(lam),sp=Math.sin(phi),cp=Math.cos(phi);
    // atmosphere
    let g=ctx.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.28);g.addColorStop(0,`rgba(${col.rim},${col.dark?.32:.28})`);g.addColorStop(1,`rgba(${col.rim},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.28,0,Math.PI*2);ctx.fill();
    g=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);
    if(col.dark){g.addColorStop(0,'rgba(40,60,140,.55)');g.addColorStop(1,'rgba(8,12,40,.85)')}else{g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(214,224,248,.9)')}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(${col.rim},${col.dark?.35:.4})`;ctx.lineWidth=1;ctx.stroke();
    // dots
    for(let i=0;i<N;i++){const p=pts[i];const v=rot(p,sl,cl,sp,cp);if(v[2]<=0)continue;
      const x=cx+v[0]*R,y=cy-v[1]*R;
      if(p[3]){ctx.globalAlpha=.25+.7*v[2];ctx.fillStyle=`rgb(${col.land})`;const s=1.25+.9*v[2];ctx.fillRect(x-s/2,y-s/2,s,s)}
      else{ctx.globalAlpha=.06+.2*v[2];ctx.fillStyle=`rgb(${col.dot})`;const s=.9+.5*v[2];ctx.fillRect(x-s/2,y-s/2,s,s)}}
    ctx.globalAlpha=1;
    // arcs
    const occl=v=>v[2]<0&&(v[0]*v[0]+v[1]*v[1])<1;
    for(const a of arcs){
      const P=a.S.map(s=>rot(s,sl,cl,sp,cp));
      ctx.lineWidth=1;ctx.strokeStyle=a.local?`rgba(94,242,226,${col.dark?.35:.5})`:`rgba(${col.rim},${col.dark?.22:.3})`;ctx.beginPath();let on=false;
      for(const v of P){if(occl(v)){on=false;continue}const x=cx+v[0]*R,y=cy-v[1]*R;if(!on){ctx.moveTo(x,y);on=true}else ctx.lineTo(x,y)}ctx.stroke();
      const head=RM.matches?.7:((tm*a.sp+a.off)%1.35);const tail=.28,n=P.length-1;
      for(let k=0;k<16;k++){const u0=head-tail*(1-k/16),u1=head-tail*(1-(k+1)/16);if(u1<0||u0>1)continue;
        const i0=Math.max(0,Math.floor(u0*n)),i1=Math.min(n,Math.ceil(u1*n));ctx.beginPath();let st=false;
        for(let j=i0;j<=i1;j++){const v=P[j];if(occl(v)){st=false;continue}const x=cx+v[0]*R,y=cy-v[1]*R;if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y)}
        const al=(k+1)/16;ctx.strokeStyle=a.local?`rgba(94,242,226,${al})`:`rgba(255,${col.dark?160:120},${col.dark?120:90},${al*.95})`;ctx.lineWidth=1+al*1.6;ctx.stroke()}
    }
    // destinations
    for(const d of dests){const v=rot(d,sl,cl,sp,cp);if(v[2]<=0)continue;const x=cx+v[0]*R,y=cy-v[1]*R;ctx.fillStyle=`rgba(${col.rim},${.4+.5*v[2]})`;ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill()}
    // cities
    const pulse=RM.matches?.5:(Math.sin(tm*.003)+1)/2;
    ctx.font=`600 12px ${col.font||'sans-serif'}`;
    for(const c of cities){const v=rot(c.v,sl,cl,sp,cp);if(v[2]<=0)continue;const x=cx+v[0]*R,y=cy-v[1]*R;
      const rr=10+pulse*10;const gg=ctx.createRadialGradient(x,y,0,x,y,rr);gg.addColorStop(0,'rgba(94,242,226,.85)');gg.addColorStop(1,'rgba(94,242,226,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(94,242,226,${.7*(1-pulse)})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,6+pulse*14,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.fill();
      if(v[2]>.25){const lab=t('loc.'+c.id+'.city');const off=c.id==='ams'?-1:1;const tw=ctx.measureText(lab).width;const lx=off>0?x+10:x-10-tw-12,ly=y-(c.id==='sto'?14:-4);
        ctx.fillStyle=col.dark?'rgba(10,16,48,.72)':'rgba(255,255,255,.85)';roundRect(ctx,lx,ly-13,tw+12,19,7);ctx.fill();
        ctx.fillStyle=col.dark?'#eef1ff':'#0a1030';ctx.fillText(lab,lx+6,ly+1)}
    }
  }
  function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function loop(ms){raf=0;draw(ms);schedule()}
  function schedule(){if(!raf&&visible&&!document.hidden&&!RM.matches)raf=requestAnimationFrame(loop)}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  const io=new IntersectionObserver(es=>{visible=es[0].isIntersecting;visible?schedule():stop()},{threshold:0});io.observe(canvas);

  addCleanup(()=>{stop();io.disconnect();ro.disconnect();document.removeEventListener('visibilitychange',vis)});

}

/* ================= Charts ================= */
function smoothPath(data,w,h,max){
  const n=data.length,step=w/(n-1);const P=data.map((v,i)=>[i*step,h-(Math.min(v,max)/max)*h*.92-2]);
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d;
}
let gid=0;
function areaChart(id,sets,max,cls){
  const w=300,h=100;
  const defs=sets.map((s,i)=>`<linearGradient id="g-${id}-${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".38"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`).join('');
  const body=sets.map((s,i)=>{const d=smoothPath(s.d,w,h,max);return `<path class="ar" data-i="${i}" d="${d} L${w},${h} L0,${h} Z" fill="url(#g-${id}-${i})"/><path class="ln" data-i="${i}" d="${d}" stroke="${s.c}"/>`}).join('');
  return `<svg class="chart ${cls||''}" id="${id}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs>${defs}</defs><path class="gl" d="M0,25H300M0,50H300M0,75H300"/>${body}</svg>`;
}
function updChart(id,sets,max){const el=document.getElementById(id);if(!el)return;sets.forEach((s,i)=>{const d=smoothPath(s.d,300,100,max);const a=el.querySelector(`.ar[data-i="${i}"]`),l=el.querySelector(`.ln[data-i="${i}"]`);if(a)a.setAttribute('d',`${d} L300,100 L0,100 Z`);if(l)l.setAttribute('d',d)})}
const CC={cpu:'#2ee6d6',ram:'#8b6bff',in:'#3fc8ff',out:'#ff8f6e'};
function startLive(r){
  const tick=()=>{if(document.hidden)return;
    S.servers.forEach(s=>{const on=s.status==='running';const push=(arr,base,amp)=>{let v=arr[arr.length-1]+rnd(-amp,amp);v=v+(base-v)*.15;arr.push(on?Math.max(2,Math.min(97,v)):0);arr.shift()};
      push(s.cpuH,s.id==='s2'?41:26,9);push(s.ramH,s.id==='s2'?68:52,2);push(s.netInH,30,10);push(s.netOutH,18,8)});
    if(ROUTE==='panel') S.servers.forEach(s=>updChart('sp-'+s.id,[{d:s.cpuH.slice(-20),c:CC.cpu}],100));
    if(ROUTE==='server'){const s=curSrv();updChart('ch-cpu',[{d:s.cpuH,c:CC.cpu}],100);updChart('ch-ram',[{d:s.ramH,c:CC.ram}],100);updChart('ch-net',[{d:s.netInH,c:CC.in},{d:s.netOutH,c:CC.out}],100);
      const L=a=>a[a.length-1];const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
      set('mv-cpu',num(L(s.cpuH)));set('mv-ram',num(L(s.ramH)*planRam(s)/100,1));set('mv-net',num(L(s.netInH)*4.2));}
  };
  const iv=setInterval(tick,RM.matches?6000:2000);addCleanup(()=>clearInterval(iv));
}

function ccPreview(){const cd=S.pay.card;const br=brandOf(cd.num);const digits=cd.num.replace(/\D/g,'');const shown=(digits+'•'.repeat(Math.max(0,16-digits.length))).replace(/(.{4})/g,'$1 ').trim();
  return `<div class="cc" id="ccp"><span class="brand">${br&&PAYSVG[br]?pay(br):''}</span><span class="chipx"></span><div class="num">${esc(shown)}</div><div class="row"><div><span style="opacity:.75">${t('co.cname')}</span><b>${esc(cd.name||'ALEX MORGAN')}</b></div><div style="text-align:right"><span style="opacity:.75">${t('co.cexpS')}</span><b>${esc(cd.exp||'MM/YY')}</b></div></div></div>`}
function luhn(n){let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function validateCard(){
  const cd=S.pay.card;let ok=true;const set=(id,m)=>{const e=$('#'+id+'-err'),i=$('#'+id);if(e)e.textContent=m||'';if(i)i.classList.toggle('bad',!!m);if(m&&ok){ok=false;i&&i.focus()}};
  const n=cd.num.replace(/\D/g,'');const br=brandOf(n);
  set('cc-num',n.length<13||!luhn(n)?t('co.e.num'):'');
  const m=/^(\d{2})\/(\d{2})$/.exec(cd.exp);let ee='';if(!m||+m[1]<1||+m[1]>12)ee=t('co.e.exp');else{const now=new Date();const y=2000+ +m[2],mo=+m[1];if(y<now.getFullYear()||(y===now.getFullYear()&&mo<now.getMonth()+1))ee=t('co.e.expPast')}
  set('cc-exp',ee);
  set('cc-cvc',(br==='amex'?/^\d{4}$/:/^\d{3}$/).test(cd.cvc)?'':t('co.e.cvc'));
  set('cc-name',cd.name.trim().length<2?t('co.e.name'):'');

}

function finishPayment(method){
  const c=S.checkout;if(!c)return;
  const mIcon=method;
  if(c.kind==='order'){
    if(method==='balance')S.balance=round2(S.balance-c.amount);
    const o=S.order,id='s'+Date.now().toString(36);
    const ipA=[185,231,64,Math.floor(rnd(30,250))];
    const srv=mkServer({id,name:o.host,type:o.type,plan:o.plan,loc:o.loc,os:imgName(o),ip:ipA.join('.'),rdns:o.host+'.nutraver.cloud',pass:o.auth==='pass'?o.pass:genPass(),created:todayISO(),renew:addMonths(todayISO(),o.period),price:calc(o).monthly,backups:o.backups,cpuBase:12,ramBase:20});
    if(o.ipv4)srv.extraIps.push('185.231.65.'+Math.floor(rnd(10,250)));
    srv.status='starting';S.servers.push(srv);
    S.invoices.unshift({id:nextInv(),date:todayISO(),d:{s:`${o.host} · ${planTitle(o.type,o.plan)}`},amount:c.amount,status:'paid',m:mIcon==='card'?'visa':mIcon==='crypto'?coinIcon():'balance'});
    S.prov={t0:Date.now(),srv,done:false,showPass:false};S.checkout=null;S.pay.stage=0;
    go('provisioning');
  } else if(c.kind==='topup'){
    S.balance=round2(S.balance+c.amount);
    S.invoices.unshift({id:nextInv(),date:todayISO(),d:{k:'inv.d.topup'},amount:c.amount,status:'paid',m:mIcon==='card'?'visa':coinIcon()});
    S.checkout=null;S.pay.stage=0;toast(t('t.topped',{p:money(c.amount)}),'wallet');go('billing');
  } else {
    const inv=S.invoices.find(i=>i.id===c.invId);if(inv){inv.status='paid';inv.m=method==='card'?'visa':method==='crypto'?coinIcon():'balance'}
    if(method==='balance')S.balance=round2(S.balance-c.amount);
    S.checkout=null;S.pay.stage=0;toast(t('t.invpaid'),'check');go('billing');
  }
}
function coinIcon(){return COINS.find(x=>x.id===S.pay.coin).icon}
function nextInv(){return 'INV-2026-'+(1188+S.invoices.length)}
function addMonths(iso,m){const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function initCheckout(){
  const P=S.pay;if(!P.end||P.end<Date.now())P.end=Date.now()+30*60000;
  drawQR();
  const iv=setInterval(()=>{const el=$('#cd');if(!el)return;const s=Math.max(0,Math.round((P.end-Date.now())/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
  addCleanup(()=>clearInterval(iv));
}
function drawQR(){
  const c=$('#qr');if(!c)return;const x=c.getContext('2d');const N=29,M=8;const r=seeded(ADDR[S.pay.coin]+S.checkout.amount);
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0a1030';
  const finder=(fx,fy)=>{x.fillRect(fx*M,fy*M,7*M,7*M);x.fillStyle='#fff';x.fillRect((fx+1)*M,(fy+1)*M,5*M,5*M);x.fillStyle='#0a1030';x.fillRect((fx+2)*M,(fy+2)*M,3*M,3*M)};
  const inF=(i,j)=>(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);
  const inC=(i,j)=>Math.hypot(i-14,j-14)<4.6;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(inF(i,j)||inC(i,j))continue;if(r()<.5){x.beginPath();x.roundRect?x.roundRect(i*M+.5,j*M+.5,M-1,M-1,2):x.rect(i*M+.5,j*M+.5,M-1,M-1);x.fill()}}
  finder(0,0);finder(N-7,0);finder(0,N-7);
}

function initProv(){
  const P=S.prov;if(!P||P.done)return;const C=2*Math.PI*96;let lastSt=-1;
  const iv=setInterval(()=>{
    const el=Date.now()-P.t0;const pct=Math.min(100,Math.round(el/PTOTAL*100));let st=0;PT.forEach((v,i)=>{if(el>=v)st=i});
    const bar=$('#ring-bar');if(bar)bar.setAttribute('stroke-dashoffset',(C*(1-pct/100)).toFixed(1));
    const n=$('#ring-n');if(n)n.textContent=pct+'%';const pc=$('#ring-pct');if(pc)pc.setAttribute('aria-valuenow',pct);
    if(st!==lastSt){lastSt=st;const s=$('#ring-s');if(s)s.textContent=t(PSTEPS[st]);const ps=$('#psteps');if(ps)ps.innerHTML=PSTEPS.map((s2,i)=>`<div class="pstep glass flat ${i<st?'ok':i===st?'on':''}"><span class="d">${i<st?ic('check','sm'):i===st?'<span class="spin"></span>':''}</span>${t(s2)}</div>`).join('')}
    if(el>=PTOTAL){clearInterval(iv);P.done=true;P.srv.status='running';if(!S.servers.find(x=>x.id===P.srv.id))S.servers.push(P.srv);S.cur=P.srv.id;S.order=newOrder();

  },120);

  addCleanup(()=>{if(!P.done){const rest=Math.max(0,PTOTAL-(Date.now()-P.t0));setTimeout(()=>{if(!P.done){P.done=true;P.srv.status='running';if(!S.servers.find(x=>x.id===P.srv.id))S.servers.push(P.srv);S.order=newOrder();toast(t('t.ready'),'rocket');if(ROUTE==='panel'||ROUTE==='servers')paint(true)}},rest)}});

function refreshTab(){const s=curSrv();const p=$('#tabp');if(p){p.innerHTML=srvTab(s);p.setAttribute('aria-labelledby','tab-'+S.srvTab)}$$('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.getAttribute('data-arg')===S.srvTab));if(S.srvTab==='console'){const b=$('#term-body');if(b)b.scrollTop=b.scrollHeight}}
function termIntro(s){return `<span class="d">${t('s.con.welcome',{os:esc(s.os)})}\n${t('s.con.last')}</span>\n`}
function termRun(cmd){
  const s=curSrv();S.term=S.term||{};const b=$('#term-body');const p=planOf(s.type,s.plan);
  const prompt=`<span class="p">root@${esc(s.name)}:~#</span> ${esc(cmd)}\n`;let out='';
  const c=cmd.trim();
  if(s.status!=='running'&&c) out=`<span class="e">${t('s.con.down')}</span>\n`;
  else if(c==='help') out=t('s.con.help')+'\n';
  else if(c==='ls') out='backup.sh  docker-compose.yml  logs  www\n';
  else if(c==='ls -la'||c==='ll') out='drwx------  6 root root 4096 Nov 19 09:12 .\ndrwxr-xr-x 19 root root 4096 Mar 14 10:02 ..\n-rw-r--r--  1 root root  571 Mar 14 10:02 .bashrc\ndrwx------  2 root root 4096 Mar 14 10:05 .ssh\n-rwxr-xr-x  1 root root  842 Oct 30 18:40 backup.sh\n-rw-r--r--  1 root root 1290 Nov 02 14:18 docker-compose.yml\ndrwxr-xr-x  2 root root 4096 Nov 19 00:00 logs\ndrwxr-xr-x  5 www-data www-data 4096 Nov 11 12:31 www\n';
  else if(c==='uptime'){const d=new Date();out=` ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} up 21 days,  4:12,  1 user,  load average: ${(s.cpuH[s.cpuH.length-1]/100*2).toFixed(2)}, 0.41, 0.37\n`}
  else if(c==='df -h'){const dsk=s.type==='vps'?p.disk:(p.dU==='tb'?Math.round(p.disk*1000):p.disk);out=`Filesystem      Size  Used Avail Use% Mounted on\n/dev/${s.type==='vps'?'vda1':'nvme0n1p2'}      ${dsk}G   ${Math.round(dsk*.23)}G  ${Math.round(dsk*.72)}G  24% /\ntmpfs           ${Math.round(p.ram/2)}G     0  ${Math.round(p.ram/2)}G   0% /dev/shm\n/dev/${s.type==='vps'?'vda15':'nvme0n1p1'}     105M  6.1M   99M   6% /boot/efi\n`}
  else if(c==='free -h'){const used=(s.ramH[s.ramH.length-1]/100*p.ram).toFixed(1);out=`               total        used        free      shared  buff/cache   available\nMem:            ${p.ram}Gi       ${used}Gi       ${(p.ram-used-0.6).toFixed(1)}Gi       12Mi       0.6Gi       ${(p.ram-used).toFixed(1)}Gi\nSwap:             0B          0B          0B\n`}
  else if(c==='whoami') out='root\n';
  else if(c==='hostname') out=esc(s.name)+'\n';
  else if(c==='uname -a') out=`Linux ${esc(s.name)} 6.8.0-49-generic #49-Ubuntu SMP PREEMPT_DYNAMIC x86_64 GNU/Linux\n`;
  else if(c==='ip a'||c==='ip addr') out=`2: eth0: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500\n    inet ${s.ip}/24 brd ${s.ip.split('.').slice(0,3).join('.')}.255 scope global eth0\n`;
  else if(c==='date') out=new Date().toUTCString()+'\n';
  else if(c==='clear'){S.term[s.id]='';if(b)b.innerHTML='';return}
  else if(c==='') out='';
  else out=`<span class="e">${t('s.con.nf',{c:esc(c.split(' ')[0])})}</span>\n`;
  S.term[s.id]=(S.term[s.id]!=null?S.term[s.id]:termIntro(s))+prompt+out;
  if(b){b.innerHTML=S.term[s.id];b.scrollTop=b.scrollHeight}
}

/* ================= Event wiring ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&!el.disabled&&el.getAttribute('aria-disabled')!=='true'){const f=ACT[el.getAttribute('data-act')];if(f){if(el.tagName==='A'&&!['start','deploy','neworder','menuclose'].includes(el.getAttribute('data-act')))e.preventDefault();f(el,e);return}}
  const a=e.target.closest('a[href^="#"]');
  if(a){const h=a.getAttribute('href');ACT.menuclose();if(h===location.hash||(h==='#home'&&!location.hash)){e.preventDefault();onHash()}}
});
document.addEventListener('submit',e=>{
  const f=e.target;const kind=f.getAttribute('data-form');if(!kind)return;e.preventDefault();
  if(kind==='auth'){const em=$('#au-email'),pw=$('#au-pass');let ok=true;
    $('#au-email-err').textContent='';$('#au-pass-err').textContent='';em.classList.remove('bad');pw.classList.remove('bad');
    if(!em.value.trim()){$('#au-email-err').textContent=t('au.e.email');em.classList.add('bad');em.focus();ok=false}
    if(!pw.value){$('#au-pass-err').textContent=t('au.e.pass');pw.classList.add('bad');if(ok)pw.focus();ok=false}
    if(!ok)return;const n=$('#au-name');if(n&&n.value.trim())S.user.name=n.value.trim();if(em.value.includes('@'))S.user.email=em.value.trim();doLogin();return}
  if(kind==='card'){if(!validateCard())return;const n=S.pay.card.num.replace(/\D/g,'');const br=brandOf(n)||'visa';const save=$('#cc-save');
    if(save&&save.checked&&!S.cards.find(c=>c.last4===n.slice(-4))){const id='c'+Date.now();S.cards.push({id,brand:PAYSVG[br]?br:'visa',last4:n.slice(-4),exp:S.pay.card.exp})}

  if(kind==='otp'){const b=$('#otp-go');b.disabled=true;b.innerHTML='<span class="spin"></span>';setTimeout(()=>{closeModal();finishPayment('card')},1100);return}
  if(kind==='term'){const i=$('#term-input');termRun(i.value);i.value='';return}
  if(kind==='rdns'){const i=$('#rdns');const v=i.value.trim();if(!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(v)){$('#rdns-err').textContent=t('s.n.rdnsErr');i.classList.add('bad');i.focus();return}curSrv().rdns=v;i.classList.remove('bad');$('#rdns-err').textContent='';toast(t('t.rdns'),'globe');return}

    if(proto!=='ICMP'&&!/^\d{1,5}(-\d{1,5})?$/.test(port)){$('#fw-err').textContent=t('s.f.err');$('#fw-port').classList.add('bad');$('#fw-port').focus();return}

  if(kind==='snap'){const s=curSrv();const name=($('#sn-name').value.trim()||'snapshot').slice(0,48);const sn={id:'sn'+Date.now(),name,date:todayISO(),size:(rnd(8,22)).toFixed(1),busy:true};s.snaps.unshift(sn);closeModal();
    if(ROUTE==='server'){if(S.srvTab!=='backups'){S.srvTab='backups'}refreshTab()}

    const br=brandOf(n);S.cards.push({id:'c'+Date.now(),brand:PAYSVG[br]&&br!=='amex'?br:'visa',last4:n.slice(-4),exp:$('#ac-exp').value||'12/29'});closeModal();paint(true);toast(t('t.cardadded'),'card');return}

    const r=seeded(k);const fp='SHA256:'+Array.from({length:11},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(r()*62)]).join('')+'…'+k.slice(-4);
    S.keys.push({id:'k'+Date.now(),name:n,fp,added:todayISO()});closeModal();paint(true);toast(t('t.keyadded'),'key');return}
  if(kind==='token'){const n=$('#tok-name').value.trim();if(!n){$('#tok-err').textContent=t('ac.e.tname');$('#tok-name').classList.add('bad');$('#tok-name').focus();return}
    const tok='nvr_live_'+genPass().replace(/-/g,'')+genPass().replace(/-/g,'').slice(0,8);S.tokens.push({id:'tk'+Date.now(),name:n,created:todayISO(),last:null});
    modal(`<div class="mi">${ic('check','lg')}</div><h3 id="m-title">${t('ac.tokT')}</h3><p class="lead">${t('ac.tokOnce')}</p><label class="sr" for="tok-val">${t('ac.tokens')}</label><div class="addr mt16"><input id="tok-val" readonly value="${tok}"><button class="btn btn-glass btn-sm" data-act="copy" data-copy="${tok}" data-sel="#tok-val">${ic('copy','sm')}${t('a.copy')}</button></div><div class="acts"><button class="btn btn-primary" data-act="mclose">${t('a.done')}</button></div>`);
    if(ROUTE==='account'){const m=$('#main');if(m){const y=scrollY;const keep=$('#modal-root').innerHTML;$('#app').innerHTML=vPanel('account');scrollTo(0,y);$('#modal-root').innerHTML=keep}}return}
});
function fakeReply(id){
  S.typing=id;setTimeout(()=>{if(ROUTE==='support'&&S.curTicket===id)refreshSupport()},50);
  setTimeout(()=>{S.typing=null;const tk=S.tickets.find(x=>x.id===id);if(!tk)return;tk.msgs.push({me:0,b:{k:'su.auto',v:{n:esc(S.user.name.split(' ')[0])}},at:new Date().toISOString()});if(ROUTE==='support'){refreshSupport()}else toast(t('t.reply',{n:id}),'msg')},2400);
}
document.addEventListener('input',e=>{
  const el=e.target;const k=el.getAttribute&&el.getAttribute('data-in');if(!k)return;
  el.classList.remove('bad');
  if(k==='host'){S.order.host=el.value.trim();S.order.hostAuto=false;const h=$('#o-host-h');if(h){if(S.order.host&&!HOSTRE.test(S.order.host)){h.className='err-msg';h.textContent=t('o.hostErr')}else{h.className='hint';h.textContent=t('o.hostH')}}refreshSummaryLite()}
  if(k==='pass'){S.order.pass=el.value}
  if(k==='srvq'){S.srvQ=el.value;const r=$('#sv-rows');if(r)r.innerHTML=srvRowsHtml()}
  if(k==='keytext'){S.order.keyText=el.value;const er=$('#o-key-err');if(er)er.textContent=''}
  if(k==='ccnum'){let d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(.{4})/g,'$1 ').trim();S.pay.card.num=el.value;const br=brandOf(d);const b=$('#cc-brand');if(b)b.innerHTML=br&&PAYSVG[br]?pay(br,'sm'):'';const p=$('.cc-prev');if(p)p.innerHTML=ccPreview();$('#cc-num-err').textContent=''}
  if(k==='acnum'){let d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(.{4})/g,'$1 ').trim();const er=$('#ac-num-err');if(er)er.textContent=''}
  if(k==='ccexp'||k==='acexp'){let d=el.value.replace(/\D/g,'').slice(0,4);if(d.length>=3)d=d.slice(0,2)+'/'+d.slice(2);el.value=d;if(k==='ccexp'){S.pay.card.exp=d;const p=$('.cc-prev');if(p)p.innerHTML=ccPreview();$('#cc-exp-err').textContent=''}}
  if(k==='cccvc'){el.value=el.value.replace(/\D/g,'').slice(0,4);S.pay.card.cvc=el.value;$('#cc-cvc-err').textContent=''}
  if(k==='ccname'){S.pay.card.name=el.value.toUpperCase();const p=$('.cc-prev');if(p)p.innerHTML=ccPreview();$('#cc-name-err').textContent=''}
  if(k==='otp'){el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value){const n=el.nextElementSibling&&el.nextElementSibling.nextElementSibling;if(n&&n.tagName==='INPUT')n.focus()}}
  if(k==='tpcustom'){$$('#modal-root [data-act="tpamt"]').forEach(b=>b.setAttribute('aria-checked','false'));$('#tp-err').textContent=''}
  if(k==='delconfirm'){const b=$('#m-ok');if(b)b.disabled=el.value.trim()!==el.getAttribute('data-arg')}
});
document.addEventListener('change',e=>{
  const el=e.target;const k=el.getAttribute&&el.getAttribute('data-in');if(!k)return;
  if(k==='addon'){S.order[el.getAttribute('data-arg')]=el.checked;refreshCfg(['period'])}
  if(k==='autorenew'){S.autoRenew=el.checked;toast(t(el.checked?'t.arOn':'t.arOff'),'refresh')}
  if(k==='srvbk'){const s=curSrv();s.backups=el.checked;const p=round2(planOf(s.type,s.plan).price*.2);s.price=round2(s.price+(el.checked?p:-p));refreshTab();toast(t(el.checked?'t.bkOn':'t.bkOff'),'history')}
  if(k==='2fa'){if(el.checked){el.checked=false;open2fa()}else{S.twofa=false;paint(true);toast(t('t.2faOff'),'phone')}}
});
function refreshSummaryLite(){const sm=$('#summary');if(sm){const keepFocus=document.activeElement;sm.innerHTML=summaryHtml();if(keepFocus&&keepFocus.isConnected)keepFocus.focus()}}
function open2fa(){
  modal(`<div class="mi">${ic('phone','lg')}</div><h3 id="m-title">${t('ac.2faT')}</h3><p class="lead">${t('ac.2faL')}</p>
   <div style="display:grid;place-items:center;margin-top:18px"><div class="qr-frame" style="width:200px;padding:14px"><canvas id="qr2" width="232" height="232" style="width:172px;height:172px" role="img" aria-label="${esc(t('a.qr'))}"></canvas></div></div>
   <form data-form="tfa" novalidate class="mt16"><div class="field"><label for="tfa-code">${t('ac.2faCode')}</label><input class="input" id="tfa-code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code"><span class="err-msg" id="tfa-err"></span></div>
   <div class="acts"><button type="button" class="btn btn-glass" data-act="mclose">${t('a.cancel')}</button><button class="btn btn-primary" type="submit">${t('ac.2faOk')}</button></div></form>`);
  const c=$('#qr2');if(c){const x=c.getContext('2d');const r=seeded('2fa'+S.user.email);const N=29,M=8;x.fillStyle='#fff';x.fillRect(0,0,232,232);x.fillStyle='#0a1030';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const f=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(!f&&r()<.5)x.fillRect(i*M,j*M,M,M)}
    [[0,0],[N-7,0],[0,N-7]].forEach(p=>{x.fillRect(p[0]*M,p[1]*M,7*M,7*M);x.fillStyle='#fff';x.fillRect((p[0]+1)*M,(p[1]+1)*M,5*M,5*M);x.fillStyle='#0a1030';x.fillRect((p[0]+2)*M,(p[1]+2)*M,3*M,3*M)})}
}
document.addEventListener('submit',e=>{
  if(e.target.getAttribute('data-form')!=='tfa')return;const i=$('#tfa-code');if(!/^\d{6}$/.test(i.value)){$('#tfa-err').textContent=t('ac.e.2fa');i.classList.add('bad');i.focus();return}
  S.twofa=true;closeModal();paint(true);toast(t('t.2faOn'),'shieldCheck');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal-root').innerHTML){closeModal();return}if(S.menu){ACT.menu();return}if(S.sumOpen){ACT.sumtoggle()}}
  if(e.key==='Tab'&&$('#modal-root').innerHTML){const f=$$('#modal-root button:not([disabled]),#modal-root input,#modal-root select,#modal-root textarea').filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if(e.key==='Backspace'&&e.target.getAttribute&&e.target.getAttribute('data-in')==='otp'&&!e.target.value){const p=e.target.previousElementSibling&&e.target.previousElementSibling.previousElementSibling;if(p&&p.tagName==='INPUT')p.focus()}
});
window.addEventListener('hashchange',onHash);
DARKQ.addEventListener&&DARKQ.addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme')){if(globe)globe.colors();$$('[data-act="theme"]').forEach(b=>{b.innerHTML=ic(isDark()?'sun':'moon')})}});

/* ================= Boot ================= */
document.documentElement.lang=LANG;
makeGrain();
onHash();
})();
</script>

</body>
