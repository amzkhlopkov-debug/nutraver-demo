<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nutraver Horizon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nutraver: cloud VPS and dedicated servers in Equinix data centers in Frankfurt, Amsterdam and Stockholm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sofia+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F6F8FA; --bg-3:#EEF2F6; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#F1F4F8;
  --fg:#0B1B33; --fg-2:#46566E; --fg-3:#76859B;
  --line:#E4E8EE; --line-2:#D2D9E2;
  --accent:#0C6570; --accent-h:#0A5660; --accent-p:#08464F; --accent-soft:#E6F2F3; --accent-ink:#0C6570; --on-accent:#FFFFFF;
  --ok:#0F7A55; --ok-bg:#E3F4EC; --warn:#9A5B00; --warn-bg:#FFF3DC; --bad:#C3303E; --bad-bg:#FDEBED; --info:#2559B8; --info-bg:#EAF1FD;
  --sh-1:0 1px 2px rgba(11,27,51,.06);
  --sh-2:0 1px 2px rgba(11,27,51,.05),0 6px 18px -6px rgba(11,27,51,.10);
  --sh-3:0 2px 6px rgba(11,27,51,.05),0 22px 48px -18px rgba(11,27,51,.22);
  --sh-4:0 4px 12px rgba(11,27,51,.06),0 48px 90px -30px rgba(11,27,51,.38);
  --ring:0 0 0 3px rgba(12,101,112,.30);
  --nav-bg:rgba(255,255,255,.86);
  --b-base:linear-gradient(105deg,#FFE3BC 0%,#FFC27A 22%,#FF9A5C 42%,#F7708A 64%,#E86C9A 74%,#3FB7A8 100%);
  --b1:#FFB547; --b2:#FF7A3D; --b3:#F2577E; --b4:#16A39A; --b5:#FFE0B0;
  --band-op:1; --wash:rgba(255,255,255,.34);
  --term:#0F1A2B; --term-fg:#D6E2F0; --term-dim:#7F90A8; --term-ok:#5FD3B8;
  --overlay:rgba(11,27,51,.42);
  --map-dot:#CCD4DF; --map-land:#E9EEF3;
  --iso-floor:#EDF1F5; --iso-floor-2:#E2E8EF; --iso-top:#FFFFFF; --iso-l:#DCE3EB; --iso-r:#C7D1DD; --iso-acc:#16A39A; --iso-warm:#FF9A5C;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:"Sofia Sans","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-s:8px; --r:12px; --r-l:16px; --r-xl:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1324; --bg-2:#0D182C; --bg-3:#12203A; --surface:#0F1B30; --surface-2:#132239; --surface-3:#182943;
  --fg:#E9EFF7; --fg-2:#A8B5C9; --fg-3:#74839B;
  --line:#1D2C45; --line-2:#293B58;
  --accent:#3CC2BC; --accent-h:#5ED1CB; --accent-p:#2CA9A4; --accent-soft:rgba(60,194,188,.13); --accent-ink:#62D3CD; --on-accent:#04242A;
  --ok:#42C994; --ok-bg:rgba(66,201,148,.13); --warn:#F2B24F; --warn-bg:rgba(242,178,79,.13); --bad:#FF7482; --bad-bg:rgba(255,116,130,.13); --info:#7EA8FF; --info-bg:rgba(126,168,255,.13);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 8px 22px -8px rgba(0,0,0,.5);
  --sh-3:0 2px 6px rgba(0,0,0,.3),0 24px 50px -18px rgba(0,0,0,.6);
  --sh-4:0 4px 12px rgba(0,0,0,.35),0 50px 90px -30px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(60,194,188,.38);
  --nav-bg:rgba(10,19,36,.84);
  --b-base:linear-gradient(105deg,#3A2A2A 0%,#B8652E 22%,#E0663E 42%,#C9456E 64%,#A8457E 76%,#178C86 100%);
  --band-op:.92; --wash:rgba(10,19,36,.30);
  --term:#070E1B;
  --overlay:rgba(2,6,14,.62);
  --map-dot:#2A3A55; --map-land:#13213A;
  --iso-floor:#15243D; --iso-floor-2:#1B2C48; --iso-top:#2A3D5C; --iso-l:#1E2F4B; --iso-r:#17263E; --iso-acc:#3CC2BC; --iso-warm:#FF9A5C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1324; --bg-2:#0D182C; --bg-3:#12203A; --surface:#0F1B30; --surface-2:#132239; --surface-3:#182943;
  --fg:#E9EFF7; --fg-2:#A8B5C9; --fg-3:#74839B;
  --line:#1D2C45; --line-2:#293B58;
  --accent:#3CC2BC; --accent-h:#5ED1CB; --accent-p:#2CA9A4; --accent-soft:rgba(60,194,188,.13); --accent-ink:#62D3CD; --on-accent:#04242A;
  --ok:#42C994; --ok-bg:rgba(66,201,148,.13); --warn:#F2B24F; --warn-bg:rgba(242,178,79,.13); --bad:#FF7482; --bad-bg:rgba(255,116,130,.13); --info:#7EA8FF; --info-bg:rgba(126,168,255,.13);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 1px 2px rgba(0,0,0,.3),0 8px 22px -8px rgba(0,0,0,.5);
  --sh-3:0 2px 6px rgba(0,0,0,.3),0 24px 50px -18px rgba(0,0,0,.6);
  --sh-4:0 4px 12px rgba(0,0,0,.35),0 50px 90px -30px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(60,194,188,.38);
  --nav-bg:rgba(10,19,36,.84);
  --b-base:linear-gradient(105deg,#3A2A2A 0%,#B8652E 22%,#E0663E 42%,#C9456E 64%,#A8457E 76%,#178C86 100%);
  --band-op:.92; --wash:rgba(10,19,36,.30);
  --term:#070E1B;
  --overlay:rgba(2,6,14,.62);
  --map-dot:#2A3A55; --map-land:#13213A;
  --iso-floor:#15243D; --iso-floor-2:#1B2C48; --iso-top:#2A3D5C; --iso-l:#1E2F4B; --iso-r:#17263E; --iso-acc:#3CC2BC; --iso-warm:#FF9A5C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--head);font-weight:800;letter-spacing:-.018em;line-height:1.12;margin:0;color:var(--fg)}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
.wrap{max-width:1216px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:15px;line-height:1;white-space:nowrap;text-decoration:none;transition:background .18s,border-color .18s,box-shadow .18s,transform .12s,color .18s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-p{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px rgba(11,27,51,.12),0 6px 16px -6px rgba(12,101,112,.55)}
.btn-p:hover{background:var(--accent-h);box-shadow:0 1px 2px rgba(11,27,51,.12),0 10px 22px -8px rgba(12,101,112,.6);transform:translateY(-1px)}
.btn-p:active{background:var(--accent-p)}
.btn-s{background:var(--surface);color:var(--fg);border-color:var(--line-2);box-shadow:var(--sh-1)}
.btn-s:hover{border-color:var(--fg-3);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--fg-2);padding:0 12px}
.btn-g:hover{background:var(--bg-3);color:var(--fg)}
.btn-d{background:var(--bad);color:#fff}
.btn-d:hover{filter:brightness(1.07)}
.btn-ds{background:var(--surface);color:var(--bad);border-color:var(--line-2)}
.btn-ds:hover{border-color:var(--bad)}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.btn-xs{height:30px;padding:0 10px;font-size:13px;border-radius:8px;gap:6px}
.btn-lg{height:52px;padding:0 26px;font-size:16px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);transition:.18s}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2);background:var(--surface-2)}
.link-btn{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.link-btn:hover{text-decoration:underline}

/* Segmented control */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;border:0;background:none;height:36px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;transition:color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .seg-pill{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:9px;background:var(--surface);box-shadow:var(--sh-2);transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.seg-sm button{height:30px;padding:0 12px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg-3);color:var(--fg-2);white-space:nowrap}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-bad{background:var(--bad-bg);color:var(--bad)}
.tag-acc{background:var(--accent-soft);color:var(--accent-ink)}
.tag-info{background:var(--info-bg);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tag-ok .dot{box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,122,85,.45)}70%{box-shadow:0 0 0 6px rgba(15,122,85,0)}100%{box-shadow:0 0 0 0 rgba(15,122,85,0)}}

/* Toggle switch */
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.7,.2,1)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{box-shadow:var(--ring)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--fg)}
.field .hint{font-size:13px;color:var(--fg-3)}
.field .err{font-size:13px;color:var(--bad);display:none}
.field.invalid .err{display:block}
.field.invalid .inp{border-color:var(--bad)}
.inp{height:44px;width:100%;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:15px;transition:border-color .18s,box-shadow .18s;min-width:0}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.5}
select.inp{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.inp:hover{border-color:var(--fg-3)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.inp-wrap{position:relative;display:flex;align-items:center}
.inp-wrap .inp{padding-right:52px}
.inp-wrap .inp-addon{position:absolute;right:8px;display:flex;gap:4px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg-2)}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}

/* Cards / surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-pad{padding:24px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card-b{padding:22px}
.hair{height:1px;background:var(--line);border:0;margin:0}

/* Tables */
.tbl-box{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:left;font-weight:600;color:var(--fg-3);font-size:12.5px;padding:10px 22px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
@media (min-width:1025px){.tbl-fit{min-width:0}.tbl-fit th,.tbl-fit td{padding-left:16px;padding-right:16px}}
.tbl tr.clickable{cursor:pointer}

/* ============ Marketing header ============ */
.mh{position:sticky;top:0;z-index:50;background:var(--nav-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);transition:background .25s,border-color .25s}
.mh.over{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.mh-in{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--fg);text-decoration:none;background:none;border:0;padding:0}
.logo-mark{width:30px;height:30px}
.mh-nav{display:flex;gap:4px}
.mh-nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500;font-size:15px;color:var(--fg)}
.mh-nav button:hover{background:rgba(11,27,51,.06)}
.mh-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.lang-seg button{border:0;background:none;height:34px;padding:0 10px;font-size:13px;font-weight:600;color:var(--fg-3)}
.lang-seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mh .icon-btn{width:36px;height:36px}
.burger{display:none}
.mob-menu{display:none}
.mob-menu.open{display:block;position:fixed;inset:68px 0 0 0;z-index:49;background:var(--bg);padding:20px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);overflow:auto}
.mob-menu button.mm-link{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;padding:16px 4px;border-bottom:1px solid var(--line);font-size:18px;font-weight:600;font-family:var(--head)}
.mob-menu .mm-cta{display:grid;gap:10px;margin-top:22px}
.mob-menu .mm-tools{display:flex;gap:10px;margin-top:22px;align-items:center}

/* ============ Hero ============ */
.hero{position:relative;margin-top:-68px;padding-top:68px;overflow:hidden}
.band{position:absolute;left:0;right:0;top:-260px;height:900px;transform:skewY(-9deg);transform-origin:0 100%;overflow:hidden;background:var(--b-base);opacity:var(--band-op)}
.band .blob{position:absolute;border-radius:50%;mix-blend-mode:normal;will-change:transform}
.band .bl1{width:62vw;height:62vw;left:-14vw;top:10%;background:radial-gradient(circle,var(--b5) 0%,rgba(255,224,176,0) 66%);animation:drift1 26s ease-in-out infinite alternate}
.band .bl2{width:50vw;height:50vw;left:22vw;top:-6%;background:radial-gradient(circle,var(--b1) 0%,rgba(255,181,71,0) 64%);animation:drift2 22s ease-in-out infinite alternate}
.band .bl3{width:54vw;height:54vw;left:46vw;top:22%;background:radial-gradient(circle,var(--b3) 0%,rgba(242,87,126,0) 64%);animation:drift3 28s ease-in-out infinite alternate}
.band .bl4{width:46vw;height:46vw;left:72vw;top:-4%;background:radial-gradient(circle,var(--b4) 0%,rgba(22,163,154,0) 66%);animation:drift4 24s ease-in-out infinite alternate}
.band .bl5{width:40vw;height:40vw;left:34vw;top:38%;background:radial-gradient(circle,var(--b2) 0%,rgba(255,122,61,0) 64%);animation:drift2 30s ease-in-out infinite alternate-reverse}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--wash) 0%,rgba(255,255,255,0) 55%)}
@keyframes drift1{to{transform:translate(9vw,-4%) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vw,10%) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vw,-12%) scale(1.15)}}
@keyframes drift4{to{transform:translate(-6vw,14%) scale(1.1)}}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:96px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 6px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);font-size:13.5px;font-weight:600;color:#0B1B33;box-shadow:0 1px 2px rgba(11,27,51,.06)}
:root[data-theme="dark"] .eyebrow{background:rgba(10,19,36,.55);border-color:rgba(255,255,255,.14);color:#E9EFF7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyebrow{background:rgba(10,19,36,.55);border-color:rgba(255,255,255,.14);color:#E9EFF7}}
.eyebrow .flags{display:flex}
.eyebrow .flags svg{margin-right:-5px;border:2px solid #fff;border-radius:50%}
.eyebrow .flags svg:last-child{margin-right:4px}
.hero h1{font-size:clamp(40px,4.9vw,62px);line-height:1.03;letter-spacing:-.028em;margin:22px 0 20px;max-width:13em}
.hero .sub{font-size:19px;line-height:1.55;color:var(--fg);opacity:.86;max-width:33em}
.hero-cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero-cta .btn-s{background:rgba(255,255,255,.9);border-color:rgba(255,255,255,.9)}
:root[data-theme="dark"] .hero-cta .btn-s{background:rgba(15,27,48,.8);border-color:rgba(255,255,255,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-cta .btn-s{background:rgba(15,27,48,.8);border-color:rgba(255,255,255,.14)}}
.hero-notes{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:26px;font-size:14px;font-weight:500;color:var(--fg)}
.hero-notes span{display:inline-flex;align-items:center;gap:7px}
.hero-notes svg{color:var(--accent-ink)}
.hero-enter > *{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.hero-enter > *:nth-child(2){animation-delay:.06s}.hero-enter > *:nth-child(3){animation-delay:.12s}.hero-enter > *:nth-child(4){animation-delay:.18s}.hero-enter > *:nth-child(5){animation-delay:.24s}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
/* Browser frame mock */
.shot{position:relative;animation:rise 1s .1s cubic-bezier(.2,.7,.2,1) both}
.bframe{border-radius:14px;background:var(--surface);box-shadow:var(--sh-4);border:1px solid rgba(11,27,51,.08);overflow:hidden;transform:perspective(1800px) rotateY(-5deg) rotateX(2deg);transform-origin:left center;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.shot:hover .bframe{transform:perspective(1800px) rotateY(-2deg) rotateX(1deg)}
.bbar{display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bdots{display:flex;gap:6px}.bdots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.burl{flex:1;max-width:320px;margin:0 auto;height:24px;border-radius:7px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--fg-3)}
.mock{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);font-size:12.5px}
.mock-l{padding:18px;border-right:1px solid var(--line);display:grid;gap:14px}
.mock-r{padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.mock h5{margin:0;font:600 11px/1 var(--font);color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.mock-title{font-family:var(--head);font-weight:800;font-size:18px}
.mock-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mock-plan{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.mock-plan b{display:block;font-size:13px}
.mock-plan span{color:var(--fg-3);font-size:11px}
.mock-plan.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.mock-locs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mock-loc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--surface);font-weight:600;font-size:11.5px;min-width:0}
.mock-loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock-loc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mock-os{display:flex;gap:8px;flex-wrap:wrap}
.mock-os span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:500;background:var(--surface)}
.mock-os span.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.mock-line{display:flex;justify-content:space-between;gap:8px;color:var(--fg-2);white-space:nowrap}
.mock-line > *:first-child{overflow:hidden;text-overflow:ellipsis}
.mock-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;font-weight:700}
.mock-total b{font-family:var(--head);font-size:24px;font-weight:800}
.mock-pay{height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;gap:6px}
.mock-icons{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.float-card{position:absolute;left:-34px;bottom:-26px;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-3);animation:floaty 6s ease-in-out infinite;font-size:13px}
.float-card .fc-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.float-card b{display:block;font-size:14px}
.float-card2{left:auto;right:-18px;bottom:auto;top:-22px;animation-delay:-3s}
.float-card2 .fc-ic{background:var(--accent-soft);color:var(--accent-ink)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ============ Sections ============ */
.sec{padding:104px 0;position:relative}
.sec-alt{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:720px;margin-bottom:48px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--accent-ink);margin-bottom:14px}
.sec h2{font-size:clamp(32px,3.6vw,46px);letter-spacing:-.024em}
.sec-head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.6}

/* Trust row */
.trust{position:relative;padding:0 0 64px}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--sh-2)}
.trust-item{padding:24px 24px;display:flex;gap:16px;align-items:flex-start}
.trust-item + .trust-item{border-left:1px solid var(--line)}
.ti-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0}
.trust-item b{display:block;font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.trust-item span{font-size:14px;color:var(--fg-2);line-height:1.4;display:block;margin-top:4px}
.pay-strip{display:flex;align-items:center;gap:24px;margin-top:28px}
.pay-strip-l{font-size:14px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.marquee{position:relative;overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;gap:14px;width:max-content;animation:marq 34s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.pay-chip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}

/* Pricing */
.pricing-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.pricing-bar .spacer{flex:1}
.save-badge{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:2px 8px;margin-left:2px}
.plans{display:grid;gap:16px;grid-template-columns:repeat(5,minmax(0,1fr))}
.plans.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.plan{position:relative;display:flex;flex-direction:column;padding:24px 20px 20px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s}
.plan:hover{transform:translateY(-4px);box-shadow:var(--sh-3);border-color:var(--line-2)}
.plan.pop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh-2)}
.plan.pop:hover{box-shadow:0 0 0 1px var(--accent),var(--sh-3)}
.plan .pop-badge{position:absolute;top:-12px;left:20px;height:24px;padding:0 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.plan h3{font-size:22px}
.plan .for{font-size:13.5px;color:var(--fg-2);margin-top:4px;min-height:42px;line-height:1.45}
.price{display:flex;align-items:baseline;gap:4px;margin:16px 0 2px;flex-wrap:wrap}
.price b{font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:-.025em;line-height:1}
.price span{font-size:14px;color:var(--fg-3)}
.price-note{font-size:12.5px;color:var(--fg-3);min-height:19px}
.price-note s{margin-right:4px}
.specs{list-style:none;margin:18px 0 20px;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px}
.specs li{display:flex;align-items:center;gap:10px;color:var(--fg)}
.specs li svg{color:var(--fg-3)}
.specs li em{font-style:normal;color:var(--fg-3);margin-left:auto;font-size:13px}
.plan .btn{margin-top:auto}
.pricing-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-top:28px;padding:18px 22px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.pricing-foot p{font-size:14px;color:var(--fg-2)}
.pay-icons{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cmp .tbl{min-width:860px}
.cmp .tbl th,.cmp .tbl td{padding:14px 18px}
.cmp .tbl thead th{background:var(--surface);color:var(--fg);font-size:15px;font-family:var(--head);font-weight:800;vertical-align:bottom}
.cmp .tbl thead th small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--fg-3)}
.cmp .tbl td:first-child,.cmp .tbl th:first-child{color:var(--fg-2);font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1}
.cmp .tbl .col-pop{background:var(--accent-soft)}
.cmp .tbl tbody tr:hover{background:transparent}
.cmp .tbl .price-row td{font-family:var(--head);font-weight:800;font-size:20px}
.cmp .tbl .yes{color:var(--ok)}

/* Included */
.incl{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:64px;align-items:start}
.incl-list{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.incl-item{display:flex;gap:14px;padding:20px 22px;border-bottom:1px solid var(--line)}
.incl-item:nth-child(odd){border-right:1px solid var(--line)}
.incl-item:nth-last-child(-n+2){border-bottom:0}
.incl-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg-3);color:var(--fg);flex-shrink:0}
.incl-item b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.incl-item b .ck{color:var(--ok)}
.incl-item p{font-size:14px;color:var(--fg-2);margin-top:3px;line-height:1.5}
.incl-side p{color:var(--fg-2);font-size:17px;margin-top:16px}
.incl-side .money{margin-top:28px;padding:20px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);display:flex;gap:14px}
.incl-side .money b{display:block}

/* Equinix */
.eqx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:64px;align-items:center}
.eqx-points{display:grid;gap:4px;margin-top:28px}
.eqx-pt{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.eqx-pt:first-child{border-top:0}
.eqx-pt .incl-ic{background:var(--accent-soft);color:var(--accent-ink)}
.eqx-pt b{display:block;font-weight:600}
.eqx-pt span{font-size:14px;color:var(--fg-2)}
.eqx-art{position:relative;border-radius:var(--r-xl);background:linear-gradient(160deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--line);padding:24px;box-shadow:var(--sh-2);overflow:hidden}
.eqx-art::before{content:"";position:absolute;width:70%;height:70%;right:-20%;top:-30%;background:radial-gradient(circle,rgba(255,154,92,.22),rgba(255,154,92,0) 65%)}
.eqx-art::after{content:"";position:absolute;width:60%;height:60%;left:-20%;bottom:-25%;background:radial-gradient(circle,rgba(22,163,154,.18),rgba(22,163,154,0) 65%)}
.eqx-art > svg{position:relative;z-index:1;width:100%;height:auto}
.eqx-chip{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2);font-size:13px;font-weight:600;animation:floaty 7s ease-in-out infinite}
.eqx-chip svg{color:var(--accent-ink)}
.eqx-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.eqx-fact{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.eqx-fact b{display:block;font-family:var(--head);font-size:22px;font-weight:800}
.eqx-fact span{font-size:13px;color:var(--fg-2)}

/* Locations */
.locs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center}
.map-card{border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface);padding:20px;box-shadow:var(--sh-2);position:relative}
.map-card svg{width:100%;height:auto}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-3);margin-top:8px}
.pin-pulse{transform-box:fill-box;transform-origin:center;animation:pinp 2.4s ease-out infinite}
@keyframes pinp{0%{transform:scale(.6);opacity:.75}100%{transform:scale(2.6);opacity:0}}
.arc{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.loc-list{display:grid;gap:12px}
.loc-card{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);transition:transform .2s,box-shadow .2s,border-color .2s}
.loc-card:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.loc-card h4{font-size:19px}
.loc-card .meta{font-size:13.5px;color:var(--fg-2);margin-top:2px}
.loc-card .ping{margin-left:auto;text-align:right;font-size:13px;color:var(--fg-3);white-space:nowrap}
.loc-card .ping b{display:block;font-family:var(--head);font-size:20px;color:var(--fg);font-weight:800}

/* Panel preview */
.pp{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center}
.pp-list{display:grid;gap:14px;margin-top:24px}
.pp-list div{display:flex;gap:12px;align-items:flex-start;color:var(--fg-2)}
.pp-list svg{color:var(--ok);margin-top:3px}
.pp-mock{border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-4);overflow:hidden}
.pp-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pp-top h4{font-size:18px}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.pp-stats > div{padding:14px 20px;border-right:1px solid var(--line)}
.pp-stats > div:last-child{border-right:0}
.pp-stats span{font-size:12px;color:var(--fg-3);display:block}
.pp-stats b{font-size:15px}
.pp-chart{padding:16px 20px 18px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;position:relative}
.step{padding:28px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);position:relative;transition:transform .2s,box-shadow .2s}
.step:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.step-n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:700;font-size:15px}
.step-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.step-top .ti-ic{width:44px;height:44px}
.step h3{font-size:22px;margin-bottom:8px}
.step p{color:var(--fg-2);font-size:15px}
.step .pay-icons{margin-top:16px}
.step-time{margin-top:16px;font-size:13px;color:var(--fg-3);display:flex;gap:6px;align-items:center}

/* FAQ */
.faq{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:64px}
.faq-list{border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-weight:600;font-size:17px;cursor:pointer}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary .pm{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;transition:transform .25s,background .2s}
.faq-item[open] summary .pm{transform:rotate(45deg);background:var(--fg);color:var(--bg);border-color:var(--fg)}
.faq-item .ans{padding:0 48px 22px 0;color:var(--fg-2);line-height:1.65;animation:rise .35s ease both}

/* CTA */
.cta{position:relative;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.08);padding:72px 64px;background:#0B1B33;color:#fff;isolation:isolate}
.cta .band{inset:0;height:auto;transform:none;clip-path:polygon(68% 0,100% 0,100% 100%,54% 100%);opacity:1}
.cta .band::after{display:none}
.cta-in{position:relative;z-index:1;max-width:540px}
.cta h2{color:#fff;font-size:clamp(30px,3.6vw,46px)}
.cta p{margin-top:14px;font-size:18px;color:rgba(255,255,255,.8)}
.cta .btn-s{background:#fff;color:#0B1B33;border-color:#fff}
.cta .btn-p{background:#fff;color:#0B1B33}
.cta-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.cta .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.cta .btn-ghost:hover{background:rgba(255,255,255,.18)}

/* Footer */
.foot{border-top:1px solid var(--line);padding:56px 0 calc(32px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px}
.foot h5{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--fg)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot ul button{background:none;border:0;padding:0;color:var(--fg-2);font-size:14px;text-align:left}
.foot ul button:hover{color:var(--fg)}
.foot-about{color:var(--fg-2);font-size:14px;margin-top:14px;max-width:320px}
.foot-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;margin-top:44px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-3)}

/* ============ Auth ============ */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-l{display:flex;flex-direction:column;padding:28px max(32px,env(safe-area-inset-left,0px))}
.auth-form{width:100%;max-width:420px;margin:auto;padding:40px 0}
.auth-form h1{font-size:36px;letter-spacing:-.025em}
.auth-form .lead{color:var(--fg-2);margin:10px 0 28px}
.auth-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:14px;margin-bottom:22px}
.auth-note svg{color:var(--accent-ink)}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg-3);font-size:13px;margin:20px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-form form{display:grid;gap:16px}
.auth-alt{margin-top:22px;font-size:14px;color:var(--fg-2);text-align:center}
.demo-box{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px;font-size:13.5px;color:var(--fg-2)}
.auth-r{position:relative;overflow:hidden;background:#0B1B33;color:#fff;display:flex;align-items:flex-end;padding:56px}
.auth-r .band{top:-300px;height:820px;transform:skewY(-12deg)}
.auth-r-in{position:relative;z-index:1;max-width:460px;background:rgba(11,27,51,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:28px}
.auth-r-in h2{color:#fff;font-size:26px}
.auth-r-in ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:14px}
.auth-r-in li{display:flex;gap:12px;align-items:flex-start;color:rgba(255,255,255,.88);font-size:15px}
.auth-r-in li svg{color:#7FE0D6;margin-top:3px}
.auth-top{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ============ Panel ============ */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg-2)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px}
.side .logo{padding:4px 8px 18px;font-size:20px}
.side-nav{display:grid;gap:2px}
.side-sec{font-size:11.5px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em;padding:16px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:9px;border:0;background:none;font-size:14.5px;font-weight:500;color:var(--fg-2);text-align:left;width:100%;transition:background .15s,color .15s}
.nav-i:hover{background:var(--bg-3);color:var(--fg)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-i .cnt{margin-left:auto;font-size:12px;background:var(--bg-3);color:var(--fg-2);border-radius:999px;padding:0 7px;line-height:20px}
.nav-srv{font-size:13.5px;height:34px}
.nav-srv .sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);margin:0 4px 0 6px}
.nav-srv .sdot.off{background:var(--fg-3)}
.side-bal{margin-top:auto;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.side-bal span{font-size:12.5px;color:var(--fg-3)}
.side-bal b{display:block;font-family:var(--head);font-size:24px;font-weight:800;margin:2px 0 10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:64px;padding:0 max(32px,env(safe-area-inset-right,0px)) 0 max(32px,env(safe-area-inset-left,0px));background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .logo{display:none}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg-3);font-size:14px;width:min(340px,40vw)}
.search input{border:0;background:none;outline:none;width:100%;font-size:14px}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FFB547,#F2577E);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;border:0}
.page{padding:32px max(32px,env(safe-area-inset-right,0px)) 64px max(32px,env(safe-area-inset-left,0px));max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-size:30px;letter-spacing:-.022em}
.ph p{color:var(--fg-2);margin-top:4px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--fg-3);margin-bottom:10px}
.crumb button{background:none;border:0;padding:0;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.crumb button:hover{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:6px}
.kpi .k-l{font-size:13.5px;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.kpi .k-l svg{color:var(--fg-3)}
.kpi b{font-family:var(--head);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .k-s{font-size:13px;color:var(--fg-3)}
.kpi .k-a{margin-top:6px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.srv-cell{display:flex;align-items:center;gap:12px}
.srv-ic{width:36px;height:36px;border-radius:10px;background:var(--bg-3);display:grid;place-items:center;color:var(--fg-2)}
.srv-cell b{display:block;font-weight:600}
.srv-cell span{font-size:12.5px;color:var(--fg-3)}
.loc-cell{display:inline-flex;align-items:center;gap:8px}
.empty{padding:40px;text-align:center;color:var(--fg-3)}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-main b{display:block;font-weight:600;font-size:14.5px}
.list-row .lr-main span{font-size:13px;color:var(--fg-3)}

/* Bottom nav (mobile panel) */
.bnav{display:none}

/* Order wizard */
.order{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.ostep{margin-bottom:16px}
.ostep .card-h{justify-content:flex-start}
.ostep-n{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.ostep-n.done{background:var(--ok);color:#fff}
.ostep .card-h p{font-size:13.5px;color:var(--fg-3);margin-left:auto}
.opts{display:grid;gap:12px}
.opts-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{position:relative;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,box-shadow .15s,background .15s,transform .12s;min-width:0}
.opt:hover{border-color:var(--fg-3)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.opt[aria-pressed="true"]::after{content:"";position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--accent)}
.opt[aria-pressed="true"]::before{content:"";position:absolute;z-index:1;top:16.5px;right:17.5px;width:4px;height:7.5px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt b{font-weight:600;font-size:15px;padding-right:22px}
.opt .o-s{font-size:13px;color:var(--fg-2);line-height:1.45}
.opt .o-p{font-weight:700;font-size:14px;margin-top:4px}
.opt .o-row{display:flex;align-items:center;gap:10px}
.opt.big{padding:18px}
.opt.big .o-ic{width:40px;height:40px;border-radius:10px;background:var(--bg-3);display:grid;place-items:center;color:var(--fg);margin-bottom:6px}
.opt[aria-pressed="true"] .o-ic{background:var(--surface);color:var(--accent-ink)}
.opt.disabled{opacity:.55;pointer-events:none}
.os-logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;font-family:var(--head);flex-shrink:0}
.addon{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.addon:first-child{border-top:0;padding-top:0}
.addon .ad-t{flex:1}
.addon .ad-t b{display:block;font-weight:600;font-size:14.5px}
.addon .ad-t span{font-size:13px;color:var(--fg-3)}
.addon .ad-p{font-weight:600;font-size:14px;white-space:nowrap}
.summary{position:sticky;top:88px}
.sum-line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;color:var(--fg-2)}
.sum-line b{color:var(--fg);font-weight:600;text-align:right}
.sum-plan{display:flex;gap:12px;align-items:center;padding-bottom:14px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
.sum-total b{font-family:var(--head);font-size:30px;font-weight:800;letter-spacing:-.02em}
.sum-note{font-size:12.5px;color:var(--fg-3);margin:8px 0 16px}
.sum-trust{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-3);margin-top:14px;justify-content:center}
.msheet{display:none}

/* Checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.method{border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s,transform .12s;position:relative;min-height:118px}
.method:hover{border-color:var(--fg-3);transform:translateY(-1px)}
.method[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.method b{font-weight:600}
.method span{font-size:12.5px;color:var(--fg-3);margin-top:-8px}
.method .m-icons{display:flex;gap:5px;flex-wrap:wrap}
.method.disabled{opacity:.55}
.card-form{display:grid;gap:16px;margin-top:4px}
.brand-slot{display:flex;align-items:center}
.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.coin{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;position:relative;transition:.15s}
.coin:hover{border-color:var(--fg-3)}
.coin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.coin small{font-weight:500;color:var(--fg-3);font-size:11.5px}
.coin .ci-wrap{position:relative}
.coin .ci-net{position:absolute;right:-6px;bottom:-4px;border:2px solid var(--surface);border-radius:50%}
.crypto-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
.qr{padding:12px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.qr canvas{display:block;width:168px;height:168px}
.addr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bg-3);font-family:var(--mono);font-size:13px;word-break:break-all}
.addr span{flex:1;min-width:0}
.amt{font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:4px 10px}
.cstep{display:flex;gap:0;margin-top:22px}
.cstep > div{flex:1;position:relative;padding-top:30px;font-size:13px;color:var(--fg-3);font-weight:500}
.cstep > div::before{content:"";position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line-2)}
.cstep > div::after{content:"";position:absolute;top:3px;left:0;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);box-sizing:border-box}
.cstep > div.on{color:var(--fg)}
.cstep > div.on::before{background:var(--accent)}
.cstep > div.on::after{background:var(--accent);border-color:var(--accent)}
.cstep > div.cur::after{box-shadow:0 0 0 5px var(--accent-soft)}
.secure{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--fg-3);margin-top:16px}

/* 3DS */
.tds{text-align:center}
.tds .bank{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tds .code-in{max-width:200px;margin:14px auto 0;text-align:center;font-size:22px;letter-spacing:.3em;font-family:var(--mono)}

/* Provisioning */
.prov{max-width:720px;margin:0 auto}
.prov-card{padding:36px}
.prov-head{display:flex;gap:18px;align-items:center;margin-bottom:28px}
.prov-ring{width:64px;height:64px;flex-shrink:0;position:relative}
.prov-ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.prov-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.prov-steps{display:grid;gap:0}
.pst{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);color:var(--fg-3);font-weight:500;transition:color .3s}
.pst .ps-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);flex-shrink:0;transition:.3s}
.pst.run{color:var(--fg)}
.pst.run .ps-ic{border-color:var(--accent);color:var(--accent-ink)}
.pst.run .ps-ic svg{animation:spin 1s linear infinite}
.pst.ok{color:var(--fg)}
.pst.ok .ps-ic{background:var(--ok);border-color:var(--ok);color:#fff}
.pst em{margin-left:auto;font-style:normal;font-size:13px;color:var(--fg-3)}
@keyframes spin{to{transform:rotate(360deg)}}
.ready-hero{display:flex;gap:16px;align-items:center;padding:28px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,var(--ok-bg),transparent 70%)}
.ready-ic{width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex-shrink:0}
.cred{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line)}
.cred .c-l{font-size:14px;color:var(--fg-2)}
.cred .c-v{font-family:var(--mono);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cred .c-a{display:flex;gap:6px}

/* Server page */
.srv-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.srv-head h1{font-size:30px}
.srv-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--fg-2);margin-top:8px;align-items:center}
.srv-meta span{display:inline-flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:24px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;font-size:14.5px;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.spec-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.spec{padding:18px}
.spec span{font-size:13px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.spec b{display:block;font-size:18px;margin-top:4px;font-weight:700}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chart-card{padding:18px 18px 12px}
.chart-card .ch-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.chart-card .ch-h span{font-size:13.5px;color:var(--fg-2);font-weight:500}
.chart-card .ch-h b{font-family:var(--head);font-size:22px;font-weight:800}
.chart svg{width:100%;height:auto;overflow:visible}
.ch-axis{font-size:10px;fill:var(--fg-3);font-family:var(--font)}
.term{background:var(--term);border-radius:16px;overflow:hidden;box-shadow:var(--sh-3);border:1px solid rgba(255,255,255,.06)}
.term-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);color:var(--term-dim);font-size:13px}
.term-bar .bdots i{background:#2A3850}
.term-out{height:380px;overflow:auto;padding:16px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.6;color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
.term-out .p{color:var(--term-ok)}
.term-out .d{color:var(--term-dim)}
.term-in{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:13.5px;color:var(--term-ok)}
.term-in input{flex:1;background:none;border:0;outline:none;color:var(--term-fg);font-family:var(--mono);font-size:13.5px;min-width:0}
.term-in label{color:var(--term-ok)}
.term-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 14px}
.term-chips button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--term-fg);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-size:12px}
.term-chips button:hover{background:rgba(255,255,255,.12)}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.os-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

/* Billing / support / account */
.bal-card{position:relative;overflow:hidden;padding:24px;color:#fff;background:#0B1B33;border:0}
.bal-card .band{inset:0;height:auto;transform:none;clip-path:polygon(74% 0,100% 0,100% 100%,58% 100%);opacity:1}
.bal-card .band::after{display:none}
.bal-in{position:relative;z-index:1}
.bal-card span{font-size:14px;color:rgba(255,255,255,.8)}
.bal-card b{display:block;font-family:var(--head);font-size:40px;font-weight:800;margin:4px 0 18px;letter-spacing:-.02em}
.bal-card .btn-p{background:#fff;color:#0B1B33}
.pm-row{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.pm-row:last-child{border-bottom:0}
.pm-row .lr-main b{font-weight:600}
.ticket-thread{display:grid;gap:16px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .avatar{width:34px;height:34px;font-size:13px;flex-shrink:0}
.msg .avatar.staff{background:linear-gradient(135deg,#16A39A,#0C6570)}
.msg-body{flex:1;min-width:0;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.msg.me .msg-body{background:var(--accent-soft);border-color:transparent}
.msg-meta{font-size:12.5px;color:var(--fg-3);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.msg-meta b{color:var(--fg);font-weight:600}
.msg-body p{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.sup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
.tk-row{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;transition:background .15s}
.tk-row:hover{background:var(--surface-2)}
.tk-row[aria-current="true"]{background:var(--accent-soft)}
.tk-row .lr-main b{display:block;font-weight:600;font-size:14.5px}
.tk-row .lr-main span{font-size:12.5px;color:var(--fg-3)}
.acc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.bill-top{grid-template-columns:1.1fr 1fr 1fr}
.fw-form{display:grid;gap:12px;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) 120px auto;align-items:end}
.token-box{margin-top:12px;padding:12px;border-radius:10px;background:var(--warn-bg);font-size:13px}

/* Modal + toast */
.modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
.modal-root.open{display:flex}
.modal-bg{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease}
.modal{position:relative;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--sh-4);border:1px solid var(--line);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:22px 22px 0}
.modal-h h3{font-size:20px;flex:1}
.modal-b{padding:14px 22px 6px;color:var(--fg-2);font-size:15px}
.modal-b .field{margin-top:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:18px 22px 22px;flex-wrap:wrap}
.m-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0}
.m-ic.bad{background:var(--bad-bg);color:var(--bad)}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
.toasts{position:fixed;z-index:120;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#0B1B33;color:#fff;box-shadow:var(--sh-3);font-size:14px;font-weight:500;animation:pop .25s ease}
:root[data-theme="dark"] .toast{background:#E9EFF7;color:#0B1B33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#E9EFF7;color:#0B1B33}}
.toast svg{color:#5FD3B8}

const PERIODS = {m:{months:1, disc:0}, q:{months:3, disc:.05}, y:{months:12, disc:.15}};
function orderCalc(o){
  o = o || S.order;
  const p = planOf(o.type, o.plan);
  const lines = [{k:'plan', amt:p.price}];
  if (o.imgKind==='os' && o.os==='windows') lines.push({k:'win', amt:9});
  if (o.backups) lines.push({k:'backups', amt:Math.round(p.price*0.2*100)/100});
  if (o.ipv4) lines.push({k:'ipv4', amt:2});
  if (o.ddos) lines.push({k:'ddos', amt:5});
  const monthly = lines.reduce((a,l)=>a+l.amt,0);
  const per = PERIODS[o.period];
  const gross = monthly*per.months;
  const disc = Math.round(gross*per.disc*100)/100;
  const total = Math.round((gross-disc)*100)/100;
  return {plan:p, lines, monthly, months:per.months, gross, disc, total};
}

'faq.q1':'How can I pay?','faq.a1':'By bank card or mobile wallet, or in cryptocurrency: USDT on TRC-20 and ERC-20, BTC, ETH and LTC. You can also top up your account balance and pay renewals from it.','faq.q2':'Can I get a refund?','faq.a2':'Yes. Every VPS comes with a 14-day money-back guarantee: if it isn’t right for you, we refund the full amount. Dedicated servers are prepared to order, so they can’t be refunded after setup.','faq.q3':'Do you require ID verification (KYC)?','faq.a3':'No ID is needed for standard orders, only an email address. In rare cases, for example if we suspect fraud, we may ask for extra verification.','faq.q4':'Which operating systems can I install?','faq.a4':'Ubuntu 24.04, Debian 12, AlmaLinux 9, Rocky Linux 9 and Windows Server 2022 (+€9/mo on VPS), plus one-click Docker, WordPress, Nextcloud and WireGuard VPN. You can reinstall at any time from the panel.','faq.q5':'Can I upgrade my plan later?','faq.a5':'Yes. You can move a VPS to a bigger plan in the panel in a few minutes and only pay the difference for the rest of the billing period. Your data and IP address stay the same.','faq.q6':'How fast will my server be ready?','faq.a6':'A VPS is usually running less than a minute after payment. Dedicated servers are prepared and tested by our engineers within 24 hours.','faq.q7':'What does the 99.99% SLA mean?','faq.a7':'Your server is guaranteed to be available at least 99.99% of the time each month. If we fall short, you receive service credits on your balance.',

/* ===================== i18n ===================== */
function t(k, v){
  let s = (I18N[S.lang] && I18N[S.lang][k]);
  if (s == null) s = I18N.en[k];
  if (s == null) return k;
  if (v) for (const n in v) s = s.split('{'+n+'}').join(v[n]);
  return s;
}

function isoArt(){
  const c = 0.866, s = 0.5, ox = 250, oy = 70;
  const P = (x,y,z) => (ox+(x-y)*c).toFixed(1)+','+(oy+(x+y)*s-z).toFixed(1);
  const poly = (pts, fill, extra) => '<polygon points="'+pts.map(p=>P(p[0],p[1],p[2])).join(' ')+'" fill="'+fill+'" '+(extra||'')+'/>';
  const line = (a,b,col,w,op) => '<line x1="'+P(...a).split(',')[0]+'" y1="'+P(...a).split(',')[1]+'" x2="'+P(...b).split(',')[0]+'" y2="'+P(...b).split(',')[1]+'" stroke="'+col+'" stroke-width="'+(w||1)+'" opacity="'+(op||1)+'" stroke-linecap="round"/>';
  const box = (x,y,z,w,d,h,o) => {
    o = o||{};
    let g = poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], o.top||'var(--iso-top)', 'stroke="var(--line-2)" stroke-width=".6"')+
      poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]], o.left||'var(--iso-l)', 'stroke="var(--line-2)" stroke-width=".6"')+
      poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], o.right||'var(--iso-r)', 'stroke="var(--line-2)" stroke-width=".6"');
    if (o.units) for (let i=1;i<o.units;i++){ const zz = z+8+i*(h-14)/o.units; g += line([x+3,y+d,zz],[x+w-3,y+d,zz],'var(--fg-3)',.7,.35); }
    if (o.stripe) g += line([x+4,y+d,z+h-6],[x+w-4,y+d,z+h-6],o.stripe,2.4,.95);
    return g;
  };
  let svg = '';
  // floor
  svg += poly([[0,0,0],[330,0,0],[330,250,0],[0,250,0]],'var(--iso-floor)','stroke="var(--line-2)"');
  for (let i=30;i<330;i+=30) svg += line([i,0,0],[i,250,0],'var(--iso-floor-2)',1);
  for (let j=25;j<250;j+=25) svg += line([0,j,0],[330,j,0],'var(--iso-floor-2)',1);
  // cold aisle highlight
  svg += poly([[24,96,0.5],[262,96,0.5],[262,138,0.5],[24,138,0.5]],'var(--accent)','opacity=".10"');
  // back wall units (power)
  svg += box(20,8,0,60,22,58,{top:'var(--iso-top)',stripe:'var(--iso-warm)'});
  svg += box(90,8,0,60,22,58,{stripe:'var(--iso-warm)'});
  // racks rows
  const rowA = [], rowB = [];
  for (let i=0;i<7;i++){ rowA.push(28+i*33); rowB.push(28+i*33); }
  rowA.forEach((x,i)=>{ svg += box(x,58,0,28,38,86,{units:6, stripe: i%3===1?'var(--iso-warm)':'var(--iso-acc)'}); });
  // cooling unit row A end
  svg += box(268,56,0,40,42,92,{top:'var(--iso-top)', stripe:'var(--iso-acc)', units:3});
  rowB.forEach((x,i)=>{ svg += box(x,140,0,28,38,86,{units:6, stripe: i%3===2?'var(--iso-warm)':'var(--iso-acc)'}); });
  svg += box(268,138,0,40,42,92,{stripe:'var(--iso-acc)', units:3});
  // access gate
  svg += box(0,210,0,8,30,64,{top:'var(--iso-top)'});
  svg += box(46,210,0,8,30,64,{top:'var(--iso-top)'});
  svg += poly([[8,224,30],[46,224,30],[46,226,30],[8,226,30]],'var(--accent)','opacity=".8"');
  // cable tray
  svg += poly([[24,112,104],[262,112,104],[262,122,104],[24,122,104]],'var(--accent)','opacity=".22"');
  svg += line([24,112,104],[262,112,104],'var(--accent)',1.2,.55);
  return '<svg viewBox="0 0 540 400" role="img" aria-label="'+t('eq.artA')+'">'+svg+'</svg>';
}

function chartSVG(data, opts){
  opts = opts || {}; const W = opts.w||320, H = opts.h||110, max = opts.max||100, col = opts.col||'var(--accent)';
  const id = uid('cg'); const n = data.length; const pad = opts.axis?18:0;
  const pts = data.map((v,i)=>[(i/(n-1))*W, H - pad - (Math.min(v,max)/max)*(H-pad-6)]);
  let d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    const c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6, c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += ' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  let grid = '';
  for (let g=1; g<=3; g++){ const y = ((H-pad)/4)*g; grid += '<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'; }
  let axis = '';
  if (opts.axis && opts.labels) axis = opts.labels.map((l,i)=>'<text class="ch-axis" x="'+((i/(opts.labels.length-1))*W)+'" y="'+(H-3)+'" text-anchor="'+(i===0?'start':i===opts.labels.length-1?'end':'middle')+'">'+l+'</text>').join('');
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+grid+
    '<path d="'+d+' L'+W+' '+(H-pad)+' L0 '+(H-pad)+' Z" fill="url(#'+id+')"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>'+axis+'</svg>';
}
function wave(n, base, amp, seed){ const a=[]; let v=base; for(let i=0;i<n;i++){ v += (Math.sin((i+seed)*0.7)+Math.cos((i+seed*2)*0.31))*amp*0.35 + (Math.random()-.5)*amp*0.5; v = Math.max(base-amp, Math.min(base+amp, v)); a.push(Math.max(1,v)); } return a; }

  if (c.method==='balance' && !canBal) c.method = 'card';
  let recap;
  if (c.kind==='order'){

    recap = '<div class="card-h"><h3>'+t('co.order')+'</h3><button type="button" class="link-btn" data-act="go" data-v="order">'+ic('edit',14)+t('co.edit')+'</button></div><div class="card-b">'+summaryLines()+

  } else if (c.kind==='invoice'){
    recap = '<div class="card-h"><h3>'+t('co.invoice')+'</h3></div><div class="card-b"><div class="sum-line"><span>'+t('b.inv')+'</span><b>'+c.invoice+'</b></div><div class="sum-total"><span class="muted">'+t('co.toPay')+'</span><b>'+money(amt)+'</b></div></div>';
  } else {
    recap = '<div class="card-h"><h3>'+t('co.topupT')+'</h3></div><div class="card-b"><span class="lbl">'+t('co.amount')+'</span><div class="opts opts-3" style="margin-top:10px">'+[25,50,100,250,500].map(v=>'<button type="button" class="opt" style="padding:10px 12px" data-act="tu-amt" data-v="'+v+'" aria-pressed="'+(c.amount===v)+'"><b>'+money(v,true)+'</b></button>').join('')+

function drawQR(){
  const cv = $('#qr'); if (!cv) return;
  const ctx = cv.getContext('2d'); const N = 29, s = cv.width/N;
  let seed = 0; const str = S.checkout.coin + coAmount(); for (const ch of str) seed = (seed*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; };
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle = '#0B1B33';
  const finder = (x,y) => { ctx.fillRect(x*s,y*s,7*s,7*s); ctx.fillStyle='#fff'; ctx.fillRect((x+1)*s,(y+1)*s,5*s,5*s); ctx.fillStyle='#0B1B33'; ctx.fillRect((x+2)*s,(y+2)*s,3*s,3*s); };
  const inF = (x,y) => (x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ if (inF(x,y)) continue; if (rnd()>.52) ctx.fillRect(x*s,y*s,s+.5,s+.5); }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  ctx.fillStyle='#fff'; ctx.fillRect(11.5*s,11.5*s,6*s,6*s);
  const k = COINS.find(x=>x.id===S.checkout.coin);
  ctx.fillStyle = {usdt:'#26A17B',btc:'#F7931A',eth:'#627EEA',ltc:'#345D9D'}[k.icon];
  ctx.beginPath(); ctx.arc(14.5*s,14.5*s,2.5*s,0,Math.PI*2); ctx.fill();
}

function termIntro(s){
  return '<span class="d">'+t('sv.welcome',{n:esc(imgName(s.imgKind,s.img))})+'\n'+t('sv.last')+'</span>\n';
}
function termRun(cmd){
  const s = curSrv(); S.term = S.term || {};
  let out = S.term[s.id] || termIntro(s);
  const c = cmd.trim();
  out += '<span class="p">root@'+esc(s.name)+':~#</span> '+esc(c)+'\n';
  const p = planOf(s.type,s.plan);
  const R = {
    help: t('sv.help'),
    ls: 'backups  docker-compose.yml  www  .ssh',
    'ls -la': 'drwx------  6 root root 4096 Nov 20 09:12 .\ndrwxr-xr-x 19 root root 4096 Jul  4 11:02 ..\ndrwx------  2 root root 4096 Jul  4 11:03 .ssh\ndrwxr-xr-x  2 root root 4096 Nov 12 14:20 backups\n-rw-r--r--  1 root root  812 Oct  2 18:44 docker-compose.yml\ndrwxr-xr-x  4 root root 4096 Sep 15 10:31 www',
    uptime: ' 10:14:07 up 41 days,  3:22,  1 user,  load average: 0.18, 0.24, 0.21',
    'df -h': 'Filesystem      Size  Used Avail Use% Mounted on\n/dev/vda1       '+(s.type==='vps'?p.disk+'G   31G  '+(p.disk-31)+'G  '+Math.round(31/p.disk*100)+'%':'1.8T  412G  1.4T  23%')+' /\ntmpfs           '+(s.type==='vps'?(p.ram/2)+'G':'63G')+'     0  '+(s.type==='vps'?(p.ram/2)+'G':'63G')+'   0% /dev/shm',
    'free -h': '               total        used        free\nMem:           '+(s.type==='vps'?p.ram:parseInt(p.ram,10))+'Gi       '+(s.type==='vps'?(p.ram*0.42).toFixed(1):'54')+'Gi       '+(s.type==='vps'?(p.ram*0.58).toFixed(1):'74')+'Gi',
    whoami: 'root', hostname: s.name, pwd: '/root', date: 'Fri Nov 20 10:14:07 CET 2026',
    'uname -a': 'Linux '+s.name+' 6.8.0-49-generic #49-Ubuntu SMP x86_64 GNU/Linux'
  };
  if (c==='clear'){ S.term[s.id] = ''; return ''; }
  if (s.status!=='running') out += t('sv.offline')+'\n';
  else if (c==='') {}
  else if (R[c]!=null) out += esc(R[c])+'\n';
  else out += esc(c.split(' ')[0])+': '+t('sv.nf')+'\n';
  S.term[s.id] = out; return out;
}

function closeModal(){ const r = $('#modalRoot'); r.classList.remove('open'); r.innerHTML = ''; modalOk = null; if (lastFocus && lastFocus.focus && document.body.contains(lastFocus)) lastFocus.focus(); }
function toast(msg, bad){
  const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast'+(bad?' bad':''); el.setAttribute('role','status');
  el.innerHTML = ic(bad?'alert':'checkc',18)+'<span>'+msg+'</span>'; box.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}
function copyText(text, srcEl){
  const done = () => toast(t('toast.copied'));
  const fallback = () => { if (srcEl){ try { const r = document.createRange(); r.selectNodeContents(srcEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); if (srcEl.select) srcEl.select(); } catch(e){} } toast(t('toast.selected')); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch(e){ fallback(); }
}

/* ===================== Router ===================== */
const ROUTES = ['home','pricing','login','signup','panel','order','checkout','provisioning','server','billing','support','account'];
const PANEL = ['panel','order','checkout','provisioning','server','billing','support','account'];
let timers = [];
function clearTimers(){ timers.forEach(x=>{ clearInterval(x); clearTimeout(x); }); timers = []; }
function go(r){ if (location.hash === '#'+r) render(); else location.hash = r; }
function route(){ const h = (location.hash||'').replace(/^#/,''); return ROUTES.includes(h) ? h : 'home'; }
function render(keepScroll){
  clearTimers();
  const r = route();
  if (PANEL.includes(r) && !S.user) S.user = {name:S.profile.name, email:S.profile.email};
  const app = $('#app');
  let html;
  switch(r){
    case 'login': case 'signup': html = vAuth(r); break;
    case 'panel': html = vPanel(); break;
    case 'order': html = vOrder(); break;
    case 'checkout': html = vCheckout(); break;
    case 'provisioning': html = vProvisioning(); break;
    case 'server': html = vServer(); break;
    case 'billing': html = vBilling(); break;
    case 'support': html = vSupport(); break;
    case 'account': html = vAccount(); break;
    default: html = vLanding();
  }
  const y = window.scrollY;
  app.innerHTML = LU(html);
  document.documentElement.lang = S.lang;
  document.title = t('title.'+r);
  if (keepScroll) window.scrollTo(0, y);
  else if (r==='pricing') setTimeout(()=>scrollToId('pricing', true), 20);
  else if (S.lastRoute !== r) window.scrollTo(0,0);
  S.lastRoute = r;
  after(r);
}
function scrollToId(id, instant){
  const el = document.getElementById(id); if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 64;
  window.scrollTo({top, behavior: (instant||reduced())?'auto':'smooth'});
}
function after(r){
  $$('.seg').forEach(placePill);
  if (r==='home' || r==='pricing'){ headerOver(); countUp(); }
  if (r==='checkout' && S.checkout.method==='crypto'){ drawQR(); startCryptoTimer(); }
  if (r==='provisioning' && S.prov && !S.prov.done) runProv();
  if (r==='server'){ startLive(); const o = $('#termOut'); if (o) o.scrollTop = o.scrollHeight; }
}
function placePill(seg){
  const pill = seg.querySelector('.seg-pill'); const btn = seg.querySelector('button[aria-pressed="true"]');
  if (!pill || !btn) return;
  pill.style.width = btn.offsetWidth+'px'; pill.style.transform = 'translateX('+(btn.offsetLeft-4)+'px)';
}
function headerOver(){ const h = $('#mh'); if (h) h.classList.toggle('over', window.scrollY < 12); }
function countUp(){
  if (reduced()) return;
  $$('[data-count]').forEach(el=>{
    const raw = el.getAttribute('data-count'); const m = raw.match(/^([\d.]+)(.*)$/); if (!m) return;
    const target = parseFloat(m[1]), dec = (m[1].split('.')[1]||'').length, rest = m[2]; const t0 = performance.now();
    const step = now => { const k = Math.min(1,(now-t0)/1200), e = 1-Math.pow(1-k,3); const v = target*e; el.textContent = (dec?v.toFixed(dec):Math.round(v))+rest; if (k<1) requestAnimationFrame(step); else el.textContent = raw; };
    requestAnimationFrame(step);
  });
}
function startCryptoTimer(){
  if (!S.cryptoEnds) S.cryptoEnds = Date.now()+30*60*1000;
  const tick = () => { const el = $('#crTimer'); if (!el) return; const left = Math.max(0, S.cryptoEnds-Date.now()); const m = Math.floor(left/60000), s = Math.floor(left%60000/1000); el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
  tick(); timers.push(setInterval(tick, 1000));
}
function startLive(){
  timers.push(setInterval(()=>{
    const s = curSrv(); if (!s) return;
    const se = srvSeries(s);
    ['cpu','ram','net'].forEach(k=>{ const a = se[k]; const last = a[a.length-1]; const base = k==='ram'?58:k==='cpu'?(s.type==='vps'?24:38):42; let v = last + (Math.random()-.5)*(k==='ram'?4:14) + (base-last)*.15; a.push(Math.max(2,Math.min(96,v))); a.shift(); });
    const box = $('#liveCharts'); if (box) box.innerHTML = LU(liveCharts(s, S.serverTab==='graphs'));
  }, 2000));
}
function runProv(){
  const P = S.prov; const delays = [1200,1600,1900,1300,900];
  const next = () => {
    if (route()!=='provisioning') return;
    P.step++;
    if (P.step >= 5){ P.done = true; const srv = S.servers.find(s=>s.id===P.srv); srv.status='running'; P.secs = 52; render(); return; }
    render(true);
  };
  timers.push(setTimeout(next, delays[P.step]||1000));
}

  const host = (o.hostname||'').trim() || (o.loc+'-'+(o.type==='vps'?'web':'node')+'-0'+(S.servers.length+1));

  if (c.kind==='topup'){ S.balance += c.amount; S.invoices.unshift({id:'INV-2026-0'+(149+S.invoices.length), date:TODAY.toISOString().slice(0,10), item:'inv.item.topup', srv:'', amount:c.amount, status:'paid'}); toast(t('toast.topped',{x:money(c.amount)})); go('billing'); return; }

}
function luhn(n){ let s=0, alt=false; for (let i=n.length-1;i>=0;i--){ let d=+n[i]; if (alt){ d*=2; if (d>9) d-=9; } s+=d; alt=!alt; } return s%10===0; }
