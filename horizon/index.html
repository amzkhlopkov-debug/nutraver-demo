  'srv-del': () => { const s = curSrv(); modal({icon:'trash', danger:true, title:t('sv.delCT',{n:esc(s.name)}), body:'<p>'+t('sv.delCD')+'</p><div class="field"><label for="del-conf">'+t('sv.delType',{n:esc(s.name)})+'</label><input class="inp mono" id="del-conf" autocomplete="off"></div>', ok:t('sv.delB'), onOk:()=>{ if ($('#del-conf').value.trim()!==s.name){ $('#del-conf').closest('.field').classList.add('invalid'); toast(t('toast.typeName'), true); return false; } S.servers = S.servers.filter(x=>x.id!==s.id); S.curServer = (S.servers[0]||{}).id; toast(t('toast.srvDel')); go('panel'); }}); },
  pdf: v => toast(t('toast.pdf',{x:v})),
  'add-card': () => modal({icon:'card', title:t('b.addCard'), body:'<div class="field"><label for="nc-num">'+t('co.num')+'</label><input class="inp mono" id="nc-num" inputmode="numeric" placeholder="4242 4242 4242 4242"></div><div class="grid2 keep" style="margin-top:4px"><div class="field"><label for="nc-exp">'+t('co.expL')+'</label><input class="inp mono" id="nc-exp" placeholder="MM/YY" maxlength="5"></div><div class="field"><label for="nc-cvc">CVC</label><input class="inp mono" id="nc-cvc" placeholder="123" maxlength="4"></div></div>', ok:t('b.saveCard'), onOk:()=>{ const n = $('#nc-num').value.replace(/\D/g,''); if (n.length<12){ toast(t('co.numE'), true); return false; } S.cards.push({id:'c'+Date.now(), brand:brandOf(n)||'visa', last:n.slice(-4), exp:$('#nc-exp').value||'12/29', def:false}); render(true); toast(t('toast.cardAdded')); }}),
  'card-del': v => { S.cards = S.cards.filter(c=>c.id!==v); if (S.cards.length && !S.cards.some(c=>c.def)) S.cards[0].def = true; render(true); toast(t('toast.cardDel')); },
  'card-def': v => { S.cards.forEach(c=>c.def = c.id===v); render(true); },
  ticket: v => { S.curTicket = v; S.ticketNew = false; render(true); },
  'tk-new': () => { S.ticketNew = true; render(true); setTimeout(()=>{ const i = $('#tk-subj'); if (i) i.focus(); }, 30); },
  'tk-close': () => { const tk = S.tickets.find(x=>x.id===S.curTicket); tk.status = 'closed'; render(true); toast(t('toast.tkClosed')); },
  'save-profile': () => { const n = $('#pf-name'), e = $('#pf-email'), c = $('#pf-co'), co = $('#pf-country'); S.profile.name = n.value.trim()||S.profile.name; S.profile.email = e.value.trim()||S.profile.email; S.profile.company = c.value; S.profile.country = co.value; render(true); toast(t('toast.saved')); },
  'key-add': () => modal({icon:'key', title:t('a.keyAdd'), body:'<div class="field"><label for="key-name">'+t('a.keyName')+'</label><input class="inp" id="key-name" placeholder="Work laptop"></div><div class="field"><label for="key-val">'+t('a.keyVal')+'</label><textarea class="inp mono" id="key-val" placeholder="ssh-ed25519 AAAAC3Nza… you@laptop"></textarea></div>', ok:t('a.keyAdd'), onOk:()=>{ const nm = $('#key-name').value.trim(), kv = $('#key-val').value.trim(); if (!nm || !/^(ssh-|ecdsa-)/.test(kv)){ toast(t('toast.keyBad'), true); return false; } let h = ''; const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; for (let i=0;i<43;i++) h += a[(kv.charCodeAt(i%kv.length)*(i+7))%a.length]; S.sshKeys.push({id:'k'+Date.now(), name:nm, fp:'SHA256:'+h, added:TODAY.toISOString().slice(0,10)}); render(true); toast(t('toast.keyAdded')); }}),
  'key-del': v => { const k = S.sshKeys.find(x=>x.id===v); modal({icon:'trash', danger:true, title:t('a.keyDelT'), body:'<p>'+t('a.keyDelD',{n:esc(k.name)})+'</p>', ok:t('sv.del'), onOk:()=>{ S.sshKeys = S.sshKeys.filter(x=>x.id!==v); render(true); toast(t('toast.deleted')); }}); },
  'tok-add': () => modal({icon:'route', title:t('a.tokAdd'), body:'<div class="field"><label for="tok-name">'+t('a.tokName')+'</label><input class="inp" id="tok-name" placeholder="CI deploy"></div><div class="field"><label for="tok-scope">'+t('a.tokScope')+'</label><select class="inp" id="tok-scope"><option value="tok.rw">'+t('tok.rw')+'</option><option value="tok.ro">'+t('tok.ro')+'</option></select></div>', ok:t('a.tokCreate'), onOk:()=>{ const nm = $('#tok-name').value.trim()||'API token'; const sc = $('#tok-scope').value; let v = 'nvt_'; const a='abcdef0123456789'; for (let i=0;i<40;i++) v += a[Math.floor(Math.random()*16)]; S.tokens.push({id:'tok'+Date.now(), name:nm, created:TODAY.toISOString().slice(0,10), last:TODAY.toISOString().slice(0,10), scope:sc}); render(true); const box = $('#tokNew'); if (box) box.innerHTML = '<div class="card-b"><div class="token-box"><b>'+t('a.tokOnce')+'</b><div class="addr" style="margin-top:8px;background:var(--surface)"><span id="tokVal">'+v+'</span><button type="button" class="btn btn-s btn-xs" data-act="copy" data-src="tokVal">'+ic('copy',13)+t('cr.copy')+'</button></div></div></div>'; }}),
  'tok-del': v => { modal({icon:'alert', danger:true, title:t('a.revokeT'), body:'<p>'+t('a.revokeD')+'</p>', ok:t('a.revoke'), onOk:()=>{ S.tokens = S.tokens.filter(x=>x.id!==v); render(true); toast(t('toast.revoked')); }}); },
  'user-menu': () => modal({icon:'user', title:esc(S.profile.name), body:'<p>'+esc(S.profile.email)+'</p><div style="display:grid;gap:8px;margin-top:16px"><button type="button" class="btn btn-s btn-block" style="justify-content:flex-start" data-act="go" data-v="account">'+ic('user',16)+t('nav.account')+'</button><button type="button" class="btn btn-s btn-block" style="justify-content:flex-start" data-act="go" data-v="billing">'+ic('receipt',16)+t('nav.billing')+'</button><button type="button" class="btn btn-s btn-block" style="justify-content:flex-start" data-act="go" data-v="home">'+ic('globe',16)+t('a.site')+'</button><button type="button" class="btn btn-ds btn-block" style="justify-content:flex-start" data-act="logout">'+ic('logout',16)+t('a.logout')+'</button></div>', noCancel:true}),
  logout: () => { S.user = null; toast(t('toast.logout')); go('home'); },
  'm-close': () => closeModal(),
  'm-ok': () => { const f = modalOk; const r = f ? f() : undefined; if (r !== false && $('#modalRoot').classList.contains('open') && modalOk === f) closeModal(); }
};
function closeMenu(){ const m = $('#mobmenu'); if (m && m.classList.contains('open')){ m.classList.remove('open'); document.body.style.overflow = ''; } }
function LU(h){ if (S.lang!=='ru') return h; return h.replace(/(\d) (GB|TB)(?![\w-])/g,(m,d,u)=>d+'\u00a0'+(u==='GB'?'ГБ':'ТБ')).replace(/Gbit\/s/g,'Гбит/с').replace(/Mbit\/s/g,'Мбит/с'); }
function refreshPricing(){ const b = $('#pricingBlock'); if (!b) return; b.innerHTML = LU(pricingBlock()); $$('.seg', b).forEach(placePill); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName==='SELECT') return;
  const act = el.getAttribute('data-act'); const fn = A[act]; if (!fn) return;
  if (el.closest('.modal-root') && act!=='m-close' && act!=='m-ok' && act!=='copy') closeModal();
  e.preventDefault();
  fn(el.getAttribute('data-v'), el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-toggle]')){
    const k = el.getAttribute('data-toggle');
    if (k==='srvBackups'){ curSrv().backups = el.checked; toast(t(el.checked?'toast.bkOn':'toast.bkOff')); return; }
    if (k in S.order && route()==='order'){ S.order[k] = el.checked; refreshSummary(); return; }
    if (k==='autoRenew'){ S.autoRenew = el.checked; toast(t(el.checked?'toast.arOn':'toast.arOff')); return; }
    if (k==='twofa'){ S.twofa = el.checked; toast(t(el.checked?'toast.2faOn':'toast.2faOff')); return; }
  }
  if (el.id==='pf-lang'){ A.lang(el.value); return; }
  if (el.matches('[data-bind]')){ S.order[el.getAttribute('data-bind')] = el.value; if (el.id==='o-key') render(true); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-bind]') && el.tagName!=='SELECT'){ S.order[el.getAttribute('data-bind')] = el.value; return; }
  if (el.id==='cc-num' || el.id==='nc-num'){ const d = el.value.replace(/\D/g,'').slice(0,19); el.value = d.replace(/(.{4})/g,'$1 ').trim(); if (el.id==='cc-num'){ const b = brandOf(d); $('#ccBrand').innerHTML = b ? pay(b,22) : ic('card',20); setInvalid('f-num', false); } }
  if (el.id==='cc-exp' || el.id==='nc-exp'){ let d = el.value.replace(/\D/g,'').slice(0,4); if (d.length>=3) d = d.slice(0,2)+'/'+d.slice(2); el.value = d; }
  if (el.id==='cc-cvc'){ el.value = el.value.replace(/\D/g,'').slice(0,4); }
  if (el.id==='tu-custom'){ const v = parseFloat(el.value.replace(',','.')); if (v>0){ S.checkout.amount = Math.round(v*100)/100; $$('[data-act="tu-amt"]').forEach(b=>b.setAttribute('aria-pressed','false')); const tt2 = $('#tuTotal'); if (tt2) tt2.textContent = money(S.checkout.amount); const pb = $('#cardForm button[type="submit"]'); if (pb) pb.innerHTML = ic('lock',16)+t('co.pay',{x:money(S.checkout.amount)}); } }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id==='authForm'){
    const em = $('#au-email').value.trim(), pw = $('#au-pass').value;
    const okE = setInvalid('au-email', false) && /.+@.+\..+/.test(em); $('#au-email').closest('.field').classList.toggle('invalid', !okE);
    const okP = pw.length>=6; $('#au-pass').closest('.field').classList.toggle('invalid', !okP);
    if (!okE || !okP) return;
    const n = $('#au-name'); doAuth(n && n.value.trim() ? n.value.trim() : '', em);
  }
  if (f.id==='cardForm'){
    const amt = coAmount();
    if (S.checkout.useCard){ threeDS(amt); return; }
    const n = $('#cc-num').value.replace(/\D/g,''), ex = $('#cc-exp').value, cv = $('#cc-cvc').value, nm = $('#cc-name').value.trim();
    let ok = true;
    ok = setInvalid('f-num', !(n.length>=13 && luhn(n))) && ok;
    const m = ex.match(/^(\d{2})\/(\d{2})$/); ok = setInvalid('f-exp', !(m && +m[1]>=1 && +m[1]<=12 && (+m[2]>26 || (+m[2]===26 && +m[1]>=11)))) && ok;
    ok = setInvalid('f-cvc', !(cv.length>=3)) && ok;
    ok = setInvalid('f-name', nm.length<2) && ok;
    if (!ok){ toast(t('toast.cardBad'), true); return; }
    if ($('#cc-save') && $('#cc-save').checked && !S.cards.some(c=>c.last===n.slice(-4))) S.cards.push({id:'c'+Date.now(), brand:brandOf(n)||'visa', last:n.slice(-4), exp:ex, def:false});
    threeDS(amt);
  }
  if (f.id==='termForm'){ const i = $('#termIn'); A.tcmd(i.value); i.value = ''; }
  if (f.id==='fwForm'){ const port = $('#fw-port').value.trim(), src = $('#fw-src').value.trim()||'0.0.0.0/0', proto = $('#fw-proto').value; if (!port && proto!=='ICMP'){ toast(t('toast.portReq'), true); return; } curSrv().fw.push({id:'f'+Date.now(), proto, port:proto==='ICMP'?'—':port, src, act:$('#fw-act').value}); render(true); toast(t('toast.ruleAdded')); }
  if (f.id==='renameForm'){ const v = $('#srv-name').value.trim(); if (!v) return; const s = curSrv(); S.invoices.forEach(i=>{ if (i.srv===s.name) i.srv = v; }); s.name = v; render(true); toast(t('toast.renamed')); }
  if (f.id==='tkForm'){
    const sj = $('#tk-subj').value.trim(), mg = $('#tk-msg').value.trim();
    setInvalid('f-subj', !sj); setInvalid('f-msg', !mg); if (!sj || !mg) return;
    const id = 't'+(S.tickets.length+1+Math.floor(Math.random()*90));
    S.tickets.unshift({id, subj:sj, status:'open', date:new Date().toISOString(), srv:$('#tk-srv').value, msgs:[{me:true, at:new Date().toISOString(), text:mg}]});
    S.curTicket = id; S.ticketNew = false; render(true); toast(t('toast.tkSent'));
    setTimeout(()=>{ const tk = S.tickets.find(x=>x.id===id); if (!tk) return; tk.msgs.push({me:false, at:new Date().toISOString(), text:'tk.auto'}); tk.status='answered'; if (route()==='support') render(true); }, 3500);
  }
  if (f.id==='replyForm'){ const v = $('#tk-reply').value.trim(); if (!v) return; const tk = S.tickets.find(x=>x.id===S.curTicket); tk.msgs.push({me:true, at:new Date().toISOString(), text:v}); tk.status='open'; render(true); toast(t('toast.replied')); }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ if ($('#modalRoot').classList.contains('open')) closeModal(); else closeMenu(); }
  if (e.key==='Enter' && e.target.id==='ds-code'){ e.preventDefault(); A['m-ok'](); }
});
window.addEventListener('scroll', () => { if (route()==='home'||route()==='pricing') headerOver(); }, {passive:true});
window.addEventListener('resize', () => $$('.seg').forEach(placePill));
window.addEventListener('hashchange', () => { closeModal(); closeMenu(); render(); });

/* init */
if (S.theme==='dark' || S.theme==='light') document.documentElement.setAttribute('data-theme', S.theme);
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>$$('.seg').forEach(placePill));
</script>

</body>
</html>
